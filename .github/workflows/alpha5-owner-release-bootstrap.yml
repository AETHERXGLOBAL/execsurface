name: Alpha5 owner-authorized release bootstrap

on:
  push:
    branches:
      - integration/post-alpha4-promotion-candidate
    paths:
      - .github/workflows/alpha5-owner-release-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

env:
  FROZEN_PRODUCT_SHA: 5067200452c174da6bc8d9d7ecf6957ee379f0a2
  EXPECTED_MAIN_SHA: b47721ce675444ce029b048edce6fc94631d6408
  ALPHA4_SOURCE: 48e0b9a0707553349e75e97a9dfa096d13f9ab5d
  RELEASE_VERSION: 0.1.0-alpha.5
  RELEASE_TAG: v0.1.0-alpha.5
  RELEASE_BRANCH: release/v0.1.0-alpha.5
  RUST_TOOLCHAIN: 1.90.0

concurrency:
  group: alpha5-owner-release-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Materialize exact Alpha.5 release source and dispatch publication
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout release driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: driver
          fetch-depth: 0

      - name: Checkout exact frozen product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FROZEN_PRODUCT_SHA }}
          path: release-src
          fetch-depth: 0

      - name: Verify publication anchors and absence of Alpha.5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -C release-src fetch --force --tags origin main
          test "$(git -C release-src rev-parse HEAD)" = "$FROZEN_PRODUCT_SHA"
          test "$(git -C release-src rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git -C release-src rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git -C release-src rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
          ! git -C release-src show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Alpha.5 GitHub Release already exists; refusing duplicate publication'
            exit 1
          fi
          if git -C release-src ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo '::error::Alpha.5 release branch already exists; refusing ambiguous bootstrap'
            exit 1
          fi

      - name: Merge current main documentation lineage without changing frozen product semantics
        shell: bash
        run: |
          set -euo pipefail
          git -C release-src config user.name 'github-actions[bot]'
          git -C release-src config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C release-src merge --no-ff origin/main -m 'Merge main documentation lineage for Alpha.5 release'
          git -C release-src diff --exit-code "$FROZEN_PRODUCT_SHA" -- 'crates/*/src' 'crates/*/tests' 'action.yml'

      - name: Apply the already-qualified Alpha.5 release transform exactly
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_TAG" > release-src/action/release-tag.txt
          ROOT=release-src python3 - <<'PY'
          import os
          from pathlib import Path
          old='0.1.0-alpha.4'; new='0.1.0-alpha.5'; root=Path(os.environ['ROOT'])
          changed=[]
          for m in root.rglob('Cargo.toml'):
              t=m.read_text()
              u=t.replace(f'version = "{old}"',f'version = "{new}"').replace(f'version = "={old}"',f'version = "={new}"')
              if u != t:
                  m.write_text(u); changed.append(str(m))
          lock=root/'Cargo.lock'
          chunks=lock.read_text().split('[[package]]'); out=[chunks[0]]
          for c in chunks[1:]:
              lines=c.splitlines()
              name=next((x.split('=',1)[1].strip().strip('"') for x in lines if x.startswith('name = ')),None)
              if name and name.startswith('execsurface'):
                  lines=[f'version = "{new}"' if x==f'version = "{old}"' else x for x in lines]
              out.append('\n'.join(lines))
          lock.write_text('[[package]]'.join(out))
          assert changed, 'no Cargo manifest release transforms were applied'
          print('\n'.join(changed))
          PY
          test "$(tr -d '[:space:]' < release-src/action/release-tag.txt)" = "$RELEASE_TAG"

      - name: Add bounded release governance and public notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-src/docs/releases release-src/docs/development release-src/.github/workflows
          cp driver/.github/workflows/release-alpha5.yml release-src/.github/workflows/release-alpha5.yml
          cat > release-src/docs/development/ALPHA5_OWNER_AUTHORIZED_RELEASE_OVERRIDE.md <<'EOF'
          # Alpha.5 Owner-Authorized Release Override

          Date: 2026-10-01

          This record authorizes publication of ExecSurface `v0.1.0-alpha.5` without treating P8 external validation as a pre-publication blocker.

          P8_PREPUBLICATION_GATE_WAIVED_BY_OWNER=true
          EXTERNAL_VALIDATION_CLAIM=false
          FROZEN_PRODUCT_SHA=5067200452c174da6bc8d9d7ecf6957ee379f0a2
          ACCEPTED_A7_RUN=36902486872
          RETAINED_A7_FAILURE_RUN=36901600086

          Boundaries:
          - P8 remains open after release.
          - This waiver does not convert internal evidence into external validation.
          - Existing negative evidence is retained.
          - Public claims remain bounded to tested Linux x86_64 behavior and the recorded observer/authority model.
          - ARM64 support is not claimed.
          - Post-publication verification of the actual public artifact is mandatory.
          - Any post-publication failure must be retained and classified; no silent artifact replacement or history rewrite is authorized.
          EOF
          cat > "release-src/docs/releases/$RELEASE_TAG.md" <<'EOF'
          # ExecSurface v0.1.0-alpha.5

          Fifth public alpha of ExecSurface, the runtime behavioral-integrity and verification layer for observed execution-surface drift.

          ## What this release advances

          - strengthens semantics-preserving handling of the current evidence model and keeps ambiguous or incomplete evidence non-PASS-eligible;
          - strengthens backend/proposition authority boundaries rather than treating a backend name as universal authority;
          - strengthens legitimate-variance handling while preserving anti-poisoning constraints on accepted behavior;
          - strengthens attestation and provenance binding so artifact identity, source identity, and evidence authority remain explicit;
          - carries forward the Alpha.5 usability and packaging work validated by the frozen internal release candidate;
          - uses a reproducible release build on Ubuntu 22.04 with a GLIBC compatibility ceiling intended to remain consumable on both Ubuntu 22.04 and Ubuntu 24.04.

          ## Verification and evidence boundary

          The frozen product source for this release is `5067200452c174da6bc8d9d7ecf6957ee379f0a2`.

          Internal destructive release-artifact qualification passed in accepted run `36902486872`. The earlier failed A7 run `36901600086`, which exposed reproducibility and ABI-portability problems, remains retained evidence; those findings were repaired before the accepted run.

          P8 independent external validation was **not closed before publication**. Publication was explicitly authorized by the owner with P8 waived only as a pre-publication gate. This release therefore does **not** claim independent external validation. P8 remains open for post-release reproduction, criticism, counterexamples, interoperability review, and real-workload evidence.

          ## Public support boundary

          - Linux x86_64 is the public support scope for this alpha.
          - Native ptrace remains the bounded public reference observer for the portable line.
          - ARM64 support is not claimed.
          - Observed behavior is not all possible behavior.
          - ExecSurface is not an antivirus, EDR, SIEM, sandbox, malware detector, or proof of software safety.
          - Incomplete or ambiguous evidence cannot silently become PASS.

          ## Distribution and post-publication checks

          The publication pipeline produces a checksummed and attested GitHub prerelease artifact, verifies clean public consumption on Ubuntu 22.04 and Ubuntu 24.04, proves source/artifact byte equivalence under the recorded deterministic build contract, rejects artifact tampering, verifies immutable tag and Action consumption, and only then moves the stable `v0.1` Action channel and publishes the crate chain.
          EOF

      - name: Install pinned Rust and run final pre-publication source gates
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy
          cd release-src
          cargo +$RUST_TOOLCHAIN fmt --all -- --check
          cargo +$RUST_TOOLCHAIN clippy --locked --workspace --all-targets -- -D warnings
          cargo +$RUST_TOOLCHAIN test --locked --workspace --all-targets
          cargo +$RUST_TOOLCHAIN test --locked --workspace --doc
          version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="execsurface"))')"
          test "$version" = "$RELEASE_VERSION"
          test "$(tr -d '[:space:]' < action/release-tag.txt)" = "$RELEASE_TAG"
          git diff --exit-code "$FROZEN_PRODUCT_SHA" -- 'crates/*/src' 'crates/*/tests' 'action.yml'

      - name: Commit exact release materialization and publish source lineage
        id: source
        shell: bash
        run: |
          set -euo pipefail
          cd release-src
          git add Cargo.toml Cargo.lock crates action/release-tag.txt docs/releases docs/development/ALPHA5_OWNER_AUTHORIZED_RELEASE_OVERRIDE.md .github/workflows/release-alpha5.yml
          git commit -m 'Release: materialize v0.1.0-alpha.5 from frozen qualified source'
          release_sha="$(git rev-parse HEAD)"
          test "$(git merge-base --is-ancestor origin/main HEAD; echo $?)" = 0
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          git push origin "HEAD:refs/heads/main"
          git tag -a "$RELEASE_TAG" "$release_sha" -m "ExecSurface $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Verify public refs before dispatch
        shell: bash
        run: |
          set -euo pipefail
          cd release-src
          git fetch --force --tags origin main "$RELEASE_BRANCH"
          test "$(git rev-parse origin/main)" = "${{ steps.source.outputs.release_sha }}"
          test "$(git rev-parse "origin/$RELEASE_BRANCH")" = "${{ steps.source.outputs.release_sha }}"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "${{ steps.source.outputs.release_sha }}"
          test "$(git rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"

      - name: Dispatch Alpha.5 public release pipeline explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dispatched=0
          for attempt in $(seq 1 12); do
            if gh workflow run release-alpha5.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"; then
              dispatched=1
              break
            fi
            sleep 5
          done
          test "$dispatched" = 1

      - name: Record bootstrap transition
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 117 --repo "$GITHUB_REPOSITORY" --body "Alpha.5 owner-authorized release bootstrap passed. Exact release source: \`${{ steps.source.outputs.release_sha }}\`. Main and \`release/v0.1.0-alpha.5\` now point to that source; immutable tag \`v0.1.0-alpha.5\` was created; the portable public release + post-publication verification workflow was explicitly dispatched. P8 remains open and no external-validation claim is made. Bootstrap run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
