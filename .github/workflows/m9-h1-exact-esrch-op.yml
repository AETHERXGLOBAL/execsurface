name: M9-H1.2 exact ptrace ESRCH operation

on:
  push:
    branches:
      - hardening/m9-ptrace-esrch-just
    paths:
      - .github/workflows/m9-h1-exact-esrch-op.yml
      - scripts/m9_instrument_ptrace_call_esrch.py
      - scripts/m9_apply_ptrace_esrch_fix.py
      - scripts/m9_apply_ptrace_exit_lifecycle.py
      - scripts/m9_apply_ptrace_preregistration_ordering.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize-esrch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUST_TOOLCHAIN: 1.90.0
      JUST_SHA: 5d5742cbcc50f19c99c356bc7e085acaa5f4665d
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout pinned unmodified casey/just
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: casey/just
          ref: ${{ env.JUST_SHA }}
          path: external/just
          fetch-depth: 1
          persist-credentials: false

      - name: Install frozen toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/just rev-parse HEAD)" = "$JUST_SHA"
          test -z "$(git -C external/just status --porcelain)"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt --toolchain "$RUST_TOOLCHAIN"

      - name: Apply same bounded candidate plus exact-op instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/m9_apply_ptrace_esrch_fix.py
          python3 scripts/m9_apply_ptrace_exit_lifecycle.py
          python3 scripts/m9_apply_ptrace_preregistration_ordering.py
          python3 scripts/m9_instrument_ptrace_call_esrch.py
          cargo "+$RUST_TOOLCHAIN" fmt --all
          git diff --check
          cargo "+$RUST_TOOLCHAIN" test -p execsurface-observe
          cargo "+$RUST_TOOLCHAIN" build -p execsurface

      - name: Prime pinned workload directly
        shell: bash
        run: |
          set -euo pipefail
          (cd external/just && cargo "+$RUST_TOOLCHAIN" test --all >/dev/null 2>&1)

      - name: Run until exact ESRCH is localized
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p m9-h1-2-evidence
          : > m9-h1-2-evidence/summary.txt
          found=0
          failed=0
          for attempt in 1 2 3 4 5; do
            set +e
            target/debug/execsurface observe -- \
              /bin/bash -lc \
              "cd external/just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1" \
              > "m9-h1-2-evidence/just-${attempt}.json" \
              2> "m9-h1-2-evidence/just-${attempt}.stderr"
            rc=$?
            set -e
            printf 'attempt=%s rc=%s\n' "$attempt" "$rc" >> m9-h1-2-evidence/summary.txt
            grep -E 'M9_PTRACE_CALL_ESRCH|M9_RESTART_ESRCH|M9_PREREGISTRATION|M9_UNTRACKED|M9_UNEXPECTED|M9_STALE|ExecSurface: ERROR|observer (OS|protocol) error' \
              "m9-h1-2-evidence/just-${attempt}.stderr" \
              | tail -n 120 >> m9-h1-2-evidence/summary.txt || true
            if grep -q 'M9_PTRACE_CALL_ESRCH' "m9-h1-2-evidence/just-${attempt}.stderr"; then
              found=1
            fi
            if [ "$rc" -ne 0 ]; then
              failed=1
              break
            fi
          done
          printf 'localized=%s failed=%s\n' "$found" "$failed" >> m9-h1-2-evidence/summary.txt
          if [ "$failed" -ne 0 ] && [ "$found" -eq 0 ]; then
            echo 'M9_H1_2_FAILURE_WITHOUT_GENERIC_PTRACE_ESRCH_MARKER' >> m9-h1-2-evidence/summary.txt
          fi
          cat m9-h1-2-evidence/summary.txt
          test "$found" -eq 1

      - name: Seal evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'head_sha=%s\n' "$GITHUB_SHA"
            printf 'just_sha=%s\n' "$JUST_SHA"
            printf 'rust_toolchain=%s\n' "$RUST_TOOLCHAIN"
            printf 'kernel=%s\n' "$(uname -srmo)"
          } > m9-h1-2-evidence/environment.txt
          find m9-h1-2-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > m9-h1-2-evidence/SHA256SUMS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m9-h1-2-exact-esrch-${{ github.run_id }}-${{ github.run_attempt }}
          path: m9-h1-2-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Preserve summary in GitHub
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="docs/milestones/evidence/m9-h1-2/run-${GITHUB_RUN_ID}"
          mkdir -p "$evidence_dir"
          cp m9-h1-2-evidence/environment.txt "$evidence_dir/environment.txt"
          cp m9-h1-2-evidence/SHA256SUMS "$evidence_dir/SHA256SUMS"
          [ ! -f m9-h1-2-evidence/summary.txt ] || cp m9-h1-2-evidence/summary.txt "$evidence_dir/summary.txt"
          git add "$evidence_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "M9-H1.2: preserve exact ESRCH operation run ${GITHUB_RUN_ID}"
            git push origin HEAD:hardening/m9-ptrace-esrch-just
          fi
