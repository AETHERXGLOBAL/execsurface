name: P4 A0-A1 authority model

on:
  push:
    branches:
      - development/post-alpha4-behavioral-integrity
    paths:
      - ".github/workflows/p4-a0-a1-authority.yml"
      - "experiments/p4-backend-authority/**"
      - "docs/development/P4_BACKEND_AUTHORITY_PROTOCOL.md"
      - "docs/development/P4_A0_PROPOSITION_INVENTORY.md"
      - "docs/development/P4_A0_REVIEW_RESULT.md"
      - "docs/development/P4_A1_PTRACE_ADAPTER_PROTOCOL.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_TOOLCHAIN: 1.90.0
      EVIDENCE_ROOT: p4-a1-authority-evidence
    steps:
      - name: Checkout isolated development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy

      - name: Verify P4 frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          grep -q 'PREREGISTERED — P4-A0 CONTRACT FREEZE' docs/development/P4_BACKEND_AUTHORITY_PROTOCOL.md
          grep -q 'P4_A0_PROPOSITION_CONTRACT_ACCEPTED_BOUNDED' docs/development/P4_A0_REVIEW_RESULT.md
          grep -q 'PREREGISTERED — IMPLEMENTATION MAY START' docs/development/P4_A1_PTRACE_ADAPTER_PROTOCOL.md
          test "$(git rev-parse --abbrev-ref HEAD)" = "development/post-alpha4-behavioral-integrity"
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" | tee "$EVIDENCE_ROOT/source.txt"
          printf 'canonical_experiment=experiments/p4-backend-authority\n' | tee -a "$EVIDENCE_ROOT/source.txt"

      - name: Generate isolated dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p4-backend-authority/Cargo.toml \
            2>&1 | tee "$EVIDENCE_ROOT/lockfile.log"

      - name: Rustfmt canonical authority model
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN fmt --manifest-path experiments/p4-backend-authority/Cargo.toml -- --check \
            2>&1 | tee "$EVIDENCE_ROOT/rustfmt.log"

      - name: Clippy deny warnings
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN clippy --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --all-targets -- -D warnings \
            2>&1 | tee "$EVIDENCE_ROOT/clippy.log"

      - name: Run canonical authority falsification tests
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml -- --nocapture \
            2>&1 | tee "$EVIDENCE_ROOT/authority-tests.log"
          grep -q 'test result: ok. 8 passed; 0 failed' "$EVIDENCE_ROOT/authority-tests.log"

      - name: Re-prove Semantics v3 model
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-model --all-targets \
            2>&1 | tee "$EVIDENCE_ROOT/semantics-v3.log"

      - name: Re-prove public shared-FD contract
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-observe --test m11_shared_fd_ambiguity \
            2>&1 | tee "$EVIDENCE_ROOT/public-m11.log"
          grep -q 'test result: ok. 6 passed; 0 failed' "$EVIDENCE_ROOT/public-m11.log"

      - name: Record bounded stage decision
        shell: bash
        run: |
          set -euo pipefail
          printf 'P4_A1_1_AUTHORITY_MODEL_PASS_RESEARCH_ONLY\n' | tee "$EVIDENCE_ROOT/A1_1_DECISION.txt"

      - name: Seal evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          find "$EVIDENCE_ROOT" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_ROOT/SHA256SUMS"

      - name: Upload authority evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p4-a1-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: p4-a1-authority-evidence
          if-no-files-found: error
          retention-days: 30
