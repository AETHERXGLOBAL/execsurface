name: Post-M9 ptrace memory-read Candidate B parity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/post-m9-ptrace-memory-read-b-parity.yml
      - experiments/post_m9_memory_read_batching/apply_candidate_b.py
      - experiments/post_m9_memory_read_batching/b_helper.c
      - experiments/post_m9_memory_read_batching/b_parity.py
      - docs/milestones/POST_M9_PTRACE_MEMORY_READ_BATCHING_PROTOCOL.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-parity-and-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RUST_TOOLCHAIN: 1.90.0
      REF_BIN: /tmp/execsurface-b-reference
      CAND_BIN: /tmp/execsurface-b-candidate
      B_HELPER: /tmp/execsurface-b-helper
      FIXTURE_BIN: /tmp/execsurface-b-fixture
      EVIDENCE: post-m9-ptrace-memory-read-b-parity

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc strace
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'kernel=%s\n' "$(uname -srmo)"
            printf 'arch=%s\n' "$(uname -m)"
            printf 'candidate=B\n'
            printf 'mechanism=bounded_process_vm_readv_with_reference_fallback\n'
            printf 'performance_evaluated=false\n'
            printf 'public_runtime_modified=false\n'
          } > "$EVIDENCE/environment.txt"

      - name: Build frozen reference and adversarial helpers
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" build --locked --release -p execsurface --bin execsurface
          cp target/release/execsurface "$REF_BIN"
          cargo "+$RUST_TOOLCHAIN" build --locked --release -p execsurface-observe --bin execsurface-fixture
          cp target/release/execsurface-fixture "$FIXTURE_BIN"
          gcc -O2 -Wall -Wextra -Werror -pthread \
            experiments/post_m9_memory_read_batching/b_helper.c -o "$B_HELPER"
          sha256sum "$REF_BIN" "$FIXTURE_BIN" "$B_HELPER" \
            experiments/post_m9_memory_read_batching/b_helper.c \
            experiments/post_m9_memory_read_batching/b_parity.py \
            > "$EVIDENCE/reference-inputs.sha256"

      - name: Apply Candidate B only inside runner
        shell: bash
        run: |
          set -euo pipefail
          cp crates/execsurface-observe/src/linux_ptrace.rs "$EVIDENCE/linux_ptrace.reference.rs"
          python3 experiments/post_m9_memory_read_batching/apply_candidate_b.py
          cargo "+$RUST_TOOLCHAIN" fmt --all
          git diff --check
          git diff -- crates/execsurface-observe/src/linux_ptrace.rs > "$EVIDENCE/candidate-b.patch"
          test -s "$EVIDENCE/candidate-b.patch"
          sha256sum experiments/post_m9_memory_read_batching/apply_candidate_b.py \
            "$EVIDENCE/candidate-b.patch" > "$EVIDENCE/candidate-inputs.sha256"

      - name: Candidate regression build gate
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" clippy --locked -p execsurface-observe --all-targets -- -D warnings
          cargo "+$RUST_TOOLCHAIN" test --locked -p execsurface-observe --all-targets
          cargo "+$RUST_TOOLCHAIN" build --locked --release -p execsurface --bin execsurface
          cp target/release/execsurface "$CAND_BIN"
          sha256sum "$CAND_BIN" >> "$EVIDENCE/candidate-inputs.sha256"

      - name: Dedicated memory-read adversarial parity
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/post_m9_memory_read_batching/b_parity.py \
            "$REF_BIN" "$CAND_BIN" "$B_HELPER" "$EVIDENCE"

      - name: Concurrent production semantic parity
        shell: bash
        run: |
          set -euo pipefail
          lane="$EVIDENCE/concurrent"
          mkdir -p "$lane"
          fixed=/tmp/execsurface-b-thread-read-fixed
          printf 'fixture' > "$fixed"

          run_observe() {
            local exe="$1" name="$2"
            printf 'fixture' > "$fixed"
            "$exe" observe -- "$FIXTURE_BIN" thread-read "$fixed" 8 > "$lane/${name}.observe.json"
          }
          run_observe "$REF_BIN" reference1
          run_observe "$REF_BIN" reference2
          run_observe "$CAND_BIN" candidate

          python3 - "$lane/reference1.observe.json" "$lane/reference2.observe.json" "$lane/candidate.observe.json" <<'PY'
          import json,sys
          for p in sys.argv[1:]:
              d=json.load(open(p))
              if d.get('complete') is not True:
                  raise SystemExit(f'incomplete: {p}')
              if d.get('warnings') != []:
                  raise SystemExit(f'warnings: {p}: {d.get("warnings")}')
              if d.get('outcome') != {'exit_code':0,'signal':None}:
                  raise SystemExit(f'outcome mismatch: {p}: {d.get("outcome")}')
          print('concurrent health gate: PASS')
          PY

          printf 'fixture' > "$fixed"
          "$REF_BIN" learn --output "$lane/reference.lock.json" -- "$FIXTURE_BIN" thread-read "$fixed" 8 > "$lane/reference.learn.txt"
          for n in 1 2; do
            printf 'fixture' > "$fixed"
            "$REF_BIN" check --baseline "$lane/reference.lock.json" --diff-only --json -- \
              "$FIXTURE_BIN" thread-read "$fixed" 8 > "$lane/reference.check${n}.json"
          done
          printf 'fixture' > "$fixed"
          "$CAND_BIN" check --baseline "$lane/reference.lock.json" --diff-only --json -- \
            "$FIXTURE_BIN" thread-read "$fixed" 8 > "$lane/reference-to-candidate.json"
          printf 'fixture' > "$fixed"
          "$CAND_BIN" learn --output "$lane/candidate.lock.json" -- "$FIXTURE_BIN" thread-read "$fixed" 8 > "$lane/candidate.learn.txt"
          printf 'fixture' > "$fixed"
          "$REF_BIN" check --baseline "$lane/candidate.lock.json" --diff-only --json -- \
            "$FIXTURE_BIN" thread-read "$fixed" 8 > "$lane/candidate-to-reference.json"

          python3 - "$lane/reference.check1.json" "$lane/reference.check2.json" \
            "$lane/reference-to-candidate.json" "$lane/candidate-to-reference.json" <<'PY'
          import json,sys
          summary=[]
          for p in sys.argv[1:]:
              d=json.load(open(p))
              counts={k:len(d.get(k,[])) for k in ('added','removed','changed')}
              if any(counts.values()):
                  raise SystemExit(f'production semantic drift: {p}: {counts}')
              if d.get('target') != {'exit_code':0,'signal':None}:
                  raise SystemExit(f'target mismatch: {p}: {d.get("target")}')
              summary.append({'file':p,'counts':counts})
          open('post-m9-ptrace-memory-read-b-parity/concurrent/summary.json','w').write(
              json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Activation and privacy-footprint diagnostic
        shell: bash
        run: |
          set -euo pipefail
          root="$EVIDENCE/activation"
          mkdir -p "$root"
          for mode in reference candidate; do
            if [ "$mode" = reference ]; then exe="$REF_BIN"; else exe="$CAND_BIN"; fi
            for case in string-short fixed-openat2-normal; do
              strace -f -qq -s 256 -o "$root/${mode}-${case}.strace" \
                -e trace=ptrace,process_vm_readv \
                "$exe" observe -- "$B_HELPER" "$case" \
                > "$root/${mode}-${case}.json" \
                2> "$root/${mode}-${case}.stderr"
            done
          done

          python3 - "$root" <<'PY'
          import json,re,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          cases=('string-short','fixed-openat2-normal')
          result={}
          for mode in ('reference','candidate'):
              result[mode]={}
              for case in cases:
                  d=json.load(open(root/f'{mode}-{case}.json'))
                  if d.get('complete') is not True or d.get('outcome') != {'exit_code':0,'signal':None}:
                      raise SystemExit(f'activation health failure: {mode}-{case}')
                  text=(root/f'{mode}-{case}.strace').read_text(errors='replace')
                  result[mode][case]={
                      'peekdata':len(re.findall(r'ptrace\(PTRACE_PEEKDATA,',text)),
                      'process_vm_readv':len(re.findall(r'\bprocess_vm_readv\(',text)),
                  }
          for case in cases:
              r=result['reference'][case]
              c=result['candidate'][case]
              if r['process_vm_readv'] != 0:
                  raise SystemExit(f'reference unexpectedly used process_vm_readv: {case}')
              if c['process_vm_readv'] <= 0:
                  raise SystemExit(f'candidate process_vm_readv not activated: {case}')
              if c['peekdata'] >= r['peekdata']:
                  raise SystemExit(f'candidate did not reduce PEEKDATA: {case}: ref={r} cand={c}')

          string_text=(root/'candidate-string-short.strace').read_text(errors='replace')
          string_lens=[int(x) for x in re.findall(r'iov_len=(\d+)',string_text)]
          if not string_lens or max(string_lens) > 8:
              raise SystemExit(f'C-string remote/local request footprint exceeded c_long: {string_lens[:20]}')

          fixed_text=(root/'candidate-fixed-openat2-normal.strace').read_text(errors='replace')
          fixed_lens=[int(x) for x in re.findall(r'iov_len=(\d+)',fixed_text)]
          if 24 not in fixed_lens:
              raise SystemExit(f'24-byte fixed metadata batch not observed: {fixed_lens[:40]}')

          result['privacy']={'string_iov_max':max(string_lens),'required_max':8,'pass':True}
          result['fixed_batch_24_observed']=True
          result['classification']='ACTIVATION_AND_PRIVACY_DIAGNOSTIC_PASS'
          (root/'summary.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Record evidence identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short > "$EVIDENCE/working-tree-status.txt" || true
          sha256sum "$EVIDENCE/candidate-b.patch" > "$EVIDENCE/candidate-b.patch.sha256" || true

      - name: Upload Candidate B parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-m9-ptrace-memory-read-b-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: post-m9-ptrace-memory-read-b-parity
          if-no-files-found: error
          retention-days: 30
