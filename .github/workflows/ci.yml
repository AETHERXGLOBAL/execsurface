name: CI

on:
  push:
    branches:
      - main
      - "milestone/**"
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust / Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain evidence
        run: |
          uname -a
          rustc --version --verbose
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Dependency lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
