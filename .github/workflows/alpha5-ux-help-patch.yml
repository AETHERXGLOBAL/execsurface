name: Alpha5 one-shot CLI help UX patch

on:
  push:
    branches:
      - release/v0.1.0-alpha.5-hardening
    paths:
      - '.github/workflows/alpha5-ux-help-patch.yml'

permissions:
  contents: write

jobs:
  exact-help-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Replace exactly one top-level usage fragment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/execsurface-cli/src/main.rs')
          s = p.read_text()
          old = '''usage:\\n  execsurface observe -- COMMAND [ARGS...]\\n  execsurface observe --backend experimental-libbpf --collector PATH -- COMMAND [ARGS...]\\n  execsurface learn [OPTIONS] -- COMMAND [ARGS...]\\n\\nobserve options:'''
          new = '''usage:\\n  execsurface doctor\\n  execsurface init [OPTIONS]\\n  execsurface observe -- COMMAND [ARGS...]\\n  execsurface observe --backend experimental-libbpf --collector PATH -- COMMAND [ARGS...]\\n  execsurface learn [OPTIONS] -- COMMAND [ARGS...]\\n  execsurface check [OPTIONS] -- COMMAND [ARGS...]\\n\\nobserve options:'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one usage fragment, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- crates/execsurface-cli/src/main.rs
      - name: Commit bounded UX correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'crates/execsurface-cli/src/main.rs'
          git config user.name 'aetherx-alpha5-hardening'
          git config user.email 'aetherx-alpha5-hardening@users.noreply.github.com'
          git add crates/execsurface-cli/src/main.rs
          git commit -m 'Alpha5: expose public commands in CLI help'
          git push origin HEAD:release/v0.1.0-alpha.5-hardening
