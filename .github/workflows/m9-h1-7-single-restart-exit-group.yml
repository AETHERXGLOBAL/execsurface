name: M9-H1.7 single-restart exit-group closure

on:
  push:
    branches:
      - hardening/m9-ptrace-esrch-just
    paths:
      - scripts/m9_h1_7_apply_single_restart_after_syscall_info_esrch.py
      - .github/workflows/m9-h1-7-single-restart-exit-group.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-single-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_TOOLCHAIN: 1.90.0
      JUST_SHA: 5d5742cbcc50f19c99c356bc7e085acaa5f4665d
      SOURCE: crates/execsurface-observe/src/linux_ptrace.rs
      PRODUCTION_BASE_SHA256: 3dc656358a3675a0d78135bb83046bc45c33dca2718c8bd8b68fa090e18eac8b
      FIXTURE_TIMEOUT_SECONDS: 10
      JUST_TIMEOUT_SECONDS: 120
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned unmodified casey just
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: casey/just
          ref: ${{ env.JUST_SHA }}
          path: external/just
          fetch-depth: 1
          persist-credentials: false

      - name: Install frozen Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt --toolchain "$RUST_TOOLCHAIN"
          test "$(git -C external/just rev-parse HEAD)" = "$JUST_SHA"
          test -z "$(git -C external/just status --porcelain)"

      - name: Reconstruct production-clean hanging baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m9-h1-7-evidence
          python3 scripts/m9_apply_ptrace_esrch_fix.py
          python3 scripts/m9_apply_ptrace_exit_lifecycle.py
          python3 scripts/m9_apply_ptrace_preregistration_ordering.py
          python3 scripts/m9_apply_get_syscall_info_exit_group_fix.py
          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 "$SOURCE"
          python3 scripts/m9_finalize_ptrace_lifecycle_core.py
          actual="$(sha256sum "$SOURCE" | awk '{print $1}')"
          printf 'production_base_expected=%s\nproduction_base_actual=%s\n' \
            "$PRODUCTION_BASE_SHA256" "$actual" \
            | tee m9-h1-7-evidence/base-source-hash.txt
          test "$actual" = "$PRODUCTION_BASE_SHA256"

      - name: Apply bounded single-restart experiment without in-race logging
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/m9_h1_7_apply_single_restart_after_syscall_info_esrch.py
          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 "$SOURCE"
          git diff --check
          test "$(grep -c 'eprintln!' "$SOURCE")" -eq 1
          grep -q 'M9_H1_7_BOUNDED_GET_SYSCALL_INFO_ESRCH_RESTARTS' "$SOURCE"
          git diff -- "$SOURCE" > m9-h1-7-evidence/candidate.diff
          cp "$SOURCE" m9-h1-7-evidence/linux_ptrace.h1_7.rs
          printf 'candidate_sha256=%s\n' "$(sha256sum "$SOURCE" | awk '{print $1}')" \
            | tee m9-h1-7-evidence/candidate-source-hash.txt

      - name: Build fixtures and run unchanged observer regression suite
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/fixtures/m9/exit_group_sched_getaffinity_race.c \
            -o /tmp/m9-h1-7-exit-group-race
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/fixtures/m9/thread_lifecycle_repro.c \
            -o /tmp/m9-h1-7-thread-lifecycle-repro
          cargo "+$RUST_TOOLCHAIN" test -p execsurface-observe \
            2>&1 | tee m9-h1-7-evidence/observer-tests.log
          cargo "+$RUST_TOOLCHAIN" build -p execsurface \
            2>&1 | tee m9-h1-7-evidence/build.log

      - name: Stress single restart on amplified exit-group race 240 times
        shell: bash
        run: |
          set -uo pipefail
          : > m9-h1-7-evidence/exit-group-summary.txt
          total_restarts=0
          for attempt in $(seq 1 240); do
            set +e
            timeout --signal=TERM --kill-after=2s "${FIXTURE_TIMEOUT_SECONDS}s" \
              target/debug/execsurface observe -- /tmp/m9-h1-7-exit-group-race \
              > "m9-h1-7-evidence/exit-group-${attempt}.json" \
              2> "m9-h1-7-evidence/exit-group-${attempt}.stderr"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              printf 'FAIL attempt=%s rc=%s\n' "$attempt" "$rc" \
                | tee -a m9-h1-7-evidence/exit-group-summary.txt
              cat "m9-h1-7-evidence/exit-group-${attempt}.stderr" >&2 || true
              exit 1
            fi
            marker_count=$(grep -c '^M9_H1_7_BOUNDED_GET_SYSCALL_INFO_ESRCH_RESTARTS count=' \
              "m9-h1-7-evidence/exit-group-${attempt}.stderr" || true)
            test "$marker_count" -eq 1
            restart_count=$(sed -n 's/^M9_H1_7_BOUNDED_GET_SYSCALL_INFO_ESRCH_RESTARTS count=\([0-9][0-9]*\)$/\1/p' \
              "m9-h1-7-evidence/exit-group-${attempt}.stderr")
            test -n "$restart_count"
            test "$(wc -l < "m9-h1-7-evidence/exit-group-${attempt}.stderr")" -eq 1
            total_restarts=$((total_restarts + restart_count))
            python3 - "$attempt" <<'PY'
          import json, sys
          from pathlib import Path
          attempt = sys.argv[1]
          path = Path(f"m9-h1-7-evidence/exit-group-{attempt}.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("complete") is True, (path, data.get("warnings"))
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, (path, outcome)
          assert outcome.get("signal") is None, (path, outcome)
          PY
            printf 'attempt=%s rc=0 complete=true exit=0 bounded_restarts=%s\n' \
              "$attempt" "$restart_count" >> m9-h1-7-evidence/exit-group-summary.txt
          done
          printf 'complete_runs=240\ntotal_bounded_restarts=%s\n' "$total_restarts" \
            >> m9-h1-7-evidence/exit-group-summary.txt
          cat m9-h1-7-evidence/exit-group-summary.txt
          test "$total_restarts" -ge 5

      - name: Re-prove pre-registration lifecycle 12 times
        shell: bash
        run: |
          set -uo pipefail
          : > m9-h1-7-evidence/prereg-summary.txt
          for attempt in $(seq 1 12); do
            set +e
            timeout --signal=TERM --kill-after=2s "${FIXTURE_TIMEOUT_SECONDS}s" \
              target/debug/execsurface observe -- \
              /tmp/m9-h1-7-thread-lifecycle-repro 12 16 4 \
              > "m9-h1-7-evidence/prereg-${attempt}.stdout" \
              2> "m9-h1-7-evidence/prereg-${attempt}.stderr"
            rc=$?
            set -e
            test "$rc" -eq 0
            restart_count=$(sed -n 's/^M9_H1_7_BOUNDED_GET_SYSCALL_INFO_ESRCH_RESTARTS count=\([0-9][0-9]*\)$/\1/p' \
              "m9-h1-7-evidence/prereg-${attempt}.stderr")
            test -n "$restart_count"
            test "$(wc -l < "m9-h1-7-evidence/prereg-${attempt}.stderr")" -eq 1
            python3 - "$attempt" <<'PY'
          import json, sys
          from pathlib import Path
          attempt = sys.argv[1]
          raw = Path(f"m9-h1-7-evidence/prereg-{attempt}.stdout").read_text(encoding="utf-8")
          marker = raw.find("\n{")
          assert marker >= 0, raw[:300]
          data = json.loads(raw[marker + 1:])
          assert data.get("complete") is True, data.get("warnings")
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, outcome
          assert outcome.get("signal") is None, outcome
          PY
            printf 'attempt=%s complete=true exit=0 bounded_restarts=%s\n' \
              "$attempt" "$restart_count" >> m9-h1-7-evidence/prereg-summary.txt
          done

      - name: Prime pinned external workload directly
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s \
            bash -lc "cd external/just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1"

      - name: Prove pinned casey just five consecutive times
        shell: bash
        run: |
          set -uo pipefail
          : > m9-h1-7-evidence/just-summary.txt
          for attempt in 1 2 3 4 5; do
            set +e
            timeout --signal=TERM --kill-after=5s "${JUST_TIMEOUT_SECONDS}s" \
              target/debug/execsurface observe -- \
              /bin/bash -lc \
              "cd external/just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1" \
              > "m9-h1-7-evidence/just-${attempt}.json" \
              2> "m9-h1-7-evidence/just-${attempt}.stderr"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              cat "m9-h1-7-evidence/just-${attempt}.stderr" >&2 || true
              exit 1
            fi
            restart_count=$(sed -n 's/^M9_H1_7_BOUNDED_GET_SYSCALL_INFO_ESRCH_RESTARTS count=\([0-9][0-9]*\)$/\1/p' \
              "m9-h1-7-evidence/just-${attempt}.stderr")
            test -n "$restart_count"
            test "$(wc -l < "m9-h1-7-evidence/just-${attempt}.stderr")" -eq 1
            python3 - "$attempt" <<'PY'
          import json, sys
          from pathlib import Path
          attempt = sys.argv[1]
          data = json.loads(Path(f"m9-h1-7-evidence/just-{attempt}.json").read_text(encoding="utf-8"))
          assert data.get("complete") is True, data.get("warnings")
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, outcome
          assert outcome.get("signal") is None, outcome
          PY
            printf 'attempt=%s complete=true exit=0 bounded_restarts=%s\n' \
              "$attempt" "$restart_count" >> m9-h1-7-evidence/just-summary.txt
          done
          cat m9-h1-7-evidence/just-summary.txt

      - name: Seal evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'head_sha=%s\n' "$GITHUB_SHA"
            printf 'just_sha=%s\n' "$JUST_SHA"
            printf 'rust_toolchain=%s\n' "$RUST_TOOLCHAIN"
            printf 'kernel=%s\n' "$(uname -srmo)"
            printf 'candidate_sha256=%s\n' "$(sha256sum "$SOURCE" 2>/dev/null | awk '{print $1}')"
          } > m9-h1-7-evidence/environment.txt
          find m9-h1-7-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > m9-h1-7-evidence/SHA256SUMS

      - name: Upload H1.7 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m9-h1-7-single-restart-${{ github.run_id }}-${{ github.run_attempt }}
          path: m9-h1-7-evidence
          if-no-files-found: error
          retention-days: 30
