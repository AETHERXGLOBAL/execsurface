name: P4 B cross-proposition falsification gate

on:
  push:
    branches: [development/post-alpha4-behavioral-integrity]
    paths:
      - 'experiments/p4-backend-authority/**'
      - 'docs/development/P4_B_CROSS_PROPOSITION_PROTOCOL.md'
      - '.github/workflows/p4-b-cross-proposition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-proposition:
    runs-on: ubuntu-24.04
    env:
      RUST_TOOLCHAIN: 1.90.0
      EVIDENCE_ROOT: p4-b-cross-proposition-evidence
      B3_ACCEPTED_SOURCE: d82d1501f69658793df4737dace420c5add4be0c
      ALPHA4_SOURCE: 48e0b9a0707553349e75e97a9dfa096d13f9ab5d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}

      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy

      - name: Verify frozen boundaries
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          git merge-base --is-ancestor "$B3_ACCEPTED_SOURCE" HEAD
          test "$(git rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
          if git diff --name-only "$B3_ACCEPTED_SOURCE"..HEAD | grep -q '^crates/'; then exit 1; fi
          grep -q 'PREREGISTERED — JOINT FALSIFICATION ONLY' docs/development/P4_B_CROSS_PROPOSITION_PROTOCOL.md
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" | tee "$EVIDENCE_ROOT/source.txt"
          printf 'b3_accepted_source=%s\n' "$B3_ACCEPTED_SOURCE" | tee -a "$EVIDENCE_ROOT/source.txt"
          printf 'alpha4_source=%s\n' "$ALPHA4_SOURCE" | tee -a "$EVIDENCE_ROOT/source.txt"

      - name: Lock and static gates
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p4-backend-authority/Cargo.toml
          cargo +$RUST_TOOLCHAIN fmt --manifest-path experiments/p4-backend-authority/Cargo.toml -- --check 2>&1 | tee "$EVIDENCE_ROOT/rustfmt.log"
          cargo +$RUST_TOOLCHAIN clippy --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --all-targets -- -D warnings 2>&1 | tee "$EVIDENCE_ROOT/clippy.log"

      - name: Execute frozen 12-test cross-proposition corpus
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b_cross_proposition_falsification -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/cross.log"
          grep -q 'test result: ok. 12 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' "$EVIDENCE_ROOT/cross.log"

      - name: Reprove backend-name anti-inflation
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --lib a0_backend_name_never_upgrades_weak_evidence -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/backend-name.log"
          grep -q 'test result: ok. 1 passed; 0 failed' "$EVIDENCE_ROOT/backend-name.log"

      - name: Reprove B0 B1 B2 B3 research contracts
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b0_success_evidence -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b0.log"
          grep -q 'test result: ok. 18 passed; 0 failed' "$EVIDENCE_ROOT/b0.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b1_open_object -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b1-model.log"
          grep -q 'test result: ok. 24 passed; 0 failed' "$EVIDENCE_ROOT/b1-model.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b1_ptrace_open_live -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b1-live.log"
          grep -q 'test result: ok. 10 passed; 0 failed' "$EVIDENCE_ROOT/b1-live.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b2_rename_delete -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b2-model.log"
          grep -q 'test result: ok. 23 passed; 0 failed' "$EVIDENCE_ROOT/b2-model.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b2_ptrace_rename_delete_live -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b2-live.log"
          grep -q 'test result: ok. 10 passed; 0 failed' "$EVIDENCE_ROOT/b2-live.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b3_connect_destination -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b3-model.log"
          grep -q 'test result: ok. 20 passed; 0 failed' "$EVIDENCE_ROOT/b3-model.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b3_ptrace_connect_live -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b3-live.log"
          grep -q 'test result: ok. 10 passed; 0 failed' "$EVIDENCE_ROOT/b3-live.log"

      - name: Reprove authority matrix and adversarial predecessors
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test a2_authority_gap_matrix -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/a2.log"
          grep -q 'test result: ok. 16 passed; 0 failed' "$EVIDENCE_ROOT/a2.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test attempt_authority_contract -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/a1-3u.log"
          grep -q 'test result: ok. 5 passed; 0 failed' "$EVIDENCE_ROOT/a1-3u.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test ptrace_v2_adversarial -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/a1-adversarial.log"
          grep -q 'test result: ok. 18 passed; 0 failed' "$EVIDENCE_ROOT/a1-adversarial.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test ptrace_v2_mapping -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/a1-mapping.log"
          grep -q 'test result: ok. 10 passed; 0 failed' "$EVIDENCE_ROOT/a1-mapping.log"

      - name: Reprove Semantics v3 and public M11
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-model --all-targets 2>&1 | tee "$EVIDENCE_ROOT/semantics-v3.log"
          grep -q 'test result: ok. 7 passed; 0 failed' "$EVIDENCE_ROOT/semantics-v3.log"
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-observe --test m11_shared_fd_ambiguity 2>&1 | tee "$EVIDENCE_ROOT/public-m11.log"
          grep -q 'test result: ok. 6 passed; 0 failed' "$EVIDENCE_ROOT/public-m11.log"

      - name: Record candidate decision only after full gate
        run: |
          set -euo pipefail
          printf 'P4_B_CROSS_EXECUTION_PASS_CANDIDATE\n' | tee "$EVIDENCE_ROOT/CANDIDATE.txt"

      - name: Seal evidence
        if: always()
        run: |
          set -uo pipefail
          find "$EVIDENCE_ROOT" -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_ROOT/SHA256SUMS"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p4-b-cross-${{ github.run_id }}-${{ github.run_attempt }}
          path: p4-b-cross-proposition-evidence
          if-no-files-found: error
          retention-days: 30
