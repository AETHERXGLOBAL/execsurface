name: Publish ExecSurface to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish registry chain
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify release identity
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="execsurface"))')"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$GITHUB_REF_NAME" = "$(tr -d '[:space:]' < action/release-tag.txt)"
          test -n "$CARGO_REGISTRY_TOKEN"

      - name: Full source and packaging gates
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo publish -p execsurface-model --locked --dry-run

      - name: Publish crates in dependency order
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          wait_for_crate() {
            crate="$1"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error                 "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
                echo "$crate $version is visible on crates.io"
                return 0
              fi
              echo "Waiting for $crate $version to become visible (attempt $attempt/30)"
              sleep 10
            done
            echo "::error::$crate $version did not become visible on crates.io"
            return 1
          }

          publish_one() {
            crate="$1"
            cargo publish -p "$crate" --locked
            wait_for_crate "$crate"
          }

          publish_one execsurface-model
          publish_one execsurface-observe
          publish_one execsurface-normalize
          publish_one execsurface-baseline
          publish_one execsurface-diff
          publish_one execsurface-policy
          publish_one execsurface-report
          publish_one execsurface

      - name: Prove zero-contact registry install
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="$RUNNER_TEMP/crates-io-consumer"
          cargo install execsurface --version "=$version" --locked --root "$root"
          test "$("$root/bin/execsurface" --version)" = "execsurface $version"
          work="$RUNNER_TEMP/crates-io-work"
          mkdir -p "$work"
          cd "$work"
          "$root/bin/execsurface" doctor
          "$root/bin/execsurface" learn -- /bin/bash -lc true
          "$root/bin/execsurface" check -- /bin/bash -lc true
