name: M9 External Workload - casey just

on:
  push:
    branches:
      - "milestone/m9-independent-adoption"
    paths:
      - ".github/workflows/m9-just-external-workload.yml"
      - "docs/milestones/M9_EXTERNAL_ADOPTION_PROTOCOL.md"
      - "docs/milestones/M9_TARGET_QUALIFICATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  just-l0:
    name: just pinned L0 compatibility and performance evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      JUST_SHA: 5d5742cbcc50f19c99c356bc7e085acaa5f4665d
      RUST_TOOLCHAIN: 1.90.0
      EXECSURFACE_VERSION: 0.1.0-alpha.2
      M9_PRIVATE_SENTINEL: M9_PRIVATE_SENTINEL_JUST_20260926_7f31c9

    steps:
      - name: Checkout pinned upstream just without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: casey/just
          ref: ${{ env.JUST_SHA }}
          path: external/just
          persist-credentials: false

      - name: Verify pinned target and install toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/just rev-parse HEAD)" = "$JUST_SHA"
          test -f external/just/Cargo.lock
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustc "+$RUST_TOOLCHAIN" --version --verbose
          cargo "+$RUST_TOOLCHAIN" --version
          uname -a

      - name: Fresh install public ExecSurface from crates.io
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/execsurface-m9"
          cargo "+$RUST_TOOLCHAIN" install execsurface \
            --version "=$EXECSURFACE_VERSION" \
            --locked \
            --root "$root"
          bin="$root/bin/execsurface"
          test "$("$bin" --version)" = "execsurface $EXECSURFACE_VERSION"
          "$bin" doctor
          echo "EXECSURFACE_BIN=$bin" >> "$GITHUB_ENV"

      - name: Reproduce upstream-defined test workload directly
        shell: bash
        run: |
          set -euo pipefail
          cd external/just
          cargo "+$RUST_TOOLCHAIN" test --all

      - name: Initialize M9 evidence ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m9-evidence/just/raw-observe
          {
            echo "evidence_level=L0"
            echo "independence_class=ZERO_CONTACT_EXTERNAL_REPRO"
            echo "upstream=casey/just"
            echo "upstream_commit=$JUST_SHA"
            echo "workload=cargo +$RUST_TOOLCHAIN test --all"
            echo "execsurface=$("$EXECSURFACE_BIN" --version)"
            echo "install=cargo install execsurface --version =$EXECSURFACE_VERSION --locked"
            echo "rustc=$(rustc +$RUST_TOOLCHAIN --version)"
            echo "cargo=$(cargo +$RUST_TOOLCHAIN --version)"
            echo "runner=$(uname -srvmo)"
            echo "upstream_contact=none"
            echo "upstream_push=none"
          } > m9-evidence/just/environment.txt

      - name: Measure frozen direct versus ptrace observe protocol
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import statistics
          import subprocess
          import time
          from pathlib import Path

          root = Path.cwd()
          out = root / "m9-evidence" / "just"
          raw = out / "raw-observe"
          exe = os.environ["EXECSURFACE_BIN"]
          toolchain = os.environ["RUST_TOOLCHAIN"]
          sentinel = os.environ["M9_PRIVATE_SENTINEL"]
          workload = f"cd external/just && cargo +{toolchain} test --all >/dev/null 2>&1"
          target = ["/bin/bash", "-lc", workload]

          env = os.environ.copy()
          env["M9_PRIVATE_SENTINEL"] = sentinel

          def timed_direct():
              started = time.perf_counter_ns()
              cp = subprocess.run(target, cwd=root, env=env)
              elapsed_ms = (time.perf_counter_ns() - started) / 1_000_000
              if cp.returncode != 0:
                  raise SystemExit(f"direct workload failed: {cp.returncode}")
              return elapsed_ms

          def timed_observe(index, keep):
              report = raw / f"observe-{index:02d}.json" if keep else raw / "warmup.json"
              started = time.perf_counter_ns()
              with report.open("w", encoding="utf-8") as fh:
                  cp = subprocess.run(
                      [exe, "observe", "--", *target],
                      cwd=root,
                      env=env,
                      stdout=fh,
                  )
              elapsed_ms = (time.perf_counter_ns() - started) / 1_000_000
              if cp.returncode != 0:
                  raise SystemExit(f"observe workload failed: {cp.returncode}")
              data = json.loads(report.read_text(encoding="utf-8"))
              if data.get("complete") is not True:
                  raise SystemExit(f"observation incomplete: {data.get('warnings')}")
              outcome = data.get("outcome", {})
              if outcome.get("exit_code") != 0 or outcome.get("signal") is not None:
                  raise SystemExit(f"observed target outcome not clean: {outcome}")
              if keep:
                  return elapsed_ms, len(data.get("events", [])), len(data.get("warnings", []))
              report.unlink(missing_ok=True)
              return elapsed_ms, 0, 0

          # Frozen protocol: two warmups per mode, then eleven clean samples.
          for _ in range(2):
              timed_direct()
          for i in range(2):
              timed_observe(i, False)

          direct = [timed_direct() for _ in range(11)]
          observed = []
          event_counts = []
          warning_counts = []
          for i in range(11):
              ms, events, warnings = timed_observe(i, True)
              observed.append(ms)
              event_counts.append(events)
              warning_counts.append(warnings)

          def median(xs):
              return statistics.median(xs)

          def mad(xs):
              m = median(xs)
              return median([abs(x - m) for x in xs])

          direct_median = median(direct)
          observed_median = median(observed)
          overhead = observed_median - direct_median
          slowdown = observed_median / direct_median
          relative_trigger = direct_median >= 100.0 and slowdown > 2.0
          absolute_trigger = overhead > 500.0

          summary = {
              "protocol": "M9.0-v1",
              "evidence_level": "L0",
              "independence_class": "ZERO_CONTACT_EXTERNAL_REPRO",
              "target": "casey/just",
              "target_commit": os.environ["JUST_SHA"],
              "command": f"cargo +{toolchain} test --all",
              "warmups_per_mode": 2,
              "samples_per_mode": 11,
              "direct_ms": direct,
              "ptrace_observe_ms": observed,
              "direct_median_ms": direct_median,
              "direct_mad_ms": mad(direct),
              "ptrace_median_ms": observed_median,
              "ptrace_mad_ms": mad(observed),
              "median_absolute_overhead_ms": overhead,
              "median_slowdown": slowdown,
              "observed_event_counts": event_counts,
              "observed_warning_counts": warning_counts,
              "m6_5_relative_trigger": relative_trigger,
              "m6_5_absolute_trigger": absolute_trigger,
              "m6_5_reopen_candidate": relative_trigger or absolute_trigger,
              "claim_scope": "exact workflow and runner class only",
          }
          (out / "performance-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Learn pinned just runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          "$EXECSURFACE_BIN" learn \
            --output m9-evidence/just/just.lock.json \
            -- /bin/bash -lc \
            "cd external/just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1"

      - name: Prove repeated no-drift behavior
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2; do
            "$EXECSURFACE_BIN" check \
              --baseline m9-evidence/just/just.lock.json \
              --json-output "m9-evidence/just/no-drift-${n}.json" \
              --markdown-output "m9-evidence/just/no-drift-${n}.md" \
              -- /bin/bash -lc \
              "cd external/just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1"
          done

          python3 - <<'PY'
          import json
          for n in (1, 2):
              data = json.load(open(f"m9-evidence/just/no-drift-{n}.json", encoding="utf-8"))
              assert data["verdict"] == "pass", data
              assert data["findings"] == [], data
          print("M9_JUST_REPEAT_NO_DRIFT_PASS")
          PY

      - name: Prove controlled runtime expansion is visible
        shell: bash
        run: |
          set -euo pipefail
          set +e
          "$EXECSURFACE_BIN" check \
            --baseline m9-evidence/just/just.lock.json \
            --json-output m9-evidence/just/controlled-drift.json \
            --markdown-output m9-evidence/just/controlled-drift.md \
            -- /bin/bash -lc \
            "cd external/just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1; /usr/bin/sha256sum Cargo.toml >/dev/null"
          rc=$?
          set -e
          test "$rc" -eq 10

          python3 - <<'PY'
          import json
          data = json.load(open("m9-evidence/just/controlled-drift.json", encoding="utf-8"))
          assert data["verdict"] == "review", data
          hits = []
          for finding in data["findings"]:
              if finding.get("change") != "added" or finding.get("effect_kind") != "process_exec":
                  continue
              executable = finding.get("evidence", {}).get("effect", {}).get("executable", {})
              if executable.get("family") == "sha256sum":
                  hits.append(finding)
          assert hits, "controlled sha256sum process expansion was not detected"
          print(f"M9_JUST_CONTROLLED_DRIFT_PASS hits={len(hits)}")
          PY

      - name: Enforce metadata-only privacy sentinel
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -F -- "$M9_PRIVATE_SENTINEL" m9-evidence/just; then
            echo "privacy sentinel leaked into persisted ExecSurface evidence" >&2
            exit 1
          fi
          echo M9_JUST_PRIVACY_SENTINEL_PASS

      - name: Record artifact digests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -d m9-evidence/just; then
            find m9-evidence/just -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > m9-evidence/just/SHA256SUMS
          fi

      - name: Preserve raw M9 just evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m9-just-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: m9-evidence/just
          if-no-files-found: error
          retention-days: 30
