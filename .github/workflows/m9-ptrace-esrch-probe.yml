name: M9 ptrace ESRCH diagnostic probe

on:
  push:
    branches:
      - hardening/m9-ptrace-esrch-just
    paths:
      - crates/execsurface-observe/src/bin/ptrace-esrch-probe.rs
      - .github/workflows/m9-ptrace-esrch-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JUST_SHA: 5d5742cbcc50f19c99c356bc7e085acaa5f4665d
      RUST_TOOLCHAIN: 1.90.0
    steps:
      - name: Checkout ExecSurface hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned unmodified casey/just
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: casey/just
          ref: ${{ env.JUST_SHA }}
          path: external/just
          fetch-depth: 1
          persist-credentials: false

      - name: Verify external pin and install toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/just rev-parse HEAD)" = "$JUST_SHA"
          test -z "$(git -C external/just status --porcelain)"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustc "+$RUST_TOOLCHAIN" --version --verbose

      - name: Build diagnostic probe
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" build -p execsurface-observe --bin ptrace-esrch-probe

      - name: Prime pinned workload outside ptrace
        shell: bash
        run: |
          set -euo pipefail
          cd external/just
          cargo "+$RUST_TOOLCHAIN" test --all >/dev/null 2>&1

      - name: Run three diagnostic attempts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m9-probe
          rc=0
          for attempt in 1 2 3; do
            echo "M9_PTRACE_PROBE_ATTEMPT=$attempt" | tee -a m9-probe/probe.log
            set +e
            target/debug/ptrace-esrch-probe -- \
              /bin/bash -lc \
              "cd external/just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1" \
              >>m9-probe/probe.log 2>&1
            attempt_rc=$?
            set -e
            echo "M9_PTRACE_PROBE_ATTEMPT_RC=$attempt_rc" | tee -a m9-probe/probe.log
            if test "$attempt_rc" -ne 0; then
              rc=$attempt_rc
              break
            fi
          done
          cp m9-probe/probe.log m9-probe/probe.raw.txt
          sha256sum m9-probe/probe.raw.txt > m9-probe/SHA256SUMS
          exit "$rc"

      - name: Preserve probe output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m9-ptrace-esrch-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: m9-probe
          if-no-files-found: error
          retention-days: 30
