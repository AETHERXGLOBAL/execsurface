name: M11 authority integration CI

on:
  push:
    branches:
      - research/m11-authority-aware-integration
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/execsurface-authority/**'
      - 'crates/execsurface-hybrid-authority/**'
      - 'crates/execsurface-observe/**'
      - 'crates/execsurface-baseline/**'
      - '.github/workflows/m11-authority-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-and-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain evidence
        run: |
          uname -a
          rustc --version --verbose
          cargo --version

      - name: Format M11 authority crates
        run: |
          cargo fmt --package execsurface-authority -- --check
          cargo fmt --package execsurface-hybrid-authority -- --check

      - name: Format M11 observer changes
        run: |
          rustfmt --edition 2021 --check crates/execsurface-observe/src/lib.rs
          rustfmt --edition 2021 --check crates/execsurface-observe/tests/m11_path_authority.rs
          rustfmt --edition 2021 --check crates/execsurface-observe/tests/m11_shared_fd_ambiguity.rs
          rustfmt --edition 2021 --check crates/execsurface-observe/tests/m11_privacy_redteam.rs

      - name: Clippy full workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Authority tests
        run: cargo test --locked -p execsurface-authority

      - name: Explicit hybrid adapter tests
        run: cargo test --locked -p execsurface-hybrid-authority

      - name: Proposition comparability red-team
        run: cargo test --locked -p execsurface-hybrid-authority --test m11_comparability

      - name: Hybrid fail-closed red-team
        run: cargo test --locked -p execsurface-hybrid-authority --test m11_redteam

      - name: Ptrace authority bridge tests
        run: cargo test --locked -p execsurface-observe --test m11_path_authority

      - name: Shared-fd ambiguity tests
        run: cargo test --locked -p execsurface-observe --test m11_shared_fd_ambiguity

      - name: Ptrace privacy sentinel red-team
        run: cargo test --locked -p execsurface-observe --test m11_privacy_redteam

      - name: Frozen baseline v2 compatibility tests
        run: cargo test --locked -p execsurface-baseline digest_serialization_vector_is_frozen

      - name: Full workspace tests
        run: cargo test --locked --workspace --all-targets

      - name: Lockfile integrity
        run: |
          git diff --exit-code -- Cargo.lock
          test -z "$(git status --porcelain -- Cargo.lock)"
