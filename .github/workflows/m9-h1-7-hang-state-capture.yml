name: M9-H1.7 ptrace hang state capture

on:
  push:
    branches:
      - hardening/m9-ptrace-esrch-just
    paths:
      - .github/workflows/m9-h1-7-hang-state-capture.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-hung-kernel-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUST_TOOLCHAIN: 1.90.0
      SOURCE: crates/execsurface-observe/src/linux_ptrace.rs
      PRODUCTION_SHA256: 3dc656358a3675a0d78135bb83046bc45c33dca2718c8bd8b68fa090e18eac8b
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install frozen Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt --toolchain "$RUST_TOOLCHAIN"

      - name: Reconstruct exact production-clean candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m9-h1-7-evidence
          python3 scripts/m9_apply_ptrace_esrch_fix.py
          python3 scripts/m9_apply_ptrace_exit_lifecycle.py
          python3 scripts/m9_apply_ptrace_preregistration_ordering.py
          python3 scripts/m9_apply_get_syscall_info_exit_group_fix.py
          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 "$SOURCE"
          python3 scripts/m9_finalize_ptrace_lifecycle_core.py
          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 "$SOURCE"
          actual="$(sha256sum "$SOURCE" | awk '{print $1}')"
          printf 'expected=%s\nactual=%s\n' "$PRODUCTION_SHA256" "$actual" \
            | tee m9-h1-7-evidence/source-hash.txt
          test "$actual" = "$PRODUCTION_SHA256"

      - name: Build observer and amplified fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" build -p execsurface \
            2>&1 | tee m9-h1-7-evidence/build.log
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/fixtures/m9/exit_group_sched_getaffinity_race.c \
            -o /tmp/m9-h1-7-exit-group-race

      - name: Capture first hung observation before killing tracer
        shell: bash
        run: |
          set -euo pipefail
          : > m9-h1-7-evidence/summary.txt
          hung=0
          for attempt in $(seq 1 400); do
            out="m9-h1-7-evidence/attempt-${attempt}.json"
            err="m9-h1-7-evidence/attempt-${attempt}.stderr"
            target/debug/execsurface observe -- /tmp/m9-h1-7-exit-group-race \
              >"$out" 2>"$err" &
            tracer=$!
            printf 'attempt=%s tracer_pid=%s\n' "$attempt" "$tracer" \
              >> m9-h1-7-evidence/summary.txt

            exited=0
            for tick in $(seq 1 100); do
              if ! kill -0 "$tracer" 2>/dev/null; then
                exited=1
                break
              fi
              sleep 0.1
            done

            if [ "$exited" -eq 1 ]; then
              set +e
              wait "$tracer"
              rc=$?
              set -e
              printf 'attempt=%s rc=%s completed=true\n' "$attempt" "$rc" \
                >> m9-h1-7-evidence/summary.txt
              test "$rc" -eq 0
              python3 - "$out" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          assert data.get("complete") is True, data.get("warnings")
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, outcome
          assert outcome.get("signal") is None, outcome
          PY
              continue
            fi

            hung=1
            printf 'HANG_CAPTURED attempt=%s tracer_pid=%s\n' "$attempt" "$tracer" \
              | tee -a m9-h1-7-evidence/summary.txt
            snapshot="m9-h1-7-evidence/hang-${attempt}-snapshot.txt"
            {
              echo '=== tracer status ==='
              printf 'tracer_pid=%s\n' "$tracer"
              cat "/proc/$tracer/status" 2>/dev/null || true
              printf 'tracer_wchan='
              cat "/proc/$tracer/wchan" 2>/dev/null || true
              echo
              echo '=== tracer kernel stack ==='
              cat "/proc/$tracer/task/$tracer/stack" 2>/dev/null || true
              echo
              echo '=== process/thread table ==='
              ps -eLo pid,ppid,tid,tgid,stat,wchan:40,comm,args || true
              echo '=== tasks traced by observer ==='
              traced_count=0
              for status in /proc/[0-9]*/task/[0-9]*/status; do
                [ -r "$status" ] || continue
                tp="$(awk '/^TracerPid:/{print $2}' "$status" 2>/dev/null || true)"
                [ "$tp" = "$tracer" ] || continue
                traced_count=$((traced_count + 1))
                taskdir="${status%/status}"
                echo "--- $status ---"
                grep -E '^(Name|State|Tgid|Pid|PPid|TracerPid|Threads):' "$status" || true
                printf 'wchan='
                cat "$taskdir/wchan" 2>/dev/null || true
                echo
                printf 'syscall='
                cat "$taskdir/syscall" 2>/dev/null || true
                echo
                echo 'stack:'
                cat "$taskdir/stack" 2>/dev/null || true
              done
              printf 'traced_task_count=%s\n' "$traced_count"
              echo '=== direct children of tracer ==='
              cat "/proc/$tracer/task/$tracer/children" 2>/dev/null || true
              echo
            } > "$snapshot"

            kill -KILL "$tracer" 2>/dev/null || true
            set +e
            wait "$tracer"
            killed_rc=$?
            set -e
            printf 'hang_killed_rc=%s\n' "$killed_rc" >> "$snapshot"
            break
          done
          test "$hung" -eq 1

      - name: Seal evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'head_sha=%s\n' "$GITHUB_SHA"
            printf 'rust_toolchain=%s\n' "$RUST_TOOLCHAIN"
            printf 'kernel=%s\n' "$(uname -srmo)"
          } > m9-h1-7-evidence/environment.txt
          find m9-h1-7-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > m9-h1-7-evidence/SHA256SUMS

      - name: Upload hang-state evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m9-h1-7-hang-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: m9-h1-7-evidence
          if-no-files-found: error
          retention-days: 30
