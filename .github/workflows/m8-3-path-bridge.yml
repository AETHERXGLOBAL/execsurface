name: M8.3 Path Resolution Bridge

on:
  push:
    branches:
      - "milestone/m8-3-libbpf-observer"
    paths:
      - "experiments/m8-ebpf/libbpf-path-bridge/**"
      - "docs/milestones/M8_3B_PATH_RESOLUTION_BRIDGE.md"
      - ".github/workflows/m8-3-path-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  path-bridge:
    name: libbpf userspace path-resolution bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Record host and tracepoint contract
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          id
          test -r /sys/kernel/btf/vmlinux
          cat /proc/sys/kernel/unprivileged_bpf_disabled || true
          format="/sys/kernel/tracing/events/syscalls/sys_exit_openat/format"
          captured="$RUNNER_TEMP/sys_exit_openat.format"
          sudo cat "$format" | tee "$captured"
          grep -Eq 'field:long ret;[[:space:]]+offset:16;[[:space:]]+size:8;' "$captured"
          echo 'M8_3_OPENAT_RET_LAYOUT_PASS offset=16 size=8'

      - name: Install declared native build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libelf-dev zlib1g-dev pkg-config
          clang --version
          pkg-config --modversion libelf

      - name: Install resolver and product-MSRV Rust toolchains
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.87.0 --profile minimal
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt
          cargo +1.87.0 --version
          rustc +1.82.0 --version --verbose
          rustfmt +1.82.0 --version

      - name: Resolve Rust-1.82-compatible dependency lock
        shell: bash
        run: |
          set -euxo pipefail
          rm -f experiments/m8-ebpf/libbpf-path-bridge/Cargo.lock
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback \
            cargo +1.87.0 generate-lockfile \
            --manifest-path experiments/m8-ebpf/libbpf-path-bridge/Cargo.toml

      - name: Format check isolated bridge crate
        shell: bash
        run: |
          set -euxo pipefail
          cargo +1.82.0 fmt \
            --manifest-path experiments/m8-ebpf/libbpf-path-bridge/Cargo.toml \
            -- --check

      - name: Build isolated bridge on Rust 1.82
        shell: bash
        run: |
          set -euxo pipefail
          cargo +1.82.0 build \
            --manifest-path experiments/m8-ebpf/libbpf-path-bridge/Cargo.toml \
            --release --locked
          BIN=experiments/m8-ebpf/libbpf-path-bridge/target/release/execsurface-m8-libbpf-path-bridge
          test -x "$BIN"
          file "$BIN"
          sha256sum "$BIN"
          ldd "$BIN" || true

      - name: Prove unprivileged load denial remains explicit
        shell: bash
        run: |
          set -euxo pipefail
          BIN=experiments/m8-ebpf/libbpf-path-bridge/target/release/execsurface-m8-libbpf-path-bridge
          set +e
          "$BIN" >"$RUNNER_TEMP/m8-3-unprivileged.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/m8-3-unprivileged.log"
          test "$rc" -ne 0
          echo "M8_3_UNPRIVILEGED_DENIAL_PASS exit=$rc"

      - name: Prove conditional path resolution and lifecycle races
        shell: bash
        run: |
          set -euxo pipefail
          BIN=experiments/m8-ebpf/libbpf-path-bridge/target/release/execsurface-m8-libbpf-path-bridge
          sudo "$BIN" 2>&1 | tee "$RUNNER_TEMP/m8-3-path-bridge.log"
          grep -q '^M8_3_EXEC_HELD_RESOLUTION_PASS ' "$RUNNER_TEMP/m8-3-path-bridge.log"
          grep -q '^M8_3_EXEC_REAPED_RESOLUTION_UNAVAILABLE_PASS ' "$RUNNER_TEMP/m8-3-path-bridge.log"
          grep -q '^M8_3_OPEN_HELD_RESOLUTION_PASS ' "$RUNNER_TEMP/m8-3-path-bridge.log"
          grep -q '^M8_3_OPEN_REAPED_RESOLUTION_UNAVAILABLE_PASS ' "$RUNNER_TEMP/m8-3-path-bridge.log"
          grep -q '^M8_3_PATH_BRIDGE_CONDITIONAL_FAIL_CLOSED_PASS$' "$RUNNER_TEMP/m8-3-path-bridge.log"
          ! grep -Fq 'AX_M8_3_PATH_BRIDGE_SECRET_DO_NOT_PERSIST' "$RUNNER_TEMP/m8-3-path-bridge.log"
          echo 'M8_3_PATH_BRIDGE_PRIVACY_PASS'
