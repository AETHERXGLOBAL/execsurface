name: M12 clean integration CI

on:
  push:
    branches:
      - integration/m12-portable-clean
    paths:
      - 'crates/execsurface-observe/**'
      - 'crates/execsurface-baseline/**'
      - 'crates/execsurface-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/m12-integration-ci.yml'
      - 'docs/milestones/M12_*'
  pull_request:
    branches:
      - main
    paths:
      - 'crates/execsurface-observe/**'
      - 'crates/execsurface-baseline/**'
      - 'crates/execsurface-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/m12-integration-ci.yml'
      - 'docs/milestones/M12_*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-semantic-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain evidence
        run: |
          uname -a
          rustc --version --verbose
          cargo --version

      - name: Format targeted observer changes
        run: |
          rustfmt --edition 2021 --check crates/execsurface-observe/src/lib.rs
          rustfmt --edition 2021 --check crates/execsurface-observe/tests/m11_shared_fd_ambiguity.rs
          rustfmt --edition 2021 --check crates/execsurface-observe/tests/ptrace_linux.rs

      - name: Clippy full workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Shared-FD ambiguity fail-closed regression
        run: cargo test --locked -p execsurface-observe --test m11_shared_fd_ambiguity

      - name: Existing ptrace Linux regressions
        run: cargo test --locked -p execsurface-observe --test ptrace_linux

      - name: Frozen baseline v2 serialization compatibility
        run: cargo test --locked -p execsurface-baseline digest_serialization_vector_is_frozen

      - name: Legacy baseline schema is rejected, never reinterpreted
        run: cargo test --locked -p execsurface-baseline legacy_lock_schema_is_rejected_instead_of_reinterpreted

      - name: CLI learn/check compatibility
        run: |
          cargo test --locked -p execsurface --test learn_linux
          cargo test --locked -p execsurface --test check_linux

      - name: CLI stable verdict exit codes
        run: cargo test --locked -p execsurface --test policy_linux

      - name: CLI self-service compatibility
        run: cargo test --locked -p execsurface --test self_service_linux

      - name: Full workspace tests
        run: cargo test --locked --workspace --all-targets

      - name: Lockfile integrity
        run: |
          git diff --exit-code -- Cargo.lock
          test -z "$(git status --porcelain -- Cargo.lock)"
