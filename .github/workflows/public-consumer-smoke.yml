name: Public Consumer Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-binary:
    name: Published release / no-Rust path
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout release pointer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install checksum-verified public release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < action/release-tag.txt)"
          target="x86_64-unknown-linux-gnu"
          asset="execsurface-${version}-${target}.tar.gz"
          install_dir="$RUNNER_TEMP/execsurface-public-release"
          mkdir -p "$install_dir"
          cd "$install_dir"

          curl --fail --location --silent --show-error \
            --output "$asset" \
            "https://github.com/AETHERXGLOBAL/execsurface/releases/download/${version}/${asset}"
          curl --fail --location --silent --show-error \
            --output "$asset.sha256" \
            "https://github.com/AETHERXGLOBAL/execsurface/releases/download/${version}/${asset}.sha256"

          sha256sum -c "$asset.sha256"
          tar -xzf "$asset"

          binary="$install_dir/execsurface-${version}-${target}/execsurface"
          test -x "$binary"
          test "$("$binary" --version)" = "execsurface ${version#v}"
          echo "EXECSURFACE_PUBLIC_BIN=$binary" >> "$GITHUB_ENV"

      - name: Prove doctor, PASS, and controlled REVIEW
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/execsurface-public-consumer"
          mkdir -p "$work"
          cd "$work"

          "$EXECSURFACE_PUBLIC_BIN" doctor
          "$EXECSURFACE_PUBLIC_BIN" learn -- /bin/bash -lc true
          "$EXECSURFACE_PUBLIC_BIN" check -- /bin/bash -lc true

          set +e
          output="$("$EXECSURFACE_PUBLIC_BIN" check -- /bin/bash -lc 'true; /bin/echo controlled-drift >/dev/null' 2>&1)"
          status=$?
          set -e

          test "$status" -eq 10
          grep -F "ExecSurface: REVIEW" <<<"$output"

  stable-action:
    name: Stable GitHub Action / v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout consumer workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare baseline with current public release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < action/release-tag.txt)"
          target="x86_64-unknown-linux-gnu"
          asset="execsurface-${version}-${target}.tar.gz"
          install_dir="$RUNNER_TEMP/execsurface-action-baseline"
          mkdir -p "$install_dir"
          cd "$install_dir"

          curl --fail --location --silent --show-error \
            --output "$asset" \
            "https://github.com/AETHERXGLOBAL/execsurface/releases/download/${version}/${asset}"
          curl --fail --location --silent --show-error \
            --output "$asset.sha256" \
            "https://github.com/AETHERXGLOBAL/execsurface/releases/download/${version}/${asset}.sha256"
          sha256sum -c "$asset.sha256"
          tar -xzf "$asset"

          binary="$install_dir/execsurface-${version}-${target}/execsurface"
          cd "$GITHUB_WORKSPACE"
          "$binary" learn --output public-action.lock.json -- /bin/bash -lc true

      - name: Stable Action PASS
        id: pass
        uses: AETHERXGLOBAL/execsurface@v0.1
        with:
          command: "true"
          baseline: public-action.lock.json
          upload-artifact: "false"

      - name: Assert PASS output
        shell: bash
        env:
          VERDICT: ${{ steps.pass.outputs.verdict }}
          EXIT_CODE: ${{ steps.pass.outputs.exit-code }}
        run: |
          test "$VERDICT" = "pass"
          test "$EXIT_CODE" = "0"

      - name: Stable Action controlled REVIEW
        id: review
        uses: AETHERXGLOBAL/execsurface@v0.1
        with:
          command: "true; /bin/echo controlled-drift >/dev/null"
          baseline: public-action.lock.json
          upload-artifact: "false"

      - name: Assert REVIEW output
        shell: bash
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
          EXIT_CODE: ${{ steps.review.outputs.exit-code }}
        run: |
          test "$VERDICT" = "review"
          test "$EXIT_CODE" = "10"
