name: Public Consumer Smoke

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/public-consumer-smoke.yml"
      - "action.yml"
      - "action/**"
      - "docs/STATUS.md"
      - "docs/GITHUB_ACTION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-binary:
    name: Published release / no-Rust path
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout release pointer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-verified public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < action/release-tag.txt)"
          target="x86_64-unknown-linux-gnu"
          asset="execsurface-${version}-${target}.tar.gz"
          install_dir="$RUNNER_TEMP/execsurface-public-release"
          mkdir -p "$install_dir"
          cd "$install_dir"

          curl --fail --location --silent --show-error \
            --output "$asset" \
            "https://github.com/AETHERXGLOBAL/execsurface/releases/download/${version}/${asset}"
          curl --fail --location --silent --show-error \
            --output "$asset.sha256" \
            "https://github.com/AETHERXGLOBAL/execsurface/releases/download/${version}/${asset}.sha256"

          sha256sum -c "$asset.sha256"
          gh attestation verify "$asset" -R "$GITHUB_REPOSITORY"
          tar -xzf "$asset"

          binary="$install_dir/execsurface-${version}-${target}/execsurface"
          test -x "$binary"
          test "$("$binary" --version)" = "execsurface ${version#v}"
          echo "EXECSURFACE_PUBLIC_BIN=$binary" >> "$GITHUB_ENV"

      - name: Prove doctor, PASS, and controlled REVIEW
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/execsurface-public-consumer"
          mkdir -p "$work"
          cd "$work"

          "$EXECSURFACE_PUBLIC_BIN" doctor
          "$EXECSURFACE_PUBLIC_BIN" learn --output public.lock.json -- /bin/bash -lc true
          baseline_before="$(sha256sum public.lock.json | cut -d' ' -f1)"
          "$EXECSURFACE_PUBLIC_BIN" check --baseline public.lock.json -- /bin/bash -lc true

          set +e
          output="$("$EXECSURFACE_PUBLIC_BIN" check --baseline public.lock.json -- /bin/bash -lc 'true; /bin/echo controlled-drift >/dev/null' 2>&1)"
          status=$?
          set -e

          test "$status" -eq 10
          grep -F "ExecSurface: REVIEW" <<<"$output"
          test "$baseline_before" = "$(sha256sum public.lock.json | cut -d' ' -f1)"

  registry-install:
    name: Exact crates.io install / locked
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout release pointer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact registry release
        shell: bash
        run: |
          set -euo pipefail
          tag="$(tr -d '[:space:]' < action/release-tag.txt)"
          version="${tag#v}"
          root="$RUNNER_TEMP/execsurface-registry"
          cargo install execsurface --version "=$version" --locked --root "$root"
          binary="$root/bin/execsurface"
          test -x "$binary"
          test "$("$binary" --version)" = "execsurface $version"
          echo "EXECSURFACE_REGISTRY_BIN=$binary" >> "$GITHUB_ENV"

      - name: Prove registry doctor and PASS
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/execsurface-registry-consumer"
          mkdir -p "$work"
          cd "$work"
          "$EXECSURFACE_REGISTRY_BIN" doctor
          "$EXECSURFACE_REGISTRY_BIN" learn --output registry.lock.json -- /bin/bash -lc true
          baseline_before="$(sha256sum registry.lock.json | cut -d' ' -f1)"
          "$EXECSURFACE_REGISTRY_BIN" check --baseline registry.lock.json -- /bin/bash -lc true
          test "$baseline_before" = "$(sha256sum registry.lock.json | cut -d' ' -f1)"

  stable-action:
    name: Stable GitHub Action / v0.1 verdict contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout consumer workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify stable channel resolves to current immutable release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < action/release-tag.txt)"
          remote="https://github.com/AETHERXGLOBAL/execsurface.git"

          resolve_tag() {
            local tag="$1"
            local sha
            sha="$(git ls-remote "$remote" "refs/tags/${tag}^{}" | awk 'NR==1 {print $1}')"
            if [[ -z "$sha" ]]; then
              sha="$(git ls-remote "$remote" "refs/tags/${tag}" | awk 'NR==1 {print $1}')"
            fi
            test -n "$sha"
            printf '%s\n' "$sha"
          }

          stable_sha="$(resolve_tag v0.1)"
          immutable_sha="$(resolve_tag "$version")"
          test "$stable_sha" = "$immutable_sha"
          echo "EXECSURFACE_PUBLIC_TAG=$version" >> "$GITHUB_ENV"

      - name: Prepare baseline and blocking policy with current public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$EXECSURFACE_PUBLIC_TAG"
          target="x86_64-unknown-linux-gnu"
          asset="execsurface-${version}-${target}.tar.gz"
          install_dir="$RUNNER_TEMP/execsurface-action-baseline"
          mkdir -p "$install_dir"
          cd "$install_dir"

          curl --fail --location --silent --show-error \
            --output "$asset" \
            "https://github.com/AETHERXGLOBAL/execsurface/releases/download/${version}/${asset}"
          curl --fail --location --silent --show-error \
            --output "$asset.sha256" \
            "https://github.com/AETHERXGLOBAL/execsurface/releases/download/${version}/${asset}.sha256"
          sha256sum -c "$asset.sha256"
          gh attestation verify "$asset" -R "$GITHUB_REPOSITORY"
          tar -xzf "$asset"

          binary="$install_dir/execsurface-${version}-${target}/execsurface"
          cd "$GITHUB_WORKSPACE"
          "$binary" learn --output public-action.lock.json -- /bin/bash -lc true
          sha256sum public-action.lock.json > "$RUNNER_TEMP/public-action.lock.sha256"

          cat > public-block-policy.json <<'JSON'
          {
            "schema_version": 2,
            "default_action": "review",
            "rules": [
              {
                "id": "block-added-exec",
                "action": "block",
                "match": {
                  "change": "added",
                  "effect": "process_exec"
                }
              }
            ]
          }
          JSON

      - name: Stable Action PASS
        id: pass
        uses: AETHERXGLOBAL/execsurface@v0.1
        with:
          command: "true"
          baseline: public-action.lock.json
          upload-artifact: "false"

      - name: Assert PASS outputs
        shell: bash
        env:
          VERDICT: ${{ steps.pass.outputs.verdict }}
          EXIT_CODE: ${{ steps.pass.outputs.exit-code }}
          REPORT_JSON: ${{ steps.pass.outputs.report-json }}
          SUMMARY_MARKDOWN: ${{ steps.pass.outputs.summary-markdown }}
        run: |
          set -euo pipefail
          test "$VERDICT" = "pass"
          test "$EXIT_CODE" = "0"
          test -s "$REPORT_JSON"
          test -s "$SUMMARY_MARKDOWN"

      - name: Stable Action controlled REVIEW
        id: review
        uses: AETHERXGLOBAL/execsurface@v0.1
        with:
          command: "true; /bin/echo controlled-review >/dev/null"
          baseline: public-action.lock.json
          upload-artifact: "false"

      - name: Assert REVIEW succeeds by default
        shell: bash
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
          EXIT_CODE: ${{ steps.review.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$VERDICT" = "review"
          test "$EXIT_CODE" = "10"

      - name: Stable Action controlled BLOCK
        id: block
        continue-on-error: true
        uses: AETHERXGLOBAL/execsurface@v0.1
        with:
          command: "true; /bin/echo controlled-block >/dev/null"
          baseline: public-action.lock.json
          policy: public-block-policy.json
          upload-artifact: "false"

      - name: Assert BLOCK fails closed
        shell: bash
        env:
          OUTCOME: ${{ steps.block.outcome }}
          VERDICT: ${{ steps.block.outputs.verdict }}
          EXIT_CODE: ${{ steps.block.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"
          test "$VERDICT" = "block"
          test "$EXIT_CODE" = "20"

      - name: Stable Action controlled ERROR
        id: error
        continue-on-error: true
        uses: AETHERXGLOBAL/execsurface@v0.1
        with:
          command: "true"
          baseline: missing-public-baseline.json
          upload-artifact: "false"

      - name: Assert ERROR fails closed and baseline stays immutable
        shell: bash
        env:
          OUTCOME: ${{ steps.error.outcome }}
          VERDICT: ${{ steps.error.outputs.verdict }}
          EXIT_CODE: ${{ steps.error.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"
          test "$VERDICT" = "error"
          test "$EXIT_CODE" = "2"
          sha256sum -c "$RUNNER_TEMP/public-action.lock.sha256"
