name: M9.1 pinned fzf post-fix proof

on:
  push:
    branches:
      - fix/m9-go-temp-canonicalization
    paths:
      - .github/workflows/m9-fzf-postfix-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fzf-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUST_TOOLCHAIN: 1.90.0
      FZF_SHA: b1be3a8be1b833ce5b92fbbac11637643d60a046
      WORK_ROOT: /tmp/execsurface-m9-fzf
    steps:
      - name: Checkout ExecSurface fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout pinned unmodified fzf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: junegunn/fzf
          ref: ${{ env.FZF_SHA }}
          path: external/fzf
          fetch-depth: 1
          persist-credentials: false

      - name: Build exact ExecSurface candidate and prepare upstream
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          cargo "+$RUST_TOOLCHAIN" build --locked -p execsurface
          rm -rf "$WORK_ROOT"
          cp -a external/fzf "$WORK_ROOT"
          test "$(git -C "$WORK_ROOT" rev-parse HEAD)" = "$FZF_SHA"
          test -z "$(git -C "$WORK_ROOT" status --porcelain)"
          mkdir -p m9-fzf-postfix-evidence
          {
            printf 'execsurface_sha=%s\n' "$GITHUB_SHA"
            printf 'fzf_sha=%s\n' "$FZF_SHA"
            printf 'go=%s\n' "$(go version)"
            printf 'rustc=%s\n' "$(rustc +$RUST_TOOLCHAIN --version)"
            printf 'kernel=%s\n' "$(uname -srmo)"
          } > m9-fzf-postfix-evidence/environment.txt

      - name: Prove direct upstream workload
        shell: bash
        run: |
          set -euo pipefail
          (cd "$WORK_ROOT" && go test ./...)

      - name: Learn and re-check identical workload twice
        shell: bash
        run: |
          set -euo pipefail
          cmd="cd '$WORK_ROOT' && go test ./... >/dev/null 2>&1"
          target/debug/execsurface learn \
            --output m9-fzf-postfix-evidence/fzf.lock.json \
            -- /bin/bash -lc "$cmd"
          for n in 1 2; do
            set +e
            target/debug/execsurface check \
              --baseline m9-fzf-postfix-evidence/fzf.lock.json \
              --json-output "m9-fzf-postfix-evidence/check-${n}.json" \
              --markdown-output "m9-fzf-postfix-evidence/check-${n}.md" \
              -- /bin/bash -lc "$cmd" \
              > "m9-fzf-postfix-evidence/check-${n}.stdout" \
              2> "m9-fzf-postfix-evidence/check-${n}.stderr"
            rc=$?
            set -e
            printf 'check_%s_rc=%s\n' "$n" "$rc" | tee -a m9-fzf-postfix-evidence/summary.txt
            python3 - "$n" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          n, rc = sys.argv[1], int(sys.argv[2])
          d=json.loads(Path(f'm9-fzf-postfix-evidence/check-{n}.json').read_text())
          findings=d.get('findings', [])
          print(f'check={n} rc={rc} verdict={d.get("verdict")} findings={len(findings)}')
          if rc != 0 or d.get('verdict') != 'pass' or findings:
              for f in findings[:40]:
                  print(json.dumps(f, sort_keys=True))
              raise SystemExit(1)
          PY
          done

      - name: Seal evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          find m9-fzf-postfix-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > m9-fzf-postfix-evidence/SHA256SUMS

      - name: Upload post-fix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m9-fzf-postfix-${{ github.run_id }}-${{ github.run_attempt }}
          path: m9-fzf-postfix-evidence
          if-no-files-found: error
          retention-days: 30
