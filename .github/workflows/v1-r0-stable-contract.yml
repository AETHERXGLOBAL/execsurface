name: V1-R0 Stable Contract Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v1-r0-stable-contract.yml'
      - 'docs/COMPATIBILITY.md'
      - 'docs/development/V1_R0_STABLE_CONTRACT_FREEZE_PROTOCOL.md'
      - 'docs/development/V1_R0_STABLE_CONTRACT_FREEZE_RESULT.md'
      - 'action.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/execsurface-cli/tests/v1_stable_contract.rs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1-r0-stable-contract.yml'
      - 'docs/COMPATIBILITY.md'
      - 'docs/development/V1_R0_STABLE_CONTRACT_FREEZE_PROTOCOL.md'
      - 'docs/development/V1_R0_STABLE_CONTRACT_FREEZE_RESULT.md'
      - 'action.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/execsurface-cli/tests/v1_stable_contract.rs'
  workflow_dispatch:

permissions:
  contents: read

env:
  ALPHA6_TAG: v0.1.0-alpha.6
  ALPHA6_VERSION: 0.1.0-alpha.6
  TARGET: x86_64-unknown-linux-gnu
  ASSET: execsurface-v0.1.0-alpha.6-x86_64-unknown-linux-gnu.tar.gz

jobs:
  contract-sentinels:
    name: Frozen contract sentinels
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Execute v1 stable-contract sentinels
        run: cargo test --locked -p execsurface --test v1_stable_contract -- --test-threads=1 --nocapture

  alpha6-environment-probe:
    name: Alpha.6 public artifact / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Download exact public Alpha.6 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1-r0-alpha6"
          cd "$RUNNER_TEMP/v1-r0-alpha6"
          gh release download "$ALPHA6_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --pattern "$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"
          gh attestation verify "$ASSET" -R "$GITHUB_REPOSITORY"
          tar -xzf "$ASSET"
          bin="$PWD/execsurface-${ALPHA6_TAG}-${TARGET}/execsurface"
          test -x "$bin"
          test "$("$bin" --version)" = "execsurface $ALPHA6_VERSION"
          echo "EXECSURFACE_BIN=$bin" >> "$GITHUB_ENV"

      - name: Doctor + learn + unchanged check
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/v1-r0-work"
          mkdir -p "$work"
          cd "$work"
          "$EXECSURFACE_BIN" doctor
          "$EXECSURFACE_BIN" learn --output execsurface.lock.json -- /bin/bash -lc true
          before="$(sha256sum execsurface.lock.json | awk '{print $1}')"
          "$EXECSURFACE_BIN" check --baseline execsurface.lock.json -- /bin/bash -lc true
          test "$before" = "$(sha256sum execsurface.lock.json | awk '{print $1}')"

  msrv-probe:
    name: Declared Rust 1.82 source floor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install declared MSRV toolchain
        shell: bash
        run: rustup toolchain install 1.82.0 --profile minimal
      - name: Check CLI package at declared MSRV
        shell: bash
        run: cargo +1.82.0 check --locked -p execsurface
