name: V1-R0 Stable Contract Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v1-r0-stable-contract.yml'
      - 'docs/COMPATIBILITY.md'
      - 'docs/development/V1_R0_STABLE_CONTRACT_FREEZE_PROTOCOL.md'
      - 'docs/development/V1_R0_STABLE_CONTRACT_FREEZE_RESULT.md'
      - 'action.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/execsurface-cli/tests/v1_stable_contract.rs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1-r0-stable-contract.yml'
      - 'docs/COMPATIBILITY.md'
      - 'docs/development/V1_R0_STABLE_CONTRACT_FREEZE_PROTOCOL.md'
      - 'docs/development/V1_R0_STABLE_CONTRACT_FREEZE_RESULT.md'
      - 'action.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/execsurface-cli/tests/v1_stable_contract.rs'
  workflow_dispatch:

permissions:
  contents: read

env:
  ALPHA6_TAG: v0.1.0-alpha.6
  ALPHA6_VERSION: 0.1.0-alpha.6
  TARGET: x86_64-unknown-linux-gnu
  ASSET: execsurface-v0.1.0-alpha.6-x86_64-unknown-linux-gnu.tar.gz

jobs:
  contract-sentinels:
    name: Frozen contract sentinels
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Execute v1 stable-contract sentinels
        run: cargo test --locked -p execsurface --test v1_stable_contract -- --test-threads=1 --nocapture

  alpha6-public-binary-supported-floor:
    name: Alpha.6 public binary / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download exact public Alpha.6 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1-r0-alpha6"
          cd "$RUNNER_TEMP/v1-r0-alpha6"
          gh release download "$ALPHA6_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --pattern "$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"
          gh attestation verify "$ASSET" -R "$GITHUB_REPOSITORY"
          tar -xzf "$ASSET"
          bin="$PWD/execsurface-${ALPHA6_TAG}-${TARGET}/execsurface"
          test -x "$bin"
          test "$("$bin" --version)" = "execsurface $ALPHA6_VERSION"
          echo "EXECSURFACE_BIN=$bin" >> "$GITHUB_ENV"

      - name: Doctor + learn + unchanged check
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/v1-r0-work"
          mkdir -p "$work"
          cd "$work"
          "$EXECSURFACE_BIN" doctor
          "$EXECSURFACE_BIN" learn --output execsurface.lock.json -- /bin/bash -lc true
          before="$(sha256sum execsurface.lock.json | awk '{print $1}')"
          "$EXECSURFACE_BIN" check --baseline execsurface.lock.json -- /bin/bash -lc true
          test "$before" = "$(sha256sum execsurface.lock.json | awk '{print $1}')"

  alpha6-public-binary-negative-floor:
    name: Retained Alpha.6 binary incompatibility / Ubuntu 22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Prove current public binary requires newer glibc
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1-r0-alpha6-negative"
          cd "$RUNNER_TEMP/v1-r0-alpha6-negative"
          gh release download "$ALPHA6_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --pattern "$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"
          tar -xzf "$ASSET"
          bin="$PWD/execsurface-${ALPHA6_TAG}-${TARGET}/execsurface"
          set +e
          output="$("$bin" --version 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -F "GLIBC_2.39" <<<"$output"

  alpha6-registry-source-probe:
    name: Alpha.6 crates.io local build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Install exact Alpha.6 from crates.io and exercise bounded path
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v1-r0-registry"
          cargo install execsurface --version "=$ALPHA6_VERSION" --locked --root "$root"
          bin="$root/bin/execsurface"
          test "$("$bin" --version)" = "execsurface $ALPHA6_VERSION"
          work="$RUNNER_TEMP/v1-r0-registry-work"
          mkdir -p "$work"
          cd "$work"
          "$bin" doctor
          "$bin" learn --output execsurface.lock.json -- /bin/bash -lc true
          "$bin" check --baseline execsurface.lock.json -- /bin/bash -lc true

  msrv-probe:
    name: Declared Rust 1.82 source floor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install declared MSRV toolchain
        shell: bash
        run: rustup toolchain install 1.82.0 --profile minimal
      - name: Check CLI package at declared MSRV
        shell: bash
        run: cargo +1.82.0 check --locked -p execsurface
