name: P4 A1.2 guarded rustfmt correction

on:
  push:
    branches:
      - development/post-alpha4-behavioral-integrity
    paths:
      - .github/workflows/p4-a1-2-rustfmt-fix.yml

permissions:
  contents: write

jobs:
  rustfmt-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: development/post-alpha4-behavioral-integrity
          fetch-depth: 0

      - name: Install pinned Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal
          rustup component add --toolchain 1.90.0 rustfmt

      - name: Apply formatter and enforce exact diff boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 fmt --manifest-path experiments/p4-backend-authority/Cargo.toml
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "experiments/p4-backend-authority/src/ptrace_v2.rs"

      - name: Commit exact rustfmt-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/p4-backend-authority/src/ptrace_v2.rs
          git commit -m "P4 A1.2: rustfmt-only ptrace mapping correction"
          git push origin HEAD:development/post-alpha4-behavioral-integrity
