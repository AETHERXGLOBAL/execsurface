name: M9.1 post-hardening zero-contact batch

on:
  push:
    branches:
      - milestone/m9-1-post-hardening-external-workloads
    paths:
      - .github/workflows/m9-1-post-hardening-zero-contact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-contact:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ZC-01-JUST
            project: just
            repository: casey/just
            revision: 5d5742cbcc50f19c99c356bc7e085acaa5f4665d
            ecosystem: rust
          - id: ZC-02-RIPGREP
            project: ripgrep
            repository: BurntSushi/ripgrep
            revision: 3fce3b5bb0236da2df6d99672afb8a719642eca7
            ecosystem: rust
          - id: ZC-03-FZF
            project: fzf
            repository: junegunn/fzf
            revision: b1be3a8be1b833ce5b92fbbac11637643d60a046
            ecosystem: go
    env:
      RUST_TOOLCHAIN: 1.90.0
      SAMPLE_TIMEOUT: 120
      INSTALL_ROOT: /tmp/execsurface-m9-install
      WORK_ROOT: /tmp/execsurface-m9-external

    steps:
      - name: Checkout ExecSurface candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout pinned external project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: external/project
          fetch-depth: 1
          persist-credentials: false

      - name: Install frozen Rust toolchain and prepare paths
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          test "$(git -C external/project rev-parse HEAD)" = "${{ matrix.revision }}"
          test -z "$(git -C external/project status --porcelain)"
          rm -rf "$WORK_ROOT" "$INSTALL_ROOT"
          cp -a external/project "$WORK_ROOT"
          test "$(git -C "$WORK_ROOT" rev-parse HEAD)" = "${{ matrix.revision }}"
          test -z "$(git -C "$WORK_ROOT" status --porcelain)"
          mkdir -p "m9-evidence/${{ matrix.id }}" "$INSTALL_ROOT"
          if [ "${{ matrix.project }}" = "just" ]; then
            printf '%s\n' "cd '$WORK_ROOT' && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1" > /tmp/m9-run-command
          elif [ "${{ matrix.project }}" = "ripgrep" ]; then
            printf '%s\n' "cd '$WORK_ROOT' && cargo +$RUST_TOOLCHAIN test --workspace --all-targets >/dev/null 2>&1" > /tmp/m9-run-command
          else
            printf '%s\n' "cd '$WORK_ROOT' && go test ./... >/dev/null 2>&1" > /tmp/m9-run-command
          fi
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'execsurface_source_sha=%s\n' "$GITHUB_SHA"
            printf 'project=%s\n' '${{ matrix.repository }}'
            printf 'revision=%s\n' '${{ matrix.revision }}'
            printf 'runner_image=%s\n' "${ImageOS:-ubuntu24}"
            printf 'kernel=%s\n' "$(uname -srmo)"
            printf 'architecture=%s\n' "$(uname -m)"
            printf 'cpu=%s\n' "$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
            printf 'go=%s\n' "$(go version 2>/dev/null || echo NOT_APPLICABLE)"
            printf 'rustc=%s\n' "$(rustc +$RUST_TOOLCHAIN --version)"
            printf 'command=%s\n' "$(cat /tmp/m9-run-command)"
          } > "m9-evidence/${{ matrix.id }}/environment.txt"

      - name: Install ExecSurface from exact source
        id: install
        shell: bash
        run: |
          set +e
          cargo "+$RUST_TOOLCHAIN" install --locked --path crates/execsurface-cli --root "$INSTALL_ROOT" \
            > "m9-evidence/${{ matrix.id }}/install.stdout" \
            2> "m9-evidence/${{ matrix.id }}/install.stderr"
          rc=$?
          printf 'install_rc=%s\n' "$rc" | tee "m9-evidence/${{ matrix.id }}/install.status"
          if [ "$rc" -eq 0 ]; then
            "$INSTALL_ROOT/bin/execsurface" --version \
              > "m9-evidence/${{ matrix.id }}/execsurface-version.txt" 2>&1 || true
          fi
          exit 0

      - name: Collect compatibility and performance evidence without erasing failures
        shell: bash
        run: |
          set -uo pipefail
          evidence="m9-evidence/${{ matrix.id }}"
          exe="$INSTALL_ROOT/bin/execsurface"
          cmd="$(cat /tmp/m9-run-command)"
          install_rc="$(sed -n 's/^install_rc=//p' "$evidence/install.status")"

          direct_status=NOT_RUN
          doctor_status=NOT_RUN
          baseline_status=NOT_RUN
          check_status=NOT_RUN
          check1_verdict=''
          check2_verdict=''
          operational_error=''
          performance_status=NOT_RUN

          if [ "$install_rc" -ne 0 ]; then
            operational_error='ExecSurface source installation failed'
          else
            set +e
            timeout --signal=TERM --kill-after=5s "${SAMPLE_TIMEOUT}s" bash -lc "$cmd" \
              >"$evidence/direct.stdout" 2>"$evidence/direct.stderr"
            direct_rc=$?
            set -e
            printf 'direct_rc=%s\n' "$direct_rc" > "$evidence/direct.status"
            if [ "$direct_rc" -eq 0 ]; then
              direct_status=PASS
            else
              direct_status=FAIL
              operational_error="direct compatibility command failed rc=$direct_rc"
            fi

            set +e
            "$exe" doctor >"$evidence/doctor.stdout" 2>"$evidence/doctor.stderr"
            doctor_rc=$?
            set -e
            printf 'doctor_rc=%s\n' "$doctor_rc" > "$evidence/doctor.status"
            if [ "$doctor_rc" -eq 0 ]; then doctor_status=PASS; else doctor_status=FAIL; fi

            if [ "$direct_rc" -eq 0 ]; then
              set +e
              timeout --signal=TERM --kill-after=5s "${SAMPLE_TIMEOUT}s" \
                "$exe" learn --output "$evidence/baseline.lock.json" -- /bin/bash -lc "$cmd" \
                >"$evidence/learn.stdout" 2>"$evidence/learn.stderr"
              learn_rc=$?
              set -e
              printf 'learn_rc=%s\n' "$learn_rc" > "$evidence/learn.status"
              if [ "$learn_rc" -eq 0 ]; then
                baseline_status=PASS
                check_fail=0
                for n in 1 2; do
                  set +e
                  timeout --signal=TERM --kill-after=5s "${SAMPLE_TIMEOUT}s" \
                    "$exe" check --baseline "$evidence/baseline.lock.json" \
                    --json-output "$evidence/check-${n}.json" \
                    --markdown-output "$evidence/check-${n}.md" \
                    -- /bin/bash -lc "$cmd" \
                    >"$evidence/check-${n}.stdout" 2>"$evidence/check-${n}.stderr"
                  rc=$?
                  set -e
                  printf 'check_%s_rc=%s\n' "$n" "$rc" >> "$evidence/check.status"
                  if [ "$rc" -ne 0 ]; then check_fail=1; fi
                done
                python3 - "$evidence" > "$evidence/check-verdicts.txt" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          for n in (1, 2):
              p = root / f"check-{n}.json"
              if not p.exists():
                  print(f"check{n}=MISSING findings=-1")
                  continue
              data = json.loads(p.read_text())
              print(f"check{n}={data.get('verdict')} findings={len(data.get('findings', []))}")
          PY
                check1_verdict="$(sed -n 's/^check1=\([^ ]*\).*/\1/p' "$evidence/check-verdicts.txt")"
                check2_verdict="$(sed -n 's/^check2=\([^ ]*\).*/\1/p' "$evidence/check-verdicts.txt")"
                findings1="$(sed -n 's/^check1=[^ ]* findings=//p' "$evidence/check-verdicts.txt")"
                findings2="$(sed -n 's/^check2=[^ ]* findings=//p' "$evidence/check-verdicts.txt")"
                if [ "$check_fail" -eq 0 ] && [ "$check1_verdict" = pass ] && [ "$check2_verdict" = pass ] && [ "$findings1" = 0 ] && [ "$findings2" = 0 ]; then
                  check_status=PASS
                else
                  check_status=FAIL
                  operational_error="${operational_error:+$operational_error; }unchanged rerun/check did not produce two zero-finding PASS results"
                fi
              else
                baseline_status=FAIL
                operational_error="${operational_error:+$operational_error; }baseline creation failed rc=$learn_rc"
              fi

              # Pre-performance observed completion gate.
              set +e
              timeout --signal=TERM --kill-after=5s "${SAMPLE_TIMEOUT}s" \
                "$exe" observe -- /bin/bash -lc "$cmd" \
                >"$evidence/preperf-observe.json" 2>"$evidence/preperf-observe.stderr"
              preperf_rc=$?
              set -e
              printf 'preperf_rc=%s\n' "$preperf_rc" > "$evidence/preperf.status"
              preperf_complete=0
              if [ "$preperf_rc" -eq 0 ]; then
                python3 - "$evidence/preperf-observe.json" <<'PY' && preperf_complete=1 || preperf_complete=0
          import json, sys
          d=json.load(open(sys.argv[1]))
          assert d.get('complete') is True, d.get('warnings')
          o=d.get('outcome', {})
          assert o.get('exit_code') == 0 and o.get('signal') is None, o
          PY
              fi

              if [ "$preperf_complete" -eq 1 ]; then
                performance_status=RUNNING
                : > "$evidence/warmup-direct-ms.txt"
                : > "$evidence/warmup-ptrace-ms.txt"
                : > "$evidence/measured-direct-ms.txt"
                : > "$evidence/measured-ptrace-ms.txt"
                perf_fail=0

                measure_direct() {
                  local target="$1"
                  python3 - "$cmd" "$SAMPLE_TIMEOUT" "$target" <<'PY'
          import subprocess, sys, time
          cmd, timeout_s, out = sys.argv[1], float(sys.argv[2]), sys.argv[3]
          t0=time.perf_counter_ns()
          try:
              p=subprocess.run(['/bin/bash','-lc',cmd], timeout=timeout_s)
              rc=p.returncode
          except subprocess.TimeoutExpired:
              rc=124
          ms=(time.perf_counter_ns()-t0)/1_000_000
          with open(out,'a') as f: f.write(f'{ms:.6f}\n')
          raise SystemExit(0 if rc == 0 else 1)
          PY
                }

                measure_ptrace() {
                  local target="$1"
                  local seq="$2"
                  python3 - "$exe" "$cmd" "$SAMPLE_TIMEOUT" "$target" "$evidence/perf-observe-${seq}.json" "$evidence/perf-observe-${seq}.stderr" <<'PY'
          import json, subprocess, sys, time
          exe, cmd, timeout_s, timings, jout, jerr = sys.argv[1:]
          t0=time.perf_counter_ns()
          try:
              with open(jout,'w') as out, open(jerr,'w') as err:
                  p=subprocess.run([exe,'observe','--','/bin/bash','-lc',cmd], stdout=out, stderr=err, timeout=float(timeout_s))
              rc=p.returncode
          except subprocess.TimeoutExpired:
              rc=124
          ms=(time.perf_counter_ns()-t0)/1_000_000
          with open(timings,'a') as f: f.write(f'{ms:.6f}\n')
          if rc != 0:
              raise SystemExit(1)
          try:
              d=json.load(open(jout))
              assert d.get('complete') is True
              o=d.get('outcome', {})
              assert o.get('exit_code') == 0 and o.get('signal') is None
          except Exception:
              raise SystemExit(1)
          PY
                }

                for i in 1 2 3; do
                  measure_direct "$evidence/warmup-direct-ms.txt" || perf_fail=1
                done
                for i in 1 2 3; do
                  measure_ptrace "$evidence/warmup-ptrace-ms.txt" "warmup-$i" || perf_fail=1
                done

                if [ "$perf_fail" -eq 0 ]; then
                  for i in $(seq 1 15); do
                    if [ $((i % 2)) -eq 1 ]; then
                      measure_direct "$evidence/measured-direct-ms.txt" || perf_fail=1
                      measure_ptrace "$evidence/measured-ptrace-ms.txt" "measured-$i-a" || perf_fail=1
                    else
                      measure_ptrace "$evidence/measured-ptrace-ms.txt" "measured-$i-a" || perf_fail=1
                      measure_direct "$evidence/measured-direct-ms.txt" || perf_fail=1
                    fi
                    [ "$perf_fail" -eq 0 ] || break
                  done
                fi

                if [ "$perf_fail" -eq 0 ] && [ "$(wc -l < "$evidence/measured-direct-ms.txt")" -eq 15 ] && [ "$(wc -l < "$evidence/measured-ptrace-ms.txt")" -eq 15 ]; then
                  performance_status=PASS
                else
                  performance_status=FAIL
                  operational_error="${operational_error:+$operational_error; }performance series failed or incomplete"
                fi
              else
                performance_status=FAIL
                operational_error="${operational_error:+$operational_error; }pre-performance observed command was incomplete or failed"
              fi
            fi
          fi

          cat > "$evidence/state.env" <<EOF
          install_status=$([ "$install_rc" -eq 0 ] && echo PASS || echo FAIL)
          direct_status=$direct_status
          doctor_status=$doctor_status
          baseline_status=$baseline_status
          check_status=$check_status
          check1_verdict=$check1_verdict
          check2_verdict=$check2_verdict
          performance_status=$performance_status
          operational_error=$operational_error
          EOF
          cat "$evidence/state.env"
          exit 0

      - name: Build and validate M9 evidence record
        shell: bash
        run: |
          set -euo pipefail
          evidence="m9-evidence/${{ matrix.id }}"
          source "$evidence/state.env"
          find "$evidence" -maxdepth 1 -type f ! -name RAW_SHA256SUMS ! -name evidence.json -print0 \
            | sort -z | xargs -0 sha256sum > "$evidence/RAW_SHA256SUMS"
          manifest_sha="$(sha256sum "$evidence/RAW_SHA256SUMS" | awk '{print $1}')"
          version="$($INSTALL_ROOT/bin/execsurface --version 2>/dev/null || echo unavailable)"
          kernel="$(uname -srmo)"
          arch="$(uname -m)"
          cpu="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          python3 - "$evidence" "$manifest_sha" "$version" "$kernel" "$arch" "$cpu" "$timestamp" "$run_url" "$GITHUB_SHA" \
            '${{ matrix.id }}' '${{ matrix.project }}' '${{ matrix.repository }}' '${{ matrix.revision }}' \
            "$install_status" "$doctor_status" "$baseline_status" "$check_status" "$performance_status" "$operational_error" <<'PY'
          import json, statistics, sys
          from pathlib import Path
          (root_s, manifest_sha, version, kernel, arch, cpu, timestamp, run_url, source_sha,
           eid, project, repository, revision, install_status, doctor_status, baseline_status,
           check_status, perf_status, operational_error) = sys.argv[1:]
          root=Path(root_s)
          cmd=Path('/tmp/m9-run-command').read_text().strip()
          failures=[]
          if operational_error:
              failures.append({'kind':'runtime_or_measurement_failure','description':operational_error,'retained':True})
          performance=None
          if perf_status == 'PASS':
              def vals(name): return [float(x) for x in (root/name).read_text().splitlines() if x.strip()]
              wd=vals('warmup-direct-ms.txt'); wp=vals('warmup-ptrace-ms.txt')
              d=vals('measured-direct-ms.txt'); p=vals('measured-ptrace-ms.txt')
              md=float(statistics.median(d)); mp=float(statistics.median(p))
              overhead=mp-md; ratio=mp/md if md>0 else float('inf')
              trigger=((md>=100.0 and ratio>2.0) or overhead>500.0)
              performance={
                  'warmup_direct_ms':wd,'warmup_ptrace_ms':wp,
                  'measured_direct_ms':d,'measured_ptrace_ms':p,
                  'median_direct_ms':md,'median_ptrace_ms':mp,
                  'median_absolute_overhead_ms':overhead,'slowdown_ratio':ratio,
                  'timeout_seconds':120.0,'m65_trigger_crossed':trigger,'excluded_samples':[]
              }
          compatibility_ok=(install_status=='PASS' and doctor_status=='PASS' and baseline_status=='PASS' and check_status=='PASS')
          status='COMPUTATIONAL_EVIDENCE' if compatibility_ok and perf_status=='PASS' else 'PARTIAL'
          verdict='PASS' if check_status=='PASS' else None
          record={
              'schema_version':'m9-evidence-v1',
              'evidence_id':f'M9-{eid}-POSTHARDENING-001',
              'timestamp_utc':timestamp,
              'independence_class':'ZERO_CONTACT_EXTERNAL_REPRO',
              'claim_status':status,
              'external_reference':f'https://github.com/{repository}/commit/{revision}',
              'provenance':{'initiated_by':'AETHER_X','executed_by':'AETHER_X','aether_x_material_involvement':True,'third_party_attestation':None},
              'project':{'name':project,'repository':f'https://github.com/{repository}','revision':revision,'modified_by_aether_x':False},
              'execsurface':{'version':version,'source_sha':source_sha,'install_path':'cargo install --locked --path crates/execsurface-cli from main-derived M9.1 branch','backend':'ptrace'},
              'host':{'os':'Ubuntu 24.04 GitHub-hosted runner','kernel':kernel,'architecture':arch,'cpu_description':cpu,'runner_image':'ubuntu-24.04'},
              'workflow':{'command':cmd,'baseline_attempted':baseline_status!='NOT_RUN','rerun_check_attempted':check_status!='NOT_RUN','drift_case_attempted':False,'notes':'Post-hardening frozen zero-contact compatibility and performance batch; no artificial drift in this batch.'},
              'outcome':{'installation':install_status,'doctor':doctor_status,'baseline':baseline_status,'rerun_check':check_status,'drift_case':'NOT_RUN','verdict':verdict,'comparable':compatibility_ok,'complete':compatibility_ok,'operational_error':operational_error or None,'false_positive_reported':False,'suspected_false_negative':False,'usability_friction':None},
              'privacy':{'metadata_only_confirmed':True,'prohibited_sensitive_payload_collected':False,'notes':'No file contents, environment values, stdin contents, network payloads, secrets, credentials, or unrestricted argv were collected into accepted evidence.'},
              'performance':performance,
              'artifacts':[{'name':'raw evidence SHA-256 manifest','sha256':manifest_sha,'location':run_url}],
              'failures_exclusions':failures,
              'reproduction':{'instructions':f'Checkout {repository}@{revision}; use ExecSurface source {source_sha}; prime once; run doctor, learn, two unchanged checks, then frozen 3+15 timing protocol with 120s/sample timeout.','expected_scope':'Exact GitHub-hosted Ubuntu 24.04 zero-contact external reproduction; not independent adoption and not a universal Linux performance claim.'}
          }
          (root/'evidence.json').write_text(json.dumps(record, indent=2, sort_keys=True)+'\n')
          PY

          python3 scripts/m9_validate_evidence.py "$evidence/evidence.json" \
            | tee "$evidence/validator.txt"
          python3 -m json.tool "$evidence/evidence.json" >/dev/null
          sha256sum "$evidence/evidence.json" > "$evidence/evidence.sha256"

      - name: Upload complete evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m9-1-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: m9-evidence/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce expected compatibility result after preserving evidence
        shell: bash
        run: |
          set -euo pipefail
          source "m9-evidence/${{ matrix.id }}/state.env"
          test "$install_status" = PASS
          test "$doctor_status" = PASS
          test "$baseline_status" = PASS
          test "$check_status" = PASS
          test "$performance_status" = PASS
