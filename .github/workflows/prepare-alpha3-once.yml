name: Prepare alpha.3 once

on:
  push:
    branches:
      - release/v0.1.0-alpha.3
    paths:
      - .github/workflows/prepare-alpha3-once.yml

permissions:
  contents: write

concurrency:
  group: prepare-alpha3-once
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_BASE: c8bdcb189ef9d4dc59428cab1a4aa20dca12b8ed
      OLD_VERSION: 0.1.0-alpha.2
      NEW_VERSION: 0.1.0-alpha.3
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify starting lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/v0.1.0-alpha.3"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_BASE" origin/main

      - name: Apply atomic alpha.3 identity bump
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          old = "0.1.0-alpha.2"
          new = "0.1.0-alpha.3"

          files = [
              Path("Cargo.toml"),
              Path("crates/execsurface-baseline/Cargo.toml"),
              Path("crates/execsurface-cli/Cargo.toml"),
              Path("crates/execsurface-diff/Cargo.toml"),
              Path("crates/execsurface-normalize/Cargo.toml"),
              Path("crates/execsurface-observe/Cargo.toml"),
              Path("crates/execsurface-policy/Cargo.toml"),
              Path("crates/execsurface-report/Cargo.toml"),
              Path(".github/workflows/registry-packaging.yml"),
              Path(".github/workflows/publish-crates.yml"),
              Path(".github/workflows/release.yml"),
              Path("action/release-tag.txt"),
          ]

          for path in files:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"expected at least one {old} occurrence in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          request_path = Path(".release/release-request.json")
          request = json.loads(request_path.read_text(encoding="utf-8"))
          if request.get("version") != old or request.get("tag") != f"v{old}":
              raise SystemExit(f"unexpected release request identity: {request}")
          request["version"] = new
          request["tag"] = f"v{new}"
          request["request_revision"] = int(request.get("request_revision", 0)) + 1
          request_path.write_text(json.dumps(request, indent=2) + "\n", encoding="utf-8")

          notes = Path("docs/releases/v0.1.0-alpha.3.md")
          if notes.exists():
              raise SystemExit("alpha.3 release notes already exist")
          notes.write_text("""# ExecSurface v0.1.0-alpha.3

Third public alpha, promoting the ptrace lifecycle hardening and the M9.1 external-workload evidence already merged to `main`.

## Reliability and validation

- incorporates the lifecycle-specific ptrace hardening closed under issue #55;
- retains fail-closed completeness and existing PASS / REVIEW / BLOCK / ERROR authority semantics;
- adds durable lifecycle regression coverage, including the pinned `casey/just` external workload;
- carries the M9.1 zero-contact external workload evidence for `just`, `ripgrep`, `fzf`, and `fd`;
- preserves negative and PARTIAL evidence for unstable build/test surfaces rather than relabeling it as success.

## Distribution

- Linux x86_64 remains the public support scope;
- native ptrace remains the public correctness-reference backend;
- GitHub Release binary, crates.io package chain, and the stable `AETHERXGLOBAL/execsurface@v0.1` Action channel remain supported;
- this release does not authorize the experimental eBPF backend for PASS, learn/check, automatic backend selection, or baseline interchangeability.

## Product boundary

ExecSurface detects observed runtime execution-surface drift. It does not prove software safety, and observed behavior is not all possible behavior.
""", encoding="utf-8")
          PY

          cargo generate-lockfile

      - name: Prove version graph and release controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, tomllib

          version = "0.1.0-alpha.3"
          root = tomllib.loads(Path("Cargo.toml").read_text())
          assert root["workspace"]["package"]["version"] == version

          publishable = {
              "execsurface-model",
              "execsurface-observe",
              "execsurface-normalize",
              "execsurface-baseline",
              "execsurface-diff",
              "execsurface-policy",
              "execsurface-report",
              "execsurface",
          }
          manifests = {}
          for path in Path("crates").glob("*/Cargo.toml"):
              data = tomllib.loads(path.read_text())
              manifests[data["package"]["name"]] = (path, data)
          assert publishable.issubset(manifests)
          assert manifests["execsurface-bench"][1]["package"].get("publish") is False

          for name in publishable:
              path, data = manifests[name]
              for section in ("dependencies", "dev-dependencies", "build-dependencies"):
                  for dep_name, dep in data.get(section, {}).items():
                      if dep_name.startswith("execsurface-") and isinstance(dep, dict) and "path" in dep:
                          assert dep.get("version") == f"={version}", (path, section, dep_name, dep)

          request = json.loads(Path(".release/release-request.json").read_text())
          assert request["version"] == version
          assert request["tag"] == f"v{version}"
          assert request["stable_channel"] == "v0.1"
          assert Path("action/release-tag.txt").read_text().strip() == f"v{version}"
          assert Path(f"docs/releases/v{version}.md").exists()

          lock = Path("Cargo.lock").read_text()
          for name in ["execsurface", "execsurface-baseline", "execsurface-bench", "execsurface-diff", "execsurface-model", "execsurface-normalize", "execsurface-observe", "execsurface-policy", "execsurface-report"]:
              needle = f'name = "{name}"\nversion = "{version}"'
              assert needle in lock, name

          current_controls = [
              "Cargo.toml",
              "crates/execsurface-baseline/Cargo.toml",
              "crates/execsurface-cli/Cargo.toml",
              "crates/execsurface-diff/Cargo.toml",
              "crates/execsurface-normalize/Cargo.toml",
              "crates/execsurface-observe/Cargo.toml",
              "crates/execsurface-policy/Cargo.toml",
              "crates/execsurface-report/Cargo.toml",
              ".github/workflows/registry-packaging.yml",
              ".github/workflows/publish-crates.yml",
              ".github/workflows/release.yml",
              "action/release-tag.txt",
              ".release/release-request.json",
          ]
          for item in current_controls:
              assert "0.1.0-alpha.2" not in Path(item).read_text(), item
          print("ALPHA3_IDENTITY_GRAPH_VALID")
          PY

      - name: Run unchanged product and packaging gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo package -p execsurface-model --allow-dirty
          cargo metadata --locked --no-deps --format-version 1 >/tmp/alpha3-metadata.json
          test "$(python3 -c 'import json; d=json.load(open("/tmp/alpha3-metadata.json")); print(next(p["version"] for p in d["packages"] if p["name"]=="execsurface"))')" = "$NEW_VERSION"

      - name: Commit prepared release identity as one change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-alpha3-once.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml \
            .github/workflows/registry-packaging.yml \
            .github/workflows/publish-crates.yml \
            .github/workflows/release.yml \
            action/release-tag.txt .release/release-request.json \
            docs/releases/v0.1.0-alpha.3.md \
            .github/workflows/prepare-alpha3-once.yml
          git commit -m "release: prepare v0.1.0-alpha.3"
          git fetch origin release/v0.1.0-alpha.3
          test "$(git rev-parse origin/release/v0.1.0-alpha.3)" = "$GITHUB_SHA"
          git push origin HEAD:release/v0.1.0-alpha.3
