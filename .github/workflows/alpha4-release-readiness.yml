name: Alpha.4 Release Readiness

on:
  push:
    branches:
      - release/v0.1.0-alpha.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Identity and tag absence
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < action/release-tag.txt)" = "v0.1.0-alpha.4"
          version="$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="execsurface"))')"
          test "$version" = "0.1.0-alpha.4"
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.0-alpha.4 >/dev/null 2>&1; then
            echo 'v0.1.0-alpha.4 tag already exists before readiness closeout' >&2
            exit 1
          fi

      - name: Active release surfaces contain no alpha.3
        shell: bash
        run: |
          set -euo pipefail
          files=(
            Cargo.toml Cargo.lock
            crates/execsurface-model/Cargo.toml
            crates/execsurface-observe/Cargo.toml
            crates/execsurface-normalize/Cargo.toml
            crates/execsurface-baseline/Cargo.toml
            crates/execsurface-diff/Cargo.toml
            crates/execsurface-policy/Cargo.toml
            crates/execsurface-report/Cargo.toml
            crates/execsurface-cli/Cargo.toml
            README.md action/release-tag.txt
            docs/QUICKSTART_5_MIN.md docs/SELF_SERVICE_START.md docs/GITHUB_ACTION.md
            .github/workflows/release.yml .github/workflows/publish-crates.yml
          )
          if grep -nF '0.1.0-alpha.3' "${files[@]}"; then
            echo 'stale alpha.3 reference in active release surface' >&2
            exit 1
          fi

      - name: Exact internal dependency pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('crates').glob('*/Cargo.toml'):
              text=p.read_text()
              if 'execsurface-' in text and '=0.1.0-alpha.3' in text:
                  raise SystemExit(f'stale internal pin: {p}')
          PY

      - name: Release workflow alpha.4 bindings
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'AETHERXGLOBAL/execsurface@v0.1.0-alpha.4' .github/workflows/release.yml
          grep -F 'test "$TAG" = "v0.1.0-alpha.4"' .github/workflows/release.yml
          grep -F 'default: v0.1.0-alpha.4' .github/workflows/publish-crates.yml
          test -f docs/releases/v0.1.0-alpha.4.md

      - name: Format Clippy and full tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          git diff --exit-code -- Cargo.lock
          test -z "$(git status --porcelain -- Cargo.lock)"

      - name: Build and version smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p execsurface --bin execsurface
          test "$(./target/release/execsurface --version)" = 'execsurface 0.1.0-alpha.4'
          ./target/release/execsurface doctor

      - name: Package topology with explicit sequential-registry boundary
        shell: bash
        run: |
          set -euo pipefail

          # The dependency-root crate has no unpublished ExecSurface dependency,
          # so it must package normally without bypassing verification.
          cargo package -p execsurface-model --locked --allow-dirty

          # Validate the full prospective dependency graph structurally. Dependent
          # crates cannot truthfully complete registry-backed packaging until the
          # exact predecessor version becomes visible on crates.io.
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          root = tomllib.loads(Path('Cargo.toml').read_text())
          version = root['workspace']['package']['version']
          assert version == '0.1.0-alpha.4'

          publishable = {
              'execsurface-model',
              'execsurface-observe',
              'execsurface-normalize',
              'execsurface-baseline',
              'execsurface-diff',
              'execsurface-policy',
              'execsurface-report',
              'execsurface',
          }
          manifests = {}
          for path in Path('crates').glob('*/Cargo.toml'):
              data = tomllib.loads(path.read_text())
              manifests[data['package']['name']] = (path, data)

          assert publishable.issubset(manifests)
          assert manifests['execsurface-bench'][1]['package'].get('publish') is False

          for name in publishable:
              path, data = manifests[name]
              package = data['package']
              assert package.get('version', {}).get('workspace') is True
              assert package['description']
              for section in ('dependencies', 'dev-dependencies', 'build-dependencies'):
                  for dep_name, dep in data.get(section, {}).items():
                      if dep_name.startswith('execsurface-') and isinstance(dep, dict) and 'path' in dep:
                          assert dep.get('version') == f'={version}', (
                              f'{path}: {section}.{dep_name} must pin ={version}'
                          )
          print('Prospective alpha.4 package graph verified')
          PY

          # Preserve the real registry boundary as executable evidence: before
          # publication, the first dependent crate must fail specifically because
          # execsurface-model alpha.4 is not yet visible in crates.io. Any other
          # reason is a blocker, and unexpected success means public state changed.
          set +e
          cargo package -p execsurface-observe --locked --allow-dirty > "$RUNNER_TEMP/observe-package.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/observe-package.log"
          test "$rc" -eq 101
          grep -F 'no matching package named `execsurface-model` found' "$RUNNER_TEMP/observe-package.log"
          grep -F 'crates.io index' "$RUNNER_TEMP/observe-package.log"

      - name: Prospective release bundle and checksum
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.1.0-alpha.4
          target=x86_64-unknown-linux-gnu
          dirname="execsurface-${tag}-${target}"
          asset="${dirname}.tar.gz"
          mkdir -p "dist/$dirname"
          cp target/release/execsurface "dist/$dirname/execsurface"
          cp LICENSE NOTICE "dist/$dirname/"
          printf 'ExecSurface %s\nsource_commit=%s\ntarget=%s\nevidence_schema=v2\n' "$tag" "$GITHUB_SHA" "$target" > "dist/$dirname/BUILD_INFO.txt"
          tar -C dist -czf "dist/$asset" "$dirname"
          (cd dist && sha256sum "$asset" > "$asset.sha256" && sha256sum -c "$asset.sha256")

      - name: Public-line ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=100
          git merge-base --is-ancestor origin/main HEAD
