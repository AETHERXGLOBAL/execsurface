name: M9 ptrace lifecycle clean promotion

on:
  push:
    branches:
      - fix/m9-ptrace-exit-group-lifecycle
    paths:
      - .github/workflows/m9-ptrace-fix-promotion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-prove-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_TOOLCHAIN: 1.90.0
      SOURCE: crates/execsurface-observe/src/linux_ptrace.rs
      EXPECTED_SOURCE_SHA256: 3dc656358a3675a0d78135bb83046bc45c33dca2718c8bd8b68fa090e18eac8b
      JUST_SHA: 5d5742cbcc50f19c99c356bc7e085acaa5f4665d
      HARDENING_REF: origin/hardening/m9-ptrace-esrch-just
    steps:
      - name: Checkout clean promotion branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch evidence-source hardening branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/m9-ptrace-esrch-just:refs/remotes/origin/hardening/m9-ptrace-esrch-just

      - name: Checkout pinned unmodified casey just
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: casey/just
          ref: ${{ env.JUST_SHA }}
          path: external/just
          fetch-depth: 1
          persist-credentials: false

      - name: Install frozen Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt --toolchain "$RUST_TOOLCHAIN"
          test "$(git -C external/just rev-parse HEAD)" = "$JUST_SHA"
          test -z "$(git -C external/just status --porcelain)"

      - name: Reconstruct exact proved production source from main baseline
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            m9_apply_ptrace_esrch_fix.py \
            m9_apply_ptrace_exit_lifecycle.py \
            m9_apply_ptrace_preregistration_ordering.py \
            m9_apply_get_syscall_info_exit_group_fix.py \
            m9_finalize_ptrace_lifecycle_core.py; do
            git show "$HARDENING_REF:scripts/$script" > "/tmp/$script"
          done
          python3 /tmp/m9_apply_ptrace_esrch_fix.py
          python3 /tmp/m9_apply_ptrace_exit_lifecycle.py
          python3 /tmp/m9_apply_ptrace_preregistration_ordering.py
          python3 /tmp/m9_apply_get_syscall_info_exit_group_fix.py
          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 "$SOURCE"
          python3 /tmp/m9_finalize_ptrace_lifecycle_core.py
          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 "$SOURCE"
          actual="$(sha256sum "$SOURCE" | awk '{print $1}')"
          printf 'expected_source_sha256=%s\nactual_source_sha256=%s\n' \
            "$EXPECTED_SOURCE_SHA256" "$actual"
          test "$actual" = "$EXPECTED_SOURCE_SHA256"
          git diff --check -- "$SOURCE"

      - name: Materialize durable bounded lifecycle fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/fixtures/m9
          git show "$HARDENING_REF:tests/fixtures/m9/exit_group_sched_getaffinity_bounded_race.c" \
            > tests/fixtures/m9/exit_group_sched_getaffinity_bounded_race.c
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/fixtures/m9/exit_group_sched_getaffinity_bounded_race.c \
            -o /tmp/m9-ptrace-bounded-race
          for attempt in 1 2 3 4 5; do
            timeout --signal=TERM --kill-after=2s 10s /tmp/m9-ptrace-bounded-race >/dev/null
          done

      - name: Run unchanged observer regression suite
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" test -p execsurface-observe
          cargo "+$RUST_TOOLCHAIN" build -p execsurface

      - name: Re-prove clean source on bounded lifecycle race
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            out="/tmp/m9-promotion-${attempt}.json"
            err="/tmp/m9-promotion-${attempt}.stderr"
            timeout --signal=TERM --kill-after=2s 10s \
              target/debug/execsurface observe -- /tmp/m9-ptrace-bounded-race \
              >"$out" 2>"$err"
            python3 - "$out" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          assert data.get("complete") is True, data.get("warnings")
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, outcome
          assert outcome.get("signal") is None, outcome
          PY
            if grep -Eq 'ExecSurface: ERROR|observer protocol error|observer OS error' "$err"; then
              cat "$err"
              exit 1
            fi
          done

      - name: Re-prove pinned casey just five consecutive times
        shell: bash
        run: |
          set -euo pipefail
          (cd external/just && cargo "+$RUST_TOOLCHAIN" test --all >/dev/null 2>&1)
          for attempt in 1 2 3 4 5; do
            out="/tmp/m9-just-${attempt}.json"
            err="/tmp/m9-just-${attempt}.stderr"
            timeout --signal=TERM --kill-after=5s 120s \
              target/debug/execsurface observe -- /bin/bash -lc \
              "cd external/just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1" \
              >"$out" 2>"$err"
            python3 - "$out" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          assert data.get("complete") is True, data.get("warnings")
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, outcome
          assert outcome.get("signal") is None, outcome
          PY
            if grep -Eq 'ExecSurface: ERROR|observer protocol error|observer OS error' "$err"; then
              cat "$err"
              exit 1
            fi
          done

      - name: Write M9 hardening closeout record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/milestones
          cat > docs/milestones/M9_PTRACE_ESRCH_HARDENING_CLOSEOUT.md <<'EOF'
          # M9 ptrace ESRCH hardening closeout

          Status: PROVED candidate for merge, subject to pull-request CI and final main rerun.

          ## Counterexample
          Public `0.1.0-alpha.2` failed closed on pinned `casey/just` commit
          `5d5742cbcc50f19c99c356bc7e085acaa5f4665d` with ptrace `ESRCH`.

          ## Root cause and bounded handling
          Hardening localized lifecycle races across Linux ptrace thread groups, including
          exec TID collapse, pre-registration ordering, exit-event lifecycle, and a
          `PTRACE_GET_SYSCALL_INFO` `ESRCH` window during an explicitly observed sibling
          `exit_group` teardown. The product candidate handles only lifecycle states backed
          by explicit tracker state; it does not introduce blanket `ESRCH` suppression,
          sleeps, retry loops, eBPF substitution, or relaxed completeness semantics.

          ## Accepted H1.9 evidence
          - H1.9 run: `36277418787`
          - exact production source SHA-256:
            `3dc656358a3675a0d78135bb83046bc45c33dca2718c8bd8b68fa090e18eac8b`
          - bounded diagnostic reproducer: 240/240 complete, 37 exact bounded
            `PTRACE_GET_SYSCALL_INFO` `ESRCH` recoveries observed
          - instrumentation removed and exact production source restored
          - production-clean bounded stress: 240/240 complete
          - unchanged observer regression suite: PASS
          - pinned `casey/just`: 5/5 complete with exit 0
          - artifact ID: `10917113831`
          - artifact ZIP SHA-256:
            `f70954c54e210f4c3de0ee7cdb70f5179a4105021bfd502858bb8acb3ffcbff3`

          ## Discriminator result
          The earlier infinite-syscall stress fixture was retained as negative diagnostic
          evidence but rejected as a lifecycle acceptance gate after snapshots showed
          ptrace-stop starvation could occur before the tracer processed `exit_group`.
          Finite bounded fixtures removed that confounder while still reproducing the exact
          `GET_SYSCALL_INFO` lifecycle race.

          ## Authority boundary
          Baseline, diff, policy, report, event-budget, privacy, and eBPF authorization
          semantics are unchanged. The ptrace backend remains the correctness reference.
          EOF

      - name: Commit only durable product changes and closeout evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "$EXPECTED_SOURCE_SHA256"
          git diff --check
          git add \
            "$SOURCE" \
            tests/fixtures/m9/exit_group_sched_getaffinity_bounded_race.c \
            docs/milestones/M9_PTRACE_ESRCH_HARDENING_CLOSEOUT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M9: harden ptrace lifecycle against process-dense ESRCH races"
          git push origin HEAD:fix/m9-ptrace-exit-group-lifecycle
