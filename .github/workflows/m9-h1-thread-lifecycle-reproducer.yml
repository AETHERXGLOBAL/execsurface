name: M9-H1.1 thread lifecycle reproducer

on:
  push:
    branches:
      - hardening/m9-ptrace-esrch-just
    paths:
      - tests/fixtures/m9/thread_lifecycle_repro.c
      - docs/milestones/M9_H1_1_THREAD_LIFECYCLE_REPRODUCER.md
      - scripts/m9_apply_ptrace_esrch_fix.py
      - scripts/m9_apply_ptrace_exit_lifecycle.py
      - scripts/m9_apply_ptrace_preregistration_ordering.py
      - .github/workflows/m9-h1-thread-lifecycle-reproducer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isolate-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUST_TOOLCHAIN: 1.90.0
      JUST_SHA: 5d5742cbcc50f19c99c356bc7e085acaa5f4665d
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install frozen Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt --toolchain "$RUST_TOOLCHAIN"
          rustc "+$RUST_TOOLCHAIN" --version --verbose
          cc --version | head -n 1

      - name: Build and prove fixture directly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m9-h1-evidence
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/fixtures/m9/thread_lifecycle_repro.c \
            -o /tmp/m9-thread-lifecycle-repro
          sha256sum tests/fixtures/m9/thread_lifecycle_repro.c /tmp/m9-thread-lifecycle-repro \
            > m9-h1-evidence/fixture-SHA256SUMS
          for attempt in 1 2 3 4 5; do
            /tmp/m9-thread-lifecycle-repro 12 16 4 \
              > "m9-h1-evidence/direct-${attempt}.stdout" \
              2> "m9-h1-evidence/direct-${attempt}.stderr"
            grep -q '^M9_H1_1_FIXTURE_PASS ' "m9-h1-evidence/direct-${attempt}.stdout"
          done

      - name: Apply bounded lifecycle candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/m9_apply_ptrace_esrch_fix.py
          python3 scripts/m9_apply_ptrace_exit_lifecycle.py
          python3 scripts/m9_apply_ptrace_preregistration_ordering.py
          cargo "+$RUST_TOOLCHAIN" fmt --all
          git diff --check
          git diff -- crates/execsurface-observe/src/linux_ptrace.rs \
            > m9-h1-evidence/candidate.diff
          test -s m9-h1-evidence/candidate.diff

      - name: Run observer regression suite unchanged
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" test -p execsurface-observe \
            2>&1 | tee m9-h1-evidence/observer-tests.log

      - name: Build candidate ExecSurface
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" build -p execsurface \
            2>&1 | tee m9-h1-evidence/build.log

      - name: Prove minimal fixture under observation
        shell: bash
        run: |
          set -euo pipefail
          : > m9-h1-evidence/reproducer-summary.txt
          for attempt in $(seq 1 12); do
            target/debug/execsurface observe -- \
              /tmp/m9-thread-lifecycle-repro 12 16 4 \
              > "m9-h1-evidence/repro-${attempt}.stdout" \
              2> "m9-h1-evidence/repro-${attempt}.stderr"

            python3 - "$attempt" <<'PY'
          import json
          import sys
          from pathlib import Path
          attempt = sys.argv[1]
          raw_path = Path(f"m9-h1-evidence/repro-{attempt}.stdout")
          raw = raw_path.read_text(encoding="utf-8")
          lines = raw.splitlines()
          assert lines and lines[0].startswith("M9_H1_1_FIXTURE_PASS "), raw[:200]
          json_start = raw.find("\n{")
          assert json_start >= 0, raw[:400]
          payload = raw[json_start + 1:]
          data = json.loads(payload)
          assert data.get("complete") is True, (raw_path, data.get("warnings"))
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, (raw_path, outcome)
          assert outcome.get("signal") is None, (raw_path, outcome)
          normalized = Path(f"m9-h1-evidence/repro-{attempt}.json")
          normalized.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

            if grep -Eq 'M9_(UNTRACKED|UNEXPECTED|DUPLICATE|INVALID|STALE|PREREGISTRATION_STOPS_AT_ECHILD)|ExecSurface: ERROR|observer protocol error|observer OS error' \
              "m9-h1-evidence/repro-${attempt}.stderr"; then
              cat "m9-h1-evidence/repro-${attempt}.stderr"
              exit 1
            fi

            reconciled=$(grep -c 'M9_PREREGISTRATION_STOP_RECONCILED' \
              "m9-h1-evidence/repro-${attempt}.stderr" || true)
            printf 'attempt=%s complete=true exit=0 prereg_reconciled=%s\n' \
              "$attempt" "$reconciled" >> m9-h1-evidence/reproducer-summary.txt
          done

      - name: Checkout pinned unmodified casey/just
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: casey/just
          ref: ${{ env.JUST_SHA }}
          path: external/just
          fetch-depth: 1
          persist-credentials: false

      - name: Prime external workload directly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/just rev-parse HEAD)" = "$JUST_SHA"
          test -z "$(git -C external/just status --porcelain)"
          (cd external/just && cargo "+$RUST_TOOLCHAIN" test --all >/dev/null 2>&1)

      - name: Prove pinned just three times after minimal gate
        shell: bash
        run: |
          set -euo pipefail
          : > m9-h1-evidence/just-summary.txt
          for attempt in 1 2 3; do
            target/debug/execsurface observe -- \
              /bin/bash -lc \
              "cd external/just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1" \
              > "m9-h1-evidence/just-${attempt}.json" \
              2> "m9-h1-evidence/just-${attempt}.stderr"

            python3 - "$attempt" <<'PY'
          import json
          import sys
          from pathlib import Path
          attempt = sys.argv[1]
          path = Path(f"m9-h1-evidence/just-{attempt}.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("complete") is True, (path, data.get("warnings"))
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, (path, outcome)
          assert outcome.get("signal") is None, (path, outcome)
          PY

            if grep -Eq 'M9_(UNTRACKED|UNEXPECTED|DUPLICATE|INVALID|STALE|PREREGISTRATION_STOPS_AT_ECHILD)|ExecSurface: ERROR|observer protocol error|observer OS error' \
              "m9-h1-evidence/just-${attempt}.stderr"; then
              cat "m9-h1-evidence/just-${attempt}.stderr"
              exit 1
            fi

            reconciled=$(grep -c 'M9_PREREGISTRATION_STOP_RECONCILED' \
              "m9-h1-evidence/just-${attempt}.stderr" || true)
            printf 'attempt=%s complete=true exit=0 prereg_reconciled=%s\n' \
              "$attempt" "$reconciled" >> m9-h1-evidence/just-summary.txt
          done

      - name: Seal evidence manifest
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'head_sha=%s\n' "$GITHUB_SHA"
            printf 'just_sha=%s\n' "$JUST_SHA"
            printf 'rust_toolchain=%s\n' "$RUST_TOOLCHAIN"
            printf 'kernel=%s\n' "$(uname -srmo)"
          } > m9-h1-evidence/environment.txt
          find m9-h1-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > m9-h1-evidence/SHA256SUMS

      - name: Upload M9-H1.1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m9-h1-thread-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: m9-h1-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Preserve gate summary in GitHub
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="docs/milestones/evidence/m9-h1-1/run-${GITHUB_RUN_ID}"
          mkdir -p "$evidence_dir"
          cp m9-h1-evidence/environment.txt "$evidence_dir/environment.txt"
          cp m9-h1-evidence/SHA256SUMS "$evidence_dir/SHA256SUMS"
          [ ! -f m9-h1-evidence/reproducer-summary.txt ] || cp m9-h1-evidence/reproducer-summary.txt "$evidence_dir/reproducer-summary.txt"
          [ ! -f m9-h1-evidence/just-summary.txt ] || cp m9-h1-evidence/just-summary.txt "$evidence_dir/just-summary.txt"
          git add "$evidence_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "M9-H1.1: preserve thread lifecycle gate run ${GITHUB_RUN_ID}"
            git push origin HEAD:hardening/m9-ptrace-esrch-just
          fi
