name: Alpha5 release dry-run v2 portable reproducible

on:
  push:
    branches:
      - integration/post-alpha4-promotion-candidate
    paths:
      - .github/workflows/alpha5-release-dry-run-v2-portable-reproducible.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha5-release-dry-run-v2
  cancel-in-progress: false

env:
  FROZEN_SHA: 5067200452c174da6bc8d9d7ecf6957ee379f0a2
  ALPHA4_SOURCE: 48e0b9a0707553349e75e97a9dfa096d13f9ab5d
  NEXT_VERSION: 0.1.0-alpha.5
  NEXT_TAG: v0.1.0-alpha.5
  TARGET_TRIPLE: x86_64-unknown-linux-gnu
  RUST_TOOLCHAIN: 1.90.0
  SOURCE_DATE_EPOCH: '1790875860'
  RETAINED_A7_FAILURE_RUN: '36901600086'

jobs:
  portable-reproducible-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Checkout workflow driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact frozen source twice at independent paths
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FROZEN_SHA }}
          path: src-a
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FROZEN_SHA }}
          path: src-b
          persist-credentials: false

      - name: Verify anchors and retain A7 counterevidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C src-a rev-parse HEAD)" = "$FROZEN_SHA"
          test "$(git -C src-b rev-parse HEAD)" = "$FROZEN_SHA"
          git -C driver fetch --force --tags origin
          test "$(git -C driver rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git -C driver rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
          ! git -C driver show-ref --verify --quiet refs/tags/v0.1.0-alpha.5
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RETAINED_A7_FAILURE_RUN" > retained-a7-failure.json
          jq -e '.status == "completed" and .conclusion == "failure"' retained-a7-failure.json >/dev/null

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy

      - name: Materialize identical alpha5 staging transforms
        shell: bash
        run: |
          set -euo pipefail
          cp -a src-a stage-a
          cp -a src-b stage-b
          for root in stage-a stage-b; do
            printf '%s\n' "$NEXT_TAG" > "$root/action/release-tag.txt"
            ROOT="$root" python3 - <<'PY'
          import os
          from pathlib import Path
          old='0.1.0-alpha.4'; new='0.1.0-alpha.5'; root=Path(os.environ['ROOT'])
          for m in root.rglob('Cargo.toml'):
              t=m.read_text().replace(f'version = "{old}"',f'version = "{new}"').replace(f'version = "={old}"',f'version = "={new}"')
              m.write_text(t)
          lock=root/'Cargo.lock'; chunks=lock.read_text().split('[[package]]'); out=[chunks[0]]
          for c in chunks[1:]:
              lines=c.splitlines(); name=next((x.split('=',1)[1].strip().strip('"') for x in lines if x.startswith('name = ')),None)
              if name and name.startswith('execsurface'):
                  lines=[f'version = "{new}"' if x==f'version = "{old}"' else x for x in lines]
              out.append('\n'.join(lines))
          lock.write_text('[[package]]'.join(out))
          PY
          done
          diff -ru --exclude=.git stage-a stage-b

      - name: Full staged source qualification on portable baseline
        working-directory: stage-a
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN fmt --all -- --check
          cargo +$RUST_TOOLCHAIN clippy --locked --workspace --all-targets -- -D warnings
          cargo +$RUST_TOOLCHAIN test --locked --workspace --all-targets
          cargo +$RUST_TOOLCHAIN test --locked --workspace --doc

      - name: Build from two paths under deterministic release contract
        shell: bash
        env:
          CARGO_INCREMENTAL: '0'
          TZ: UTC
          LC_ALL: C
        run: |
          set -euo pipefail
          common='-C debuginfo=0 -C link-arg=-Wl,--build-id=none'
          RUSTFLAGS="$common --remap-path-prefix=$(pwd)/stage-a=/src --remap-path-prefix=$HOME/.cargo=/cargo" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/repro-a" \
            cargo +$RUST_TOOLCHAIN build --manifest-path stage-a/Cargo.toml --locked --release -p execsurface --bin execsurface
          RUSTFLAGS="$common --remap-path-prefix=$(pwd)/stage-b=/src --remap-path-prefix=$HOME/.cargo=/cargo" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/repro-b" \
            cargo +$RUST_TOOLCHAIN build --manifest-path stage-b/Cargo.toml --locked --release -p execsurface --bin execsurface
          a="$RUNNER_TEMP/repro-a/release/execsurface"
          b="$RUNNER_TEMP/repro-b/release/execsurface"
          test "$("$a" --version)" = "execsurface $NEXT_VERSION"
          test "$("$b" --version)" = "execsurface $NEXT_VERSION"
          sha256sum "$a" "$b" | tee reproducible-binaries.sha256
          cmp -s "$a" "$b"

      - name: Enforce glibc compatibility ceiling
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/repro-a/release/execsurface"
          strings "$bin" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu | tee glibc-required.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          vals=[]
          for line in Path('glibc-required.txt').read_text().splitlines():
              m=re.fullmatch(r'GLIBC_([0-9]+(?:\.[0-9]+)+)',line.strip())
              if m: vals.append(tuple(map(int,m.group(1).split('.'))))
          assert vals, 'no GLIBC requirements discovered'
          highest=max(vals)
          print('highest_glibc=', '.'.join(map(str,highest)))
          assert highest <= (2,35), highest
          PY

      - name: Assemble deterministic release bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          root="execsurface-${NEXT_TAG}-${TARGET_TRIPLE}"
          asset="${root}.tar.gz"
          mkdir -p "evidence/dist/$root"
          cp "$RUNNER_TEMP/repro-a/release/execsurface" "evidence/dist/$root/execsurface"
          cp stage-a/LICENSE stage-a/NOTICE "evidence/dist/$root/"
          {
            echo "ExecSurface $NEXT_TAG"
            echo "product_version=$NEXT_VERSION"
            echo "target=$TARGET_TRIPLE"
            echo "frozen_source_commit=$FROZEN_SHA"
            echo 'builder_baseline=ubuntu-22.04'
            echo 'rust_toolchain=1.90.0'
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
            echo 'deterministic_path_remap=true'
            echo 'publication=dry-run-only'
            echo 'p8_external_validation_closed=false'
          } > "evidence/dist/$root/BUILD_INFO.txt"
          find "evidence/dist/$root" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -C evidence/dist -cf - "$root" | gzip -n > "evidence/dist/$asset"
          (cd evidence/dist && sha256sum "$asset" > "$asset.sha256" && sha256sum -c "$asset.sha256")
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Verify bundle is reproducible from second binary
        env:
          ASSET: ${{ steps.bundle.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          root="execsurface-${NEXT_TAG}-${TARGET_TRIPLE}"
          mkdir -p "evidence/dist2/$root"
          cp "$RUNNER_TEMP/repro-b/release/execsurface" "evidence/dist2/$root/execsurface"
          cp stage-b/LICENSE stage-b/NOTICE "evidence/dist2/$root/"
          cp "evidence/dist/$root/BUILD_INFO.txt" "evidence/dist2/$root/BUILD_INFO.txt"
          find "evidence/dist2/$root" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -C evidence/dist2 -cf - "$root" | gzip -n > "evidence/dist2/$ASSET"
          sha256sum "evidence/dist/$ASSET" "evidence/dist2/$ASSET" | tee reproducible-bundles.sha256
          cmp -s "evidence/dist/$ASSET" "evidence/dist2/$ASSET"

      - name: Generate and verify provenance
        env:
          ASSET: ${{ steps.bundle.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('evidence/dist')/os.environ['ASSET']
          s={
            '_type':'https://in-toto.io/Statement/v1',
            'subject':[{'name':p.name,'digest':{'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}}],
            'predicateType':'https://slsa.dev/provenance/v1',
            'predicate':{
              'buildDefinition':{
                'buildType':'https://github.com/AETHERXGLOBAL/execsurface/alpha5-release-dry-run-v2/v1',
                'externalParameters':{'prospectiveVersion':os.environ['NEXT_VERSION'],'prospectiveTag':os.environ['NEXT_TAG'],'target':os.environ['TARGET_TRIPLE'],'builderBaseline':'ubuntu-22.04'},
                'internalParameters':{'frozenSourceCommit':os.environ['FROZEN_SHA'],'sourceDateEpoch':os.environ['SOURCE_DATE_EPOCH'],'deterministicPathRemap':True},
                'resolvedDependencies':[{'uri':'git+https://github.com/AETHERXGLOBAL/execsurface.git','digest':{'gitCommit':os.environ['FROZEN_SHA']}}]
              },
              'runDetails':{'builder':{'id':f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/alpha5-release-dry-run-v2-portable-reproducible.yml"},'metadata':{'invocationId':f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'dryRun':True}}
            }
          }
          Path('evidence/alpha5-provenance-v2.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          assert s['subject'][0]['digest']['sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          PY

      - name: Record repaired release-builder evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo 'decision_candidate=ALPHA5_RELEASE_DRY_RUN_V2_PORTABLE_REPRODUCIBLE_PASS'
            echo "frozen_sha=${FROZEN_SHA}"
            echo 'builder_baseline=ubuntu-22.04'
            echo 'glibc_ceiling=2.35'
            echo 'cross_path_binary_reproducible=true'
            echo 'deterministic_bundle=true'
            echo "retained_a7_failure_run=${RETAINED_A7_FAILURE_RUN}"
            echo 'release_authorized=false'
            echo 'p8_external_validation_closed=false'
          } | tee evidence/alpha5-release-dry-run-v2.txt
          cp reproducible-binaries.sha256 reproducible-bundles.sha256 glibc-required.txt evidence/

      - uses: actions/upload-artifact@v4
        with:
          name: alpha5-release-dry-run-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
