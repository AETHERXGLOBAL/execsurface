name: Post-M9 ptrace stop-tax calibration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/post-m9-ptrace-stop-tax-calibration.yml
      - docs/milestones/POST_M9_PTRACE_STOP_TAX_CALIBRATION_PROTOCOL.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXECSURFACE_RUST_TOOLCHAIN: 1.90.0
      INSTALL_ROOT: /tmp/execsurface-stop-tax-install
      TARGET: /tmp/execsurface-stop-tax
      EVIDENCE: post-m9-stop-tax
      SAMPLE_TIMEOUT: 60

    steps:
      - name: Checkout ExecSurface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze environment and synthetic source
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/milestones/POST_M9_PTRACE_STOP_TAX_CALIBRATION_PROTOCOL.md
          rustup toolchain install "$EXECSURFACE_RUST_TOOLCHAIN" --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace gcc
          rm -rf "$INSTALL_ROOT" "$EVIDENCE" "$TARGET"
          mkdir -p "$INSTALL_ROOT" "$EVIDENCE"

          cat > "$EVIDENCE/stop_tax.c" <<'C'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <sys/syscall.h>
          #include <unistd.h>

          int main(int argc, char **argv) {
              if (argc != 2) return 64;
              errno = 0;
              char *end = 0;
              unsigned long long n = strtoull(argv[1], &end, 10);
              if (errno != 0 || end == argv[1] || *end != '\0') return 64;
              volatile long accumulator = 0;
              for (unsigned long long i = 0; i < n; ++i) {
                  accumulator ^= syscall(SYS_getpid);
              }
              if (accumulator == -1) return 70;
              return 0;
          }
          C

          gcc -O2 -Wall -Wextra -Werror "$EVIDENCE/stop_tax.c" -o "$TARGET"
          test -x "$TARGET"

          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'kernel=%s\n' "$(uname -srmo)"
            printf 'architecture=%s\n' "$(uname -m)"
            printf 'cpu=%s\n' "$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
            printf 'gcc=%s\n' "$(gcc --version | head -1)"
            printf 'strace=%s\n' "$(strace -V | head -1)"
            printf 'rustc=%s\n' "$(rustc +$EXECSURFACE_RUST_TOOLCHAIN --version)"
            printf 'n_values=0,1000,5000,10000,20000\n'
            printf 'warmups_per_mode=3\n'
            printf 'measured_per_mode=7\n'
            printf 'outlier_removal=none\n'
          } > "$EVIDENCE/environment.txt"

      - name: Build current ExecSurface
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$EXECSURFACE_RUST_TOOLCHAIN" install --locked --path crates/execsurface-cli --root "$INSTALL_ROOT" \
            > "$EVIDENCE/install.stdout" 2> "$EVIDENCE/install.stderr"
          "$INSTALL_ROOT/bin/execsurface" doctor > "$EVIDENCE/doctor.stdout" 2> "$EVIDENCE/doctor.stderr"

      - name: Frozen direct and ptrace timing series
        shell: bash
        run: |
          set -euo pipefail
          exe="$INSTALL_ROOT/bin/execsurface"

          measure_direct() {
            python3 - "$TARGET" "$1" "$SAMPLE_TIMEOUT" "$2" <<'PY'
          import subprocess,sys,time
          target,n,timeout_s,out=sys.argv[1],sys.argv[2],float(sys.argv[3]),sys.argv[4]
          t0=time.perf_counter_ns()
          try: rc=subprocess.run([target,n],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=timeout_s).returncode
          except subprocess.TimeoutExpired: rc=124
          ms=(time.perf_counter_ns()-t0)/1_000_000
          with open(out,'a') as f:f.write(f'{ms:.6f}\n')
          raise SystemExit(0 if rc==0 else 1)
          PY
          }

          measure_ptrace() {
            python3 - "$exe" "$TARGET" "$1" "$SAMPLE_TIMEOUT" "$2" "$3" "$4" <<'PY'
          import json,subprocess,sys,time
          exe,target,n,timeout_s,timings,jout,jerr=sys.argv[1:]
          t0=time.perf_counter_ns()
          try:
              with open(jout,'w') as out,open(jerr,'w') as err:
                  rc=subprocess.run([exe,'observe','--',target,n],stdout=out,stderr=err,timeout=float(timeout_s)).returncode
          except subprocess.TimeoutExpired: rc=124
          ms=(time.perf_counter_ns()-t0)/1_000_000
          with open(timings,'a') as f:f.write(f'{ms:.6f}\n')
          if rc != 0: raise SystemExit(1)
          d=json.load(open(jout)); o=d.get('outcome',{})
          assert d.get('complete') is True, d.get('warnings')
          assert not d.get('warnings'), d.get('warnings')
          assert o.get('exit_code') == 0 and o.get('signal') is None, o
          PY
          }

          for n in 0 1000 5000 10000 20000; do
            root="$EVIDENCE/N-$n"
            mkdir -p "$root"
            : > "$root/warmup-direct-ms.txt"
            : > "$root/warmup-ptrace-ms.txt"
            : > "$root/measured-direct-ms.txt"
            : > "$root/measured-ptrace-ms.txt"

            for i in 1 2 3; do measure_direct "$n" "$root/warmup-direct-ms.txt"; done
            for i in 1 2 3; do
              measure_ptrace "$n" "$root/warmup-ptrace-ms.txt" "$root/warmup-$i.json" "$root/warmup-$i.stderr"
            done

            for i in $(seq 1 7); do
              if [ $((i % 2)) -eq 1 ]; then
                measure_direct "$n" "$root/measured-direct-ms.txt"
                measure_ptrace "$n" "$root/measured-ptrace-ms.txt" "$root/measured-$i.json" "$root/measured-$i.stderr"
              else
                measure_ptrace "$n" "$root/measured-ptrace-ms.txt" "$root/measured-$i.json" "$root/measured-$i.stderr"
                measure_direct "$n" "$root/measured-direct-ms.txt"
              fi
            done
            test "$(wc -l < "$root/measured-direct-ms.txt")" -eq 7
            test "$(wc -l < "$root/measured-ptrace-ms.txt")" -eq 7
          done

      - name: Diagnostic trace-stop counters
        shell: bash
        run: |
          set -euo pipefail
          exe="$INSTALL_ROOT/bin/execsurface"
          for n in 0 1000 5000 10000 20000; do
            root="$EVIDENCE/N-$n"
            timeout --signal=TERM --kill-after=5s "${SAMPLE_TIMEOUT}s" \
              strace -qq -s 128 -o "$root/observer-strace.log" \
              -e trace=ptrace,wait4,waitid,readlink,readlinkat \
              "$exe" observe -- "$TARGET" "$n" \
              > "$root/diagnostic-observe.json" 2> "$root/diagnostic-observe.stderr"
          done

      - name: Evaluate predeclared causal test
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EVIDENCE" <<'PY'
          import json,math,re,statistics,sys
          from pathlib import Path

          root=Path(sys.argv[1])
          ns=[0,1000,5000,10000,20000]
          points=[]
          for n in ns:
              p=root/f'N-{n}'
              direct=[float(x) for x in (p/'measured-direct-ms.txt').read_text().split()]
              ptrace=[float(x) for x in (p/'measured-ptrace-ms.txt').read_text().split()]
              if len(direct)!=7 or len(ptrace)!=7: raise SystemExit(f'invalid sample count for N={n}')
              dm=statistics.median(direct); pm=statistics.median(ptrace)
              dmad=statistics.median(abs(x-dm) for x in direct)
              pmad=statistics.median(abs(x-pm) for x in ptrace)
              d=json.loads((p/'diagnostic-observe.json').read_text())
              o=d.get('outcome',{})
              complete=d.get('complete') is True and not d.get('warnings') and o.get('exit_code')==0 and o.get('signal') is None
              text=(p/'observer-strace.log').read_text(errors='replace')
              counters={
                  'ptrace_total':len(re.findall(r'\bptrace\(',text)),
                  'ptrace_get_syscall_info':text.count('PTRACE_GET_SYSCALL_INFO'),
                  'ptrace_syscall_resume':text.count('PTRACE_SYSCALL'),
                  'ptrace_geteventmsg':text.count('PTRACE_GETEVENTMSG'),
                  'ptrace_peekdata':text.count('PTRACE_PEEKDATA'),
                  'wait4_total':len(re.findall(r'\bwait4\(',text)),
                  'waitid_total':len(re.findall(r'\bwaitid\(',text)),
                  'readlink_total':len(re.findall(r'\breadlink\(',text)),
                  'raw_event_count':len(d.get('events',[])),
                  'warning_count':len(d.get('warnings',[])),
              }
              points.append({
                  'n':n,
                  'direct_ms':{'samples':direct,'median':dm,'mad':dmad},
                  'ptrace_ms':{'samples':ptrace,'median':pm,'mad':pmad},
                  'median_absolute_overhead_ms':pm-dm,
                  'diagnostic_complete':complete,
                  'counters':counters,
              })

          g0=points[0]['counters']['ptrace_get_syscall_info']
          exact_stop_rule=all(p['counters']['ptrace_get_syscall_info']-g0==2*p['n'] for p in points[1:])
          all_complete=all(p['diagnostic_complete'] and p['counters']['warning_count']==0 for p in points)
          xs=[float(p['n']) for p in points]
          ys=[p['median_absolute_overhead_ms'] for p in points]
          xm=sum(xs)/len(xs); ym=sum(ys)/len(ys)
          sxx=sum((x-xm)**2 for x in xs)
          slope=sum((x-xm)*(y-ym) for x,y in zip(xs,ys))/sxx
          intercept=ym-slope*xm
          fitted=[intercept+slope*x for x in xs]
          ss_res=sum((y-f)**2 for y,f in zip(ys,fitted))
          ss_tot=sum((y-ym)**2 for y in ys)
          r2=1.0-ss_res/ss_tot if ss_tot else 1.0
          passed=all_complete and exact_stop_rule and slope>0 and r2>=0.98
          result={
              'classification':'MEASURED_CAUSAL_CALIBRATION' if passed else 'PARTIAL',
              'scope':'exact synthetic workload and GitHub-hosted runner only',
              'source_sha':__import__('os').environ['GITHUB_SHA'],
              'points':points,
              'predeclared_tests':{
                  'all_observations_complete_and_warning_free':all_complete,
                  'delta_get_syscall_info_equals_2N':exact_stop_rule,
                  'positive_overhead_slope':slope>0,
                  'r_squared_at_least_0_98':r2>=0.98,
                  'no_clean_sample_removed':True,
              },
              'fit':{
                  'overhead_ms_per_added_getpid_syscall':slope,
                  'overhead_us_per_added_getpid_syscall':slope*1000.0,
                  'intercept_ms':intercept,
                  'r_squared':r2,
              },
              'authority_change':False,
              'runtime_code_change':False,
          }
          (root/'calibration-result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if not passed: raise SystemExit(2)
          PY

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-m9-ptrace-stop-tax-${{ github.run_id }}-${{ github.run_attempt }}
          path: post-m9-stop-tax
          if-no-files-found: error
          retention-days: 30
