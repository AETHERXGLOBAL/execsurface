name: A8 final rustfmt diagnostic

on:
  push:
    branches: [release/post-alpha4-candidate-assembly]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustfmt-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt
      - name: Generate exact canonical rustfmt patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff -- . ':(exclude).github/workflows/a8-final-rustfmt-diagnostic.yml' > rustfmt.patch
          test -s rustfmt.patch
          cat rustfmt.patch
      - name: Upload exact rustfmt patch
        uses: actions/upload-artifact@v4
        with:
          name: a8-final-rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 7
