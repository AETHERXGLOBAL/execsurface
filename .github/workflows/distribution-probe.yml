name: M6.6 Distribution Probe

on:
  push:
    branches:
      - "milestone/m6.6-public-self-service"
      - "milestone/m6.6-public-self-service-*"
  pull_request:

permissions:
  contents: read

jobs:
  git-install:
    name: Fresh cargo git install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve expected source version without checkout
        env:
          REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$REV/Cargo.toml" \
            --output "$RUNNER_TEMP/source-Cargo.toml"
          expected="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("/home/runner/work/_temp/source-Cargo.toml").read_text())
          print(data["workspace"]["package"]["version"])
          PY
          )"
          test -n "$expected"
          echo "EXPECTED_VERSION=$expected" >> "$GITHUB_ENV"

      - name: Install from immutable commit without checkout
        env:
          REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/execsurface-install"
          cargo install \
            --git https://github.com/AETHERXGLOBAL/execsurface.git \
            --rev "$REV" \
            execsurface \
            --locked \
            --root "$root"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Prove installed CLI identity and readiness
        run: |
          set -euo pipefail
          execsurface --version
          test "$(execsurface --version)" = "execsurface $EXPECTED_VERSION"
          work="$RUNNER_TEMP/execsurface-consumer"
          mkdir -p "$work"
          cd "$work"
          execsurface doctor

      - name: Prove learn and no-drift check
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/execsurface-consumer"
          cd "$work"
          execsurface learn -- /bin/bash -lc true
          execsurface check -- /bin/bash -lc true

      - name: Prove controlled drift is visible
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/execsurface-consumer"
          cd "$work"
          set +e
          output="$(execsurface check -- /bin/bash -lc 'true; /bin/echo drift >/dev/null' 2>&1)"
          status=$?
          set -e
          test "$status" -eq 10
          printf '%s\n' "$output"
          grep -F "ExecSurface: REVIEW" <<<"$output"

  crates-io-feasibility:
    name: crates.io registry-readiness decision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove leaf packaging and exact internal registry versions
        run: |
          set -euo pipefail
          cargo package -p execsurface-model --allow-dirty
          python - <<'PY'
          from pathlib import Path
          import tomllib

          root = tomllib.loads(Path("Cargo.toml").read_text())
          version = root["workspace"]["package"]["version"]
          publishable = {
              "execsurface-model",
              "execsurface-observe",
              "execsurface-normalize",
              "execsurface-baseline",
              "execsurface-diff",
              "execsurface-policy",
              "execsurface-report",
              "execsurface",
          }
          manifests = {}
          for path in Path("crates").glob("*/Cargo.toml"):
              data = tomllib.loads(path.read_text())
              manifests[data["package"]["name"]] = (path, data)

          assert publishable.issubset(manifests)
          assert manifests["execsurface-bench"][1]["package"].get("publish") is False

          for name in publishable:
              path, data = manifests[name]
              for section in ("dependencies", "dev-dependencies", "build-dependencies"):
                  for dep_name, dep in data.get(section, {}).items():
                      if dep_name.startswith("execsurface-") and isinstance(dep, dict) and "path" in dep:
                          assert dep.get("version") == f"={version}", (
                              f"{path}: {section}.{dep_name} must pin ={version}"
                          )
          print(f"crates.io: REGISTRY-READY for {version} — first publication still requires maintainer credentials")
          PY

  release-bundle-dry-run:
    name: Release bundle dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and package Linux x86_64 bundle from source identity
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="execsurface"))')"
          tag="v$version"
          target="x86_64-unknown-linux-gnu"
          dir="dist/execsurface-${tag}-${target}"
          archive="execsurface-${tag}-${target}.tar.gz"
          cargo build --locked --release -p execsurface --bin execsurface
          test "$(./target/release/execsurface --version)" = "execsurface $version"
          mkdir -p "$dir"
          cp target/release/execsurface "$dir/execsurface"
          cp LICENSE NOTICE "$dir/"
          {
            echo "ExecSurface $tag"
            echo "product_version=$version"
            echo "target=$target"
            echo "source_commit=$GITHUB_SHA"
            echo "build_workflow=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$dir/BUILD_INFO.txt"
          tar -C dist -czf "dist/$archive" "execsurface-${tag}-${target}"
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          (cd dist && sha256sum -c "$archive.sha256")
          mkdir -p "$RUNNER_TEMP/release-consumer"
          tar -xzf "dist/$archive" -C "$RUNNER_TEMP/release-consumer"
          binary="$RUNNER_TEMP/release-consumer/execsurface-${tag}-${target}/execsurface"
          test "$("$binary" --version)" = "execsurface $version"
          (
            cd "$RUNNER_TEMP/release-consumer"
            "$binary" doctor
            "$binary" learn -- /bin/bash -lc true
            "$binary" check -- /bin/bash -lc true
          )

      - name: Upload dry-run bundle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m6-6-release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
