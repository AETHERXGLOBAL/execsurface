name: P4 B1 compile-only exact fix

on:
  push:
    branches:
      - development/post-alpha4-behavioral-integrity
    paths:
      - '.github/workflows/p4-b1-compile-fix.yml'

permissions:
  contents: write

jobs:
  exact-rename:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply exact compile-only rename
        shell: python
        run: |
          from pathlib import Path

          path = Path('experiments/p4-backend-authority/tests/b1_open_object.rs')
          text = path.read_text()
          old = '''fn b1_entry_exit_actor_substitution_never_reaches_success() {
              let actor = actor(4242, 'c');
              let attempt = open_attempt(
                  OperationKind::Open,
                  actor.clone(),
                  200,
                  "$WORKSPACE/substitute",
                  digest('a'),
              );
              let evidence = EvidenceLedger::default()
                  .classify_pair(
                      attempt,
                      ExitEvidence {
                          actor: actor(9999, 'c'),
'''
          new = '''fn b1_entry_exit_actor_substitution_never_reaches_success() {
              let expected_actor = actor(4242, 'c');
              let attempt = open_attempt(
                  OperationKind::Open,
                  expected_actor.clone(),
                  200,
                  "$WORKSPACE/substitute",
                  digest('a'),
              );
              let evidence = EvidenceLedger::default()
                  .classify_pair(
                      attempt,
                      ExitEvidence {
                          actor: actor(9999, 'c'),
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'exact compile-fix precondition failed: matches={count}')
          path.write_text(text.replace(old, new, 1))

      - name: Verify one-file semantic-neutral diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'experiments/p4-backend-authority/tests/b1_open_object.rs'
          git diff --check
          git diff -- experiments/p4-backend-authority/tests/b1_open_object.rs

      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aetherxeg-source'
          git config user.email 'aether.x.eg@gmail.com'
          git add experiments/p4-backend-authority/tests/b1_open_object.rs
          git commit -m 'P4 B1: fix compile-only actor helper shadowing'
          git push origin HEAD:development/post-alpha4-behavioral-integrity
