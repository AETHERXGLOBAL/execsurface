name: Semantics v3 shared-FD experiment CI

on:
  push:
    branches: [development/post-alpha4-behavioral-integrity]
    paths:
      - .github/workflows/semantics-v3-shared-fd-ci.yml
      - experiments/semantics-v3-fd-relation/**
      - docs/development/SEMANTICS_V3_S5_*.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Rust formatting
        run: cargo fmt --manifest-path experiments/semantics-v3-fd-relation/Cargo.toml -- --check

      - name: Classifier clippy
        run: cargo clippy --locked --manifest-path experiments/semantics-v3-fd-relation/Cargo.toml --all-targets -- -D warnings

      - name: Classifier tests
        run: cargo test --locked --manifest-path experiments/semantics-v3-fd-relation/Cargo.toml --all-targets
