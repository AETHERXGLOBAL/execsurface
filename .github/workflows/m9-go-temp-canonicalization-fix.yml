name: M9 Go temp canonicalization fix gate

on:
  push:
    branches:
      - fix/m9-go-temp-canonicalization
    paths:
      - .github/workflows/m9-go-temp-canonicalization-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m9-go-temp-canonicalization-fix
  cancel-in-progress: false

jobs:
  prove-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUST_TOOLCHAIN: 1.90.0
    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install frozen Rust tooling
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"

      - name: Apply bounded normalization patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/m9_apply_go_temp_canonicalization.py
          cargo "+$RUST_TOOLCHAIN" fmt --all
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' crates/execsurface-model/src/canonical.rs crates/execsurface-normalize/src/lib.rs | sort)"
          grep -F 'pub const NORMALIZATION_PROFILE_VERSION: u32 = 3;' crates/execsurface-model/src/canonical.rs >/dev/null
          grep -F '$TMP/go-build<ephemeral>' crates/execsurface-normalize/src/lib.rs >/dev/null

      - name: Prove focused canonicalization semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" test --locked -p execsurface-normalize randomized_go_build_roots_collapse_but_suffix_remains_specific
          cargo "+$RUST_TOOLCHAIN" test --locked -p execsurface-normalize go_build_normalization_is_digit_only_and_plain_tmp_only

      - name: Run full unchanged CI semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" fmt --all -- --check
          cargo "+$RUST_TOOLCHAIN" clippy --locked --workspace --all-targets -- -D warnings
          cargo "+$RUST_TOOLCHAIN" test --locked --workspace --all-targets
          git diff --check

      - name: Commit exact proved product patch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/m9-go-temp-canonicalization
          remote="$(git rev-parse origin/fix/m9-go-temp-canonicalization)"
          test "$remote" = "$GITHUB_SHA"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' crates/execsurface-model/src/canonical.rs crates/execsurface-normalize/src/lib.rs | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/execsurface-model/src/canonical.rs crates/execsurface-normalize/src/lib.rs
          git diff --cached --check
          git commit -m "fix(normalize): stabilize Go ephemeral build roots"
          git push origin HEAD:fix/m9-go-temp-canonicalization
