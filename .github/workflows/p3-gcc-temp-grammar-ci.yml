name: P3 GCC temp grammar CI

on:
  push:
    branches:
      - development/post-alpha4-behavioral-integrity
    paths:
      - "experiments/p3-gcc-temp-grammar/**"
      - "crates/execsurface-normalize/**"
      - "crates/execsurface-model/**"
      - ".github/workflows/p3-gcc-temp-grammar-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcc-temp-grammar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust formatting
        run: cargo fmt --manifest-path experiments/p3-gcc-temp-grammar/Cargo.toml -- --check

      - name: Candidate clippy
        run: cargo clippy --manifest-path experiments/p3-gcc-temp-grammar/Cargo.toml --all-targets -- -D warnings

      - name: Candidate tests
        run: cargo test --manifest-path experiments/p3-gcc-temp-grammar/Cargo.toml --all-targets
