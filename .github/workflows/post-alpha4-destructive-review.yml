name: Post-alpha.4 destructive falsification review

on:
  push:
    branches: [review/post-alpha4-destructive-falsification]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-alpha4-destructive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-destructive-attacks:
    runs-on: ubuntu-24.04
    env:
      RUST_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Execute preregistered D01-D03 semantic attacks
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-model --test post_alpha4_destructive_review -- --nocapture

  existing-semantics-replay:
    runs-on: ubuntu-24.04
    env:
      RUST_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Replay accepted A1 promotion corpus
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-model --test semantics_v3_promotion -- --nocapture
      - name: Reprove model all-targets
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-model --all-targets

  p4-authority-replay:
    runs-on: ubuntu-24.04
    env:
      RUST_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Replay P4 cross-proposition corpus
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p4-backend-authority/Cargo.toml
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b_cross_proposition_falsification -- --nocapture
      - name: Replay backend-name anti-inflation
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --lib a0_backend_name_never_upgrades_weak_evidence -- --nocapture
      - name: Replay live success-authority propositions
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b1_ptrace_open_live -- --nocapture
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b2_ptrace_rename_delete_live -- --nocapture
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b3_ptrace_connect_live -- --nocapture

  p5-attestation-replay:
    runs-on: ubuntu-24.04
    env:
      RUST_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Replay P5 A5 cross-attestation red-team corpus
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p5-cross-attestation-redteam/Cargo.toml --test a5_graph_redteam -- --nocapture
      - name: Replay P5 verifier-identity addendum
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p5-scai-svr-binding/Cargo.toml --test verifier_identity_adequacy -- --nocapture

  m11-fail-closed-replay:
    runs-on: ubuntu-24.04
    env:
      RUST_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Replay M11 shared-FD ambiguity fail-closed regression
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-observe --test m11_shared_fd_ambiguity -- --nocapture

  immutable-public-boundary:
    runs-on: ubuntu-24.04
    env:
      ALPHA4_SOURCE: 48e0b9a0707553349e75e97a9dfa096d13f9ab5d
      FROZEN_CANDIDATE: 5079a990b924d8ccd7ac6414f8a9a2571b54e240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify immutable public release boundaries
        run: |
          set -euo pipefail
          test "$(git rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
          git merge-base --is-ancestor "$FROZEN_CANDIDATE" HEAD
          test -f docs/reviews/POST_ALPHA4_DESTRUCTIVE_REVIEW_PROTOCOL.md
          grep -q 'NOT EXTERNAL EVIDENCE' docs/reviews/POST_ALPHA4_DESTRUCTIVE_REVIEW_PROTOCOL.md
