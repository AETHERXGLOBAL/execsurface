name: M10.6 real loss authority

on:
  push:
    branches: [research/m10-hybrid-observer-m106]
    paths:
      - '.github/workflows/m10-6-loss-authority.yml'
      - 'experiments/m10/bpf-loss-authority/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loss-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p m10-6-artifacts
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static cpio clang llvm linux-tools-generic gcc pkg-config libbpf-dev libelf-dev zlib1g-dev libc6-dev
          BPFTOOL="$(find /usr/lib -type f -name bpftool -perm -111 -print | sort -V | tail -n1)"
          test -n "$BPFTOOL"
          echo "BPFTOOL=$BPFTOOL" >> "$GITHUB_ENV"
          "$BPFTOOL" version | tee m10-6-artifacts/bpftool-version.txt
          qemu-system-x86_64 --version | tee m10-6-artifacts/qemu-version.txt
      - name: Build loss probe
        shell: bash
        run: |
          set -euxo pipefail
          DIR="$GITHUB_WORKSPACE/experiments/m10/bpf-loss-authority"
          "$BPFTOOL" btf dump file /sys/kernel/btf/vmlinux format c > "$DIR/vmlinux.h"
          clang -g -O2 -target bpf -D__TARGET_ARCH_x86 -I"$DIR" -I/usr/include/$(uname -m)-linux-gnu -c "$DIR/loss_authority.bpf.c" -o "$DIR/loss_authority.bpf.o"
          "$BPFTOOL" gen skeleton "$DIR/loss_authority.bpf.o" > "$DIR/loss_authority.skel.h"
          STATIC_LIBS="$(pkg-config --static --libs libbpf)"
          gcc -O2 -g -Wall -Wextra -Werror -static -I"$DIR" "$DIR/loader.c" -o "$DIR/m10_loss_authority" $STATIC_LIBS -pthread
          file "$DIR/m10_loss_authority" | tee m10-6-artifacts/loader-file.txt
          file "$DIR/m10_loss_authority" | grep -q 'statically linked'
          sha256sum "$DIR/loss_authority.bpf.c" "$DIR/loader.c" "$DIR/loss_authority.bpf.o" "$DIR/m10_loss_authority" | tee m10-6-artifacts/build-sha256.txt
      - name: Acquire controlled guest kernel
        id: kernel
        shell: bash
        run: |
          set -euxo pipefail
          KERNEL_PKG="$(apt-cache show linux-image-generic | sed -n 's/^Depends: \(linux-image-[^, ]*-generic\).*/\1/p' | head -n1)"
          test -n "$KERNEL_PKG"
          KDIR="$RUNNER_TEMP/kernel"; KX="$RUNNER_TEMP/kernel-x"; BDIR="$RUNNER_TEMP/buildinfo"; BX="$RUNNER_TEMP/buildinfo-x"
          mkdir -p "$KDIR" "$KX" "$BDIR" "$BX"
          (cd "$KDIR" && apt-get download "$KERNEL_PKG")
          KDEB="$(find "$KDIR" -name '*.deb' -print -quit)"; dpkg-deb -x "$KDEB" "$KX"
          SOURCE_KERNEL="$(find "$KX/boot" -name 'vmlinuz-*-generic' | sort -V | tail -n1)"; VERSION="${SOURCE_KERNEL##*/vmlinuz-}"
          (cd "$BDIR" && apt-get download "linux-buildinfo-${VERSION}")
          BDEB="$(find "$BDIR" -name '*.deb' -print -quit)"; dpkg-deb -x "$BDEB" "$BX"
          CONFIG="$(find "$BX" -type f \( -name config -o -name "config-${VERSION}" \) -print -quit)"
          test -n "$SOURCE_KERNEL"; test -n "$CONFIG"
          for x in CONFIG_BPF=y CONFIG_BPF_SYSCALL=y; do grep -qx "$x" "$CONFIG"; done
          GUEST_KERNEL="$GITHUB_WORKSPACE/m10-6-artifacts/vmlinuz-${VERSION}"
          cp "$SOURCE_KERNEL" "$GUEST_KERNEL"; chmod 0644 "$GUEST_KERNEL"; cp "$CONFIG" m10-6-artifacts/guest-kernel-config.txt
          echo "$VERSION" | tee m10-6-artifacts/guest-kernel-version.txt
          echo "kernel=$GUEST_KERNEL" >> "$GITHUB_OUTPUT"
      - name: Build isolated initramfs
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/root"; mkdir -p "$ROOT"/{bin,dev,proc,sys,sys/kernel/tracing,tmp}; chmod 1777 "$ROOT/tmp"
          cp /bin/busybox "$ROOT/bin/busybox"
          for a in sh mount cat echo reboot sync; do ln -s busybox "$ROOT/bin/$a"; done
          cp experiments/m10/bpf-loss-authority/m10_loss_authority "$ROOT/bin/m10_loss_authority"
          cat > "$ROOT/init" <<'EOF'
          #!/bin/sh
          set -eu
          export PATH=/bin
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mkdir -p /sys/kernel/tracing
          mount -t tracefs tracefs /sys/kernel/tracing || true
          mount -t devtmpfs devtmpfs /dev || true
          echo M10_6_PROBE_BEGIN
          if [ -r /sys/kernel/btf/vmlinux ]; then echo M10_6_BTF_READABLE=true; else echo M10_6_BTF_READABLE=false; fi
          if [ -r /sys/kernel/tracing/events/syscalls/sys_enter_getpid/id ]; then echo M10_6_GETPID_TRACEPOINT=true; else echo M10_6_GETPID_TRACEPOINT=false; fi
          set +e
          /bin/m10_loss_authority
          RC=$?
          set -e
          echo "M10_6_LOADER_RC=$RC"
          echo M10_6_PROBE_COMPLETE
          sync
          reboot -f
          EOF
          chmod 0755 "$ROOT/init"
          (cd "$ROOT" && find . -print0 | cpio --null -ov --format=newc 2>/dev/null | gzip -9 > "$GITHUB_WORKSPACE/m10-6-artifacts/initramfs.cpio.gz")
          sha256sum m10-6-artifacts/initramfs.cpio.gz | tee m10-6-artifacts/initramfs.sha256
      - name: Execute frozen forced-loss proposition
        shell: bash
        run: |
          set -uo pipefail
          LOG=m10-6-artifacts/guest-serial.log
          set +e
          timeout 180s qemu-system-x86_64 -machine accel=tcg -cpu max -m 768M -nographic -no-reboot -kernel '${{ steps.kernel.outputs.kernel }}' -initrd m10-6-artifacts/initramfs.cpio.gz -append 'console=ttyS0 panic=-1' > "$LOG" 2>&1
          echo $? > m10-6-artifacts/qemu-exit-code.txt
          set -e
          cat "$LOG"
      - name: Frozen evaluator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          A=Path('m10-6-artifacts'); log=(A/'guest-serial.log').read_text(errors='replace') if (A/'guest-serial.log').exists() else ''
          def one(p):
              m=re.search(p,log,re.M); return m.group(1) if m else None
          btf='M10_6_BTF_READABLE=true' in log
          tp='M10_6_GETPID_TRACEPOINT=true' in log
          complete='M10_6_PROBE_COMPLETE' in log
          cand=one(r'^classification_candidate=(\S+)$')
          rc=one(r'^M10_6_LOADER_RC=(\d+)$'); rc=int(rc) if rc else None
          allowed={'M10_6_REAL_LOSS_DETECTED_FAIL_CLOSED','M10_6_REAL_LOSS_SILENT_AUTHORITY_FAILURE','M10_6_LOSS_ACCOUNTING_MISMATCH','M10_6_LOSS_NOT_FORCED'}
          if btf and tp and complete and cand in allowed: cls=cand
          elif complete and (not btf or not tp): cls='M10_6_ENVIRONMENT_BLOCKED'
          else: cls='M10_6_INFRA_FAILURE'
          r={'classification':cls,'btf_readable':btf,'getpid_tracepoint':tp,'probe_complete':complete,'loader_rc':rc,'public_authority':False,'product_integration_authorized':False}
          (A/'result.json').write_text(json.dumps(r,indent=2)+'\n'); print(json.dumps(r,indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-6-real-loss-authority-evidence
          path: m10-6-artifacts/
          if-no-files-found: error
