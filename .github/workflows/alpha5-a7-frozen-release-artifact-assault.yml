name: Alpha5 A7 frozen release artifact destructive equivalence

on:
  push:
    branches:
      - integration/post-alpha4-promotion-candidate
    paths:
      - .github/workflows/alpha5-a7-frozen-release-artifact-assault.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha5-a7-frozen-release-artifact
  cancel-in-progress: false

env:
  FROZEN_SHA: 5067200452c174da6bc8d9d7ecf6957ee379f0a2
  ALPHA4_SOURCE: 48e0b9a0707553349e75e97a9dfa096d13f9ab5d
  DRY_RUN: '36901991871'
  DRY_RUN_HEAD: 10a27bea65044bcca575454010c18f62540fa15b
  DRY_RUN_ARTIFACT: '11182231176'
  DRY_RUN_ARTIFACT_DIGEST: sha256:476d8aaa86d47934b042c947b71b3aaca35ce52498783f9ff2d6c41f9dc2c798
  RETAINED_FAILED_A7_RUN: '36901600086'
  NEXT_VERSION: 0.1.0-alpha.5
  NEXT_TAG: v0.1.0-alpha.5
  TARGET_TRIPLE: x86_64-unknown-linux-gnu
  ASSET_NAME: execsurface-v0.1.0-alpha.5-x86_64-unknown-linux-gnu.tar.gz
  RUST_TOOLCHAIN: 1.90.0
  SOURCE_DATE_EPOCH: '1790875860'

jobs:
  artifact-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact repaired artifact, retained failure, and public anchors
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
          ! git show-ref --verify --quiet refs/tags/v0.1.0-alpha.5
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RETAINED_FAILED_A7_RUN" > retained-failure.json
          jq -e '.status == "completed" and .conclusion == "failure"' retained-failure.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DRY_RUN" > run.json
          jq -e --arg sha "$DRY_RUN_HEAD" '.status == "completed" and .conclusion == "success" and .head_sha == $sha' run.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$DRY_RUN_ARTIFACT" > artifact.json
          jq -e --arg d "$DRY_RUN_ARTIFACT_DIGEST" '.expired == false and .digest == $d' artifact.json >/dev/null
      - name: Download exact preserved artifact and verify transport digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$DRY_RUN_ARTIFACT/zip" \
            -o dry-run-artifact.zip
          test "sha256:$(sha256sum dry-run-artifact.zip | awk '{print $1}')" = "$DRY_RUN_ARTIFACT_DIGEST"
          unzip -q dry-run-artifact.zip -d preserved
      - name: Verify checksum, provenance, build contract, and archive safety
        shell: bash
        run: |
          set -euo pipefail
          asset="$(find preserved -type f -name "$ASSET_NAME" -print -quit)"
          test -n "$asset"
          sidecar="${asset}.sha256"
          test -s "$sidecar"
          (cd "$(dirname "$asset")" && sha256sum -c "$(basename "$sidecar")")
          prov="$(find preserved -type f -name alpha5-provenance-v2.json -print -quit)"
          test -s "$prov"
          ASSET="$asset" PROV="$prov" python3 - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path,PurePosixPath
          asset=Path(os.environ['ASSET']); p=json.loads(Path(os.environ['PROV']).read_text())
          assert p['_type']=='https://in-toto.io/Statement/v1'
          assert p['predicateType']=='https://slsa.dev/provenance/v1'
          assert len(p['subject'])==1
          s=p['subject'][0]
          assert s['name']==os.environ['ASSET_NAME']
          assert hashlib.sha256(asset.read_bytes()).hexdigest()==s['digest']['sha256']
          bd=p['predicate']['buildDefinition']
          assert bd['internalParameters']['frozenSourceCommit']==os.environ['FROZEN_SHA']
          assert bd['internalParameters']['sourceDateEpoch']==os.environ['SOURCE_DATE_EPOCH']
          assert bd['internalParameters']['deterministicPathRemap'] is True
          assert bd['externalParameters']['prospectiveVersion']==os.environ['NEXT_VERSION']
          assert bd['externalParameters']['prospectiveTag']==os.environ['NEXT_TAG']
          assert bd['externalParameters']['target']==os.environ['TARGET_TRIPLE']
          assert bd['externalParameters']['builderBaseline']=='ubuntu-22.04'
          assert p['predicate']['runDetails']['metadata']['dryRun'] is True
          root=f"execsurface-{os.environ['NEXT_TAG']}-{os.environ['TARGET_TRIPLE']}"
          required={f'{root}/execsurface',f'{root}/LICENSE',f'{root}/NOTICE',f'{root}/BUILD_INFO.txt'}
          seen=set()
          with tarfile.open(asset,'r:gz') as tf:
              for m in tf.getmembers():
                  pp=PurePosixPath(m.name)
                  assert not pp.is_absolute() and '..' not in pp.parts
                  assert m.name not in seen
                  seen.add(m.name)
                  assert m.name in ({root}|required), m.name
                  assert not (m.issym() or m.islnk() or m.isdev())
          assert required <= seen
          PY
      - name: Verify embedded build identity
        shell: bash
        run: |
          set -euo pipefail
          asset="$(find preserved -type f -name "$ASSET_NAME" -print -quit)"
          mkdir extracted
          tar -xzf "$asset" -C extracted
          root="extracted/execsurface-${NEXT_TAG}-${TARGET_TRIPLE}"
          test -x "$root/execsurface"
          grep -Fx "product_version=$NEXT_VERSION" "$root/BUILD_INFO.txt"
          grep -Fx "target=$TARGET_TRIPLE" "$root/BUILD_INFO.txt"
          grep -Fx "frozen_source_commit=$FROZEN_SHA" "$root/BUILD_INFO.txt"
          grep -Fx 'builder_baseline=ubuntu-22.04' "$root/BUILD_INFO.txt"
          grep -Fx 'rust_toolchain=1.90.0' "$root/BUILD_INFO.txt"
          grep -Fx 'deterministic_path_remap=true' "$root/BUILD_INFO.txt"
          grep -Fx 'publication=dry-run-only' "$root/BUILD_INFO.txt"
          grep -Fx 'p8_external_validation_closed=false' "$root/BUILD_INFO.txt"
          test "$("$root/execsurface" --version)" = "execsurface $NEXT_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: alpha5-a7-binding-${{ github.run_id }}
          path: |
            run.json
            artifact.json
            retained-failure.json
          if-no-files-found: error
          retention-days: 90

  blackbox-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Download and extract release artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$DRY_RUN_ARTIFACT/zip" \
            -o artifact.zip
          test "sha256:$(sha256sum artifact.zip | awk '{print $1}')" = "$DRY_RUN_ARTIFACT_DIGEST"
          unzip -q artifact.zip -d preserved
          asset="$(find preserved -type f -name "$ASSET_NAME" -print -quit)"
          (cd "$(dirname "$asset")" && sha256sum -c "$(basename "$asset").sha256")
          mkdir extracted
          tar -xzf "$asset" -C extracted
          cp "extracted/execsurface-${NEXT_TAG}-${TARGET_TRIPLE}/execsurface" ./execsurface
          chmod 0755 ./execsurface
      - name: Pure black-box CLI and verdict contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(./execsurface --version)" = "execsurface $NEXT_VERSION"
          ./execsurface doctor > doctor.out 2>&1
          ./execsurface --help > help.out 2>&1
          grep -q 'ExecSurface' help.out
          mkdir case
          ./execsurface learn --output case/base.json -- /bin/bash -lc true
          ./execsurface check --baseline case/base.json -- /bin/bash -lc true > case/pass.out 2>&1
          set +e
          ./execsurface check --baseline case/base.json -- /bin/bash -lc 'true; /bin/echo alpha5-a7-drift >/dev/null' > case/review.out 2>&1
          review_rc=$?
          ./execsurface check --baseline case/missing.json -- /bin/bash -lc true > case/error.out 2>&1
          error_rc=$?
          set -e
          test "$review_rc" -eq 10
          test "$error_rc" -eq 2
      - name: Black-box privacy sentinel
        shell: bash
        run: |
          set -euo pipefail
          secret='AX_ALPHA5_A7_SECRET_1f7d'
          ./execsurface learn --output case/privacy.json -- /bin/bash -lc "printf '%s' '$secret' >/dev/null" > case/privacy-learn.out 2>&1
          ./execsurface check --baseline case/privacy.json -- /bin/bash -lc "printf '%s' '$secret' >/dev/null" > case/privacy-check.out 2>&1
          ! grep -R -F "$secret" case
      - uses: actions/upload-artifact@v4
        with:
          name: alpha5-a7-blackbox-${{ matrix.os }}-${{ github.run_id }}
          path: |
            doctor.out
            help.out
            case/
          if-no-files-found: error
          retention-days: 90

  source-equivalence:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FROZEN_SHA }}
          path: frozen
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Recreate exact staging transform and deterministic build independently
        shell: bash
        env:
          CARGO_INCREMENTAL: '0'
          TZ: UTC
          LC_ALL: C
        run: |
          set -euo pipefail
          cp -a frozen control
          printf '%s\n' "$NEXT_TAG" > control/action/release-tag.txt
          python3 - <<'PY'
          from pathlib import Path
          old='0.1.0-alpha.4'; new='0.1.0-alpha.5'; root=Path('control')
          for m in root.rglob('Cargo.toml'):
              t=m.read_text().replace(f'version = "{old}"',f'version = "{new}"').replace(f'version = "={old}"',f'version = "={new}"')
              m.write_text(t)
          lock=root/'Cargo.lock'; chunks=lock.read_text().split('[[package]]'); out=[chunks[0]]
          for c in chunks[1:]:
              ls=c.splitlines(); name=next((x.split('=',1)[1].strip().strip('"') for x in ls if x.startswith('name = ')),None)
              if name and name.startswith('execsurface'):
                  ls=[f'version = "{new}"' if x==f'version = "{old}"' else x for x in ls]
              out.append('\n'.join(ls))
          lock.write_text('[[package]]'.join(out))
          PY
          common='-C debuginfo=0 -C link-arg=-Wl,--build-id=none'
          RUSTFLAGS="$common --remap-path-prefix=$(pwd)/control=/src --remap-path-prefix=$HOME/.cargo=/cargo" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/control-target" \
            cargo +$RUST_TOOLCHAIN build --manifest-path control/Cargo.toml --locked --release -p execsurface --bin execsurface
          cp "$RUNNER_TEMP/control-target/release/execsurface" control-binary
          test "$(./control-binary --version)" = "execsurface $NEXT_VERSION"
      - name: Download exact preserved release binary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$DRY_RUN_ARTIFACT/zip" \
            -o artifact.zip
          test "sha256:$(sha256sum artifact.zip | awk '{print $1}')" = "$DRY_RUN_ARTIFACT_DIGEST"
          unzip -q artifact.zip -d preserved
          asset="$(find preserved -type f -name "$ASSET_NAME" -print -quit)"
          mkdir extracted
          tar -xzf "$asset" -C extracted
          cp "extracted/execsurface-${NEXT_TAG}-${TARGET_TRIPLE}/execsurface" artifact-binary
          chmod 0755 artifact-binary
      - name: Require byte-for-byte frozen-source equivalence and glibc ceiling
        shell: bash
        run: |
          set -euo pipefail
          sha256sum artifact-binary control-binary | tee binary-digests.txt
          cmp -s artifact-binary control-binary
          strings artifact-binary | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu | tee glibc-required.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          vals=[]
          for x in Path('glibc-required.txt').read_text().splitlines():
              m=re.fullmatch(r'GLIBC_([0-9]+(?:\.[0-9]+)+)',x.strip())
              if m: vals.append(tuple(map(int,m.group(1).split('.'))))
          assert vals and max(vals) <= (2,35), vals
          PY
      - name: Require bidirectional baseline and verdict equivalence
        shell: bash
        run: |
          set -euo pipefail
          ./artifact-binary --help > artifact-help.txt
          ./control-binary --help > control-help.txt
          diff -u artifact-help.txt control-help.txt
          ./artifact-binary doctor > artifact-doctor.txt 2>&1
          ./control-binary doctor > control-doctor.txt 2>&1
          diff -u artifact-doctor.txt control-doctor.txt
          mkdir equiv
          ./artifact-binary learn --output equiv/from-artifact.json -- /bin/bash -lc true
          ./control-binary check --baseline equiv/from-artifact.json -- /bin/bash -lc true > equiv/control-on-artifact.out 2>&1
          ./control-binary learn --output equiv/from-control.json -- /bin/bash -lc true
          ./artifact-binary check --baseline equiv/from-control.json -- /bin/bash -lc true > equiv/artifact-on-control.out 2>&1
          set +e
          ./artifact-binary check --baseline equiv/from-control.json -- /bin/bash -lc 'true; /bin/echo equivalence-drift >/dev/null' > equiv/artifact-review.out 2>&1
          a=$?
          ./control-binary check --baseline equiv/from-artifact.json -- /bin/bash -lc 'true; /bin/echo equivalence-drift >/dev/null' > equiv/control-review.out 2>&1
          b=$?
          set -e
          test "$a" -eq 10
          test "$b" -eq 10
      - uses: actions/upload-artifact@v4
        with:
          name: alpha5-a7-source-equivalence-${{ github.run_id }}
          path: |
            binary-digests.txt
            glibc-required.txt
            artifact-help.txt
            control-help.txt
            artifact-doctor.txt
            control-doctor.txt
            equiv/
          if-no-files-found: error
          retention-days: 90

  tamper-and-substitution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download exact artifact under attack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$DRY_RUN_ARTIFACT/zip" \
            -o artifact.zip
          test "sha256:$(sha256sum artifact.zip | awk '{print $1}')" = "$DRY_RUN_ARTIFACT_DIGEST"
          unzip -q artifact.zip -d preserved
          asset="$(find preserved -type f -name "$ASSET_NAME" -print -quit)"
          cp "$asset" original.tar.gz
          cp "${asset}.sha256" original.tar.gz.sha256
          cp "$(find preserved -type f -name alpha5-provenance-v2.json -print -quit)" provenance.json
      - name: Reject archive mutation, truncation, and binary tamper
        shell: bash
        run: |
          set -euo pipefail
          cp original.tar.gz mutated.tar.gz
          printf 'X' >> mutated.tar.gz
          test "$(sha256sum mutated.tar.gz | awk '{print $1}')" != "$(sha256sum original.tar.gz | awk '{print $1}')"
          head -c $(( $(stat -c%s original.tar.gz) / 2 )) original.tar.gz > truncated.tar.gz
          if tar -tzf truncated.tar.gz >/dev/null 2>&1; then
            echo 'truncated archive unexpectedly parsed cleanly' >&2
            exit 1
          fi
          mkdir extracted
          tar -xzf original.tar.gz -C extracted
          bin="extracted/execsurface-${NEXT_TAG}-${TARGET_TRIPLE}/execsurface"
          cp "$bin" tampered-binary
          printf 'X' >> tampered-binary
          test "$(sha256sum "$bin" | awk '{print $1}')" != "$(sha256sum tampered-binary | awk '{print $1}')"
      - name: Reject provenance subject substitution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path('provenance.json').read_text()); good=Path('original.tar.gz'); bad=Path('mutated.tar.gz')
          assert p['subject'][0]['name']=='execsurface-v0.1.0-alpha.5-x86_64-unknown-linux-gnu.tar.gz'
          assert p['subject'][0]['digest']['sha256']==hashlib.sha256(good.read_bytes()).hexdigest()
          assert p['subject'][0]['digest']['sha256']!=hashlib.sha256(bad.read_bytes()).hexdigest()
          q=json.loads(Path('provenance.json').read_text()); q['subject'][0]['name']='execsurface-v0.1.0-alpha.4-x86_64-unknown-linux-gnu.tar.gz'
          assert q['subject'][0]['name']!='execsurface-v0.1.0-alpha.5-x86_64-unknown-linux-gnu.tar.gz'
          PY
      - name: Reject unsafe archive member classes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,tarfile
          from pathlib import PurePosixPath
          def safe(tf):
              seen=set()
              for m in tf.getmembers():
                  p=PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or m.name in seen or m.issym() or m.islnk() or m.isdev(): return False
                  seen.add(m.name)
              return True
          with tarfile.open('path-traversal.tar','w') as tf:
              i=tarfile.TarInfo('../escape'); d=b'x'; i.size=len(d); tf.addfile(i,io.BytesIO(d))
          with tarfile.open('symlink.tar','w') as tf:
              i=tarfile.TarInfo('root/link'); i.type=tarfile.SYMTYPE; i.linkname='/tmp/target'; tf.addfile(i)
          with tarfile.open('path-traversal.tar') as tf: assert not safe(tf)
          with tarfile.open('symlink.tar') as tf: assert not safe(tf)
          PY

  closeout:
    needs: [artifact-binding, blackbox-runtime, source-equivalence, tamper-and-substitution]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record bounded repaired artifact-destructive decision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
          ! git show-ref --verify --quiet refs/tags/v0.1.0-alpha.5
          mkdir -p evidence
          {
            echo 'decision_candidate=ALPHA5_A7_RELEASE_ARTIFACT_DESTRUCTIVE_EQUIVALENCE_PASS'
            echo "frozen_sha=${FROZEN_SHA}"
            echo "repaired_dry_run=${DRY_RUN}"
            echo "repaired_artifact=${DRY_RUN_ARTIFACT}"
            echo "repaired_artifact_digest=${DRY_RUN_ARTIFACT_DIGEST}"
            echo "retained_failed_a7_run=${RETAINED_FAILED_A7_RUN}"
            echo 'artifact_transport_digest_verified=true'
            echo 'archive_checksum_verified=true'
            echo 'provenance_subject_verified=true'
            echo 'archive_path_safety_verified=true'
            echo 'ubuntu_22_04_blackbox=true'
            echo 'ubuntu_24_04_blackbox=true'
            echo 'glibc_ceiling_2_35=true'
            echo 'byte_for_byte_frozen_source_equivalence=true'
            echo 'bidirectional_baseline_compatibility=true'
            echo 'tamper_and_substitution_rejected=true'
            echo 'material_internal_gap_found=false'
            echo 'release_authorized=false'
            echo 'p8_external_validation_closed=false'
          } | tee evidence/alpha5-a7-release-artifact-destructive.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alpha5-a7-release-artifact-destructive-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/alpha5-a7-release-artifact-destructive.txt
          if-no-files-found: error
          retention-days: 90
