name: M9 ptrace ESRCH lifecycle fix gate

on:
  push:
    branches:
      - hardening/m9-ptrace-esrch-just
    paths:
      - scripts/m9_apply_ptrace_esrch_fix.py
      - scripts/m9_apply_ptrace_exit_lifecycle.py
      - scripts/m9_instrument_ptrace_esrch.py
      - scripts/m9_instrument_untracked_exit.py
      - scripts/m9_instrument_pre_registration_stop.py
      - .github/workflows/m9-ptrace-esrch-fix-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JUST_SHA: 5d5742cbcc50f19c99c356bc7e085acaa5f4665d
      RUST_TOOLCHAIN: 1.90.0
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout pinned unmodified casey/just
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: casey/just
          ref: ${{ env.JUST_SHA }}
          path: external/just
          fetch-depth: 1
          persist-credentials: false

      - name: Install frozen Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/just rev-parse HEAD)" = "$JUST_SHA"
          test -z "$(git -C external/just status --porcelain)"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt --toolchain "$RUST_TOOLCHAIN"
          rustc "+$RUST_TOOLCHAIN" --version --verbose

      - name: Apply diagnostic lifecycle candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/m9_apply_ptrace_esrch_fix.py
          python3 scripts/m9_apply_ptrace_exit_lifecycle.py
          python3 scripts/m9_instrument_ptrace_esrch.py
          python3 scripts/m9_instrument_untracked_exit.py
          python3 scripts/m9_instrument_pre_registration_stop.py
          cargo "+$RUST_TOOLCHAIN" fmt --all
          git diff --check
          git diff -- crates/execsurface-observe/src/linux_ptrace.rs | tee /tmp/m9-esrch-fix.diff
          test -s /tmp/m9-esrch-fix.diff

      - name: Run observer regression suite unchanged
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" test -p execsurface-observe

      - name: Build current-source ExecSurface
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" build -p execsurface

      - name: Prime external workload directly
        shell: bash
        run: |
          set -euo pipefail
          cd external/just
          cargo "+$RUST_TOOLCHAIN" test --all >/dev/null 2>&1

      - name: Prove pinned just observation three times
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p m9-fix-evidence
          cp /tmp/m9-esrch-fix.diff m9-fix-evidence/candidate.diff
          : > m9-fix-evidence/diagnostic-summary.txt
          printf 'run_id=%s\nhead_sha=%s\njust_sha=%s\nrust_toolchain=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$JUST_SHA" "$RUST_TOOLCHAIN" \
            >> m9-fix-evidence/diagnostic-summary.txt

          failed=0
          for attempt in 1 2 3; do
            set +e
            target/debug/execsurface observe -- \
              /bin/bash -lc \
              "cd external/just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1" \
              > "m9-fix-evidence/observe-${attempt}.json" \
              2> "m9-fix-evidence/observe-${attempt}.stderr"
            rc=$?
            set -e
            printf '%s\n' "$rc" > "m9-fix-evidence/observe-${attempt}.rc"
            printf '\nattempt=%s rc=%s\n' "$attempt" "$rc" \
              >> m9-fix-evidence/diagnostic-summary.txt
            grep -E 'M9_|PTRACE_|ESRCH|ECHILD|ExecSurface: ERROR|observer OS error|Protocol' \
              "m9-fix-evidence/observe-${attempt}.stderr" \
              >> m9-fix-evidence/diagnostic-summary.txt || true
            if [ "$rc" -ne 0 ]; then
              failed=1
              break
            fi
          done

          sha256sum m9-fix-evidence/* > m9-fix-evidence/SHA256SUMS

          if [ "$failed" -ne 0 ]; then
            cat m9-fix-evidence/diagnostic-summary.txt
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('m9-fix-evidence').glob('observe-*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data.get('complete') is True, (path, data.get('warnings'))
              outcome = data.get('outcome', {})
              assert outcome.get('exit_code') == 0, (path, outcome)
              assert outcome.get('signal') is None, (path, outcome)
          print('M9_PTRACE_ESRCH_EXTERNAL_REGRESSION_PASS')
          PY

      - name: Preserve candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m9-ptrace-esrch-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: m9-fix-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Commit fail-closed diagnostic evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -s m9-fix-evidence/diagnostic-summary.txt
          evidence_dir="docs/milestones/evidence/m9-ptrace-esrch/run-${GITHUB_RUN_ID}"
          mkdir -p "$evidence_dir"
          cp m9-fix-evidence/diagnostic-summary.txt "$evidence_dir/diagnostic-summary.txt"
          cp m9-fix-evidence/SHA256SUMS "$evidence_dir/SHA256SUMS"
          git add "$evidence_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M9 hardening: preserve ESRCH diagnostic run ${GITHUB_RUN_ID}"
          git push origin HEAD:hardening/m9-ptrace-esrch-just

      - name: Commit only proved product fix
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Diagnostic operation instrumentation is active; product commit intentionally disabled."
