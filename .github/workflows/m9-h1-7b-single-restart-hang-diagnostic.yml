name: M9-H1.7B single-restart hang diagnostic

on:
  push:
    branches:
      - hardening/m9-ptrace-esrch-just
    paths:
      - scripts/m9_h1_7b_instrument_exit_group_progress.py
      - .github/workflows/m9-h1-7b-single-restart-hang-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-single-restart-hang:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUST_TOOLCHAIN: 1.90.0
      SOURCE: crates/execsurface-observe/src/linux_ptrace.rs
      PRODUCTION_BASE_SHA256: 3dc656358a3675a0d78135bb83046bc45c33dca2718c8bd8b68fa090e18eac8b
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install frozen Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt --toolchain "$RUST_TOOLCHAIN"

      - name: Reconstruct candidate plus selective lifecycle trace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m9-h1-7b-evidence
          python3 scripts/m9_apply_ptrace_esrch_fix.py
          python3 scripts/m9_apply_ptrace_exit_lifecycle.py
          python3 scripts/m9_apply_ptrace_preregistration_ordering.py
          python3 scripts/m9_apply_get_syscall_info_exit_group_fix.py
          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 "$SOURCE"
          python3 scripts/m9_finalize_ptrace_lifecycle_core.py
          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 "$SOURCE"
          base="$(sha256sum "$SOURCE" | awk '{print $1}')"
          test "$base" = "$PRODUCTION_BASE_SHA256"
          python3 scripts/m9_h1_7_apply_single_restart_after_syscall_info_esrch.py
          python3 scripts/m9_h1_7b_instrument_exit_group_progress.py
          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 "$SOURCE"
          git diff --check
          printf 'base_sha256=%s\ndiagnostic_candidate_sha256=%s\n' \
            "$base" "$(sha256sum "$SOURCE" | awk '{print $1}')" \
            > m9-h1-7b-evidence/source-hash.txt
          cp "$SOURCE" m9-h1-7b-evidence/linux_ptrace.diagnostic.rs
          cargo "+$RUST_TOOLCHAIN" test -p execsurface-observe \
            2>&1 | tee m9-h1-7b-evidence/observer-tests.log
          cargo "+$RUST_TOOLCHAIN" build -p execsurface \
            2>&1 | tee m9-h1-7b-evidence/build.log
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/fixtures/m9/exit_group_sched_getaffinity_race.c \
            -o /tmp/m9-h1-7b-exit-group-race

      - name: Capture first remaining hang with selective lifecycle trace
        shell: bash
        run: |
          set -euo pipefail
          : > m9-h1-7b-evidence/summary.txt
          hung=0
          for attempt in $(seq 1 120); do
            out="m9-h1-7b-evidence/attempt-${attempt}.json"
            err="m9-h1-7b-evidence/attempt-${attempt}.stderr"
            setsid target/debug/execsurface observe -- /tmp/m9-h1-7b-exit-group-race \
              >"$out" 2>"$err" &
            tracer=$!
            finished=0
            for tick in $(seq 1 100); do
              if ! kill -0 "$tracer" 2>/dev/null; then
                finished=1
                break
              fi
              sleep 0.1
            done
            if [ "$finished" -eq 0 ] && kill -0 "$tracer" 2>/dev/null; then
              hung=1
              snapshot="m9-h1-7b-evidence/hang-${attempt}-snapshot.txt"
              {
                printf 'HANG attempt=%s tracer_pid=%s\n' "$attempt" "$tracer"
                printf '\n=== selective lifecycle trace ===\n'
                cat "$err" || true
                printf '\n=== session task table ===\n'
                ps -eLo pid,ppid,sid,lwp,tgid,nlwp,stat,wchan:32,comm,args \
                  | awk -v sid="$tracer" 'NR==1 || $3==sid'
                printf '\n=== traced task states ===\n'
                for status in /proc/[0-9]*/task/[0-9]*/status; do
                  [ -r "$status" ] || continue
                  tp="$(awk '/^TracerPid:/{print $2}' "$status" 2>/dev/null || true)"
                  [ "$tp" = "$tracer" ] || continue
                  taskdir="${status%/status}"
                  echo "--- $status ---"
                  grep -E '^(Name|State|Tgid|Pid|PPid|TracerPid|Threads):' "$status" || true
                  printf 'wchan='; cat "$taskdir/wchan" 2>/dev/null || true; echo
                  printf 'syscall='; cat "$taskdir/syscall" 2>/dev/null || true; echo
                done
              } > "$snapshot"
              printf 'attempt=%s HANG tracer_pid=%s\n' "$attempt" "$tracer" \
                | tee -a m9-h1-7b-evidence/summary.txt
              kill -TERM -- "-$tracer" 2>/dev/null || true
              sleep 1
              kill -KILL -- "-$tracer" 2>/dev/null || true
              wait "$tracer" 2>/dev/null || true
              cat "$snapshot"
              break
            fi
            set +e
            wait "$tracer"
            rc=$?
            set -e
            printf 'attempt=%s rc=%s\n' "$attempt" "$rc" \
              >> m9-h1-7b-evidence/summary.txt
            test "$rc" -eq 0
            python3 - "$out" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          assert data.get("complete") is True, data.get("warnings")
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, outcome
          assert outcome.get("signal") is None, outcome
          PY
          done
          test "$hung" -eq 1

      - name: Seal evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'head_sha=%s\n' "$GITHUB_SHA"
            printf 'rust_toolchain=%s\n' "$RUST_TOOLCHAIN"
            printf 'kernel=%s\n' "$(uname -srmo)"
          } > m9-h1-7b-evidence/environment.txt
          find m9-h1-7b-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > m9-h1-7b-evidence/SHA256SUMS

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m9-h1-7b-single-restart-hang-${{ github.run_id }}-${{ github.run_attempt }}
          path: m9-h1-7b-evidence
          if-no-files-found: error
          retention-days: 30
