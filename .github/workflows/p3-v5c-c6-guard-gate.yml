name: P3 V5-C C6 certificate-aware guard gate

on:
  push:
    branches:
      - development/post-alpha4-behavioral-integrity
    paths:
      - scripts/p3_v5c_c6_apply.py
      - .github/workflows/p3-v5c-c6-guard-gate.yml

permissions:
  contents: write

jobs:
  integrate-and-falsify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout isolated development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: development/post-alpha4-behavioral-integrity
          fetch-depth: 0

      - name: Verify prerequisite evidence and protocol
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/development/P3_V5C_C2_C4_RESULT.md
          test -f docs/development/P3_V5C_C6_GUARD_INTEGRATION_PROTOCOL.md
          grep -q 'V5C_CERTIFICATION_PATH_ESTABLISHED_BOUNDED' docs/development/P3_V5C_C2_C4_RESULT.md
          git log -1 --oneline

      - name: Apply certificate-aware guard integration
        run: python3 scripts/p3_v5c_c6_apply.py

      - name: Rustfmt
        run: cargo fmt --all

      - name: Format gate
        run: cargo fmt --all -- --check

      - name: Clippy gate
        run: cargo clippy --locked -p execsurface-observe --all-targets -- -D warnings

      - name: Negative legacy-guard falsifier
        run: cargo test --locked -p execsurface-observe --lib c6_uncertified_clone_still_uses_legacy_guard -- --nocapture

      - name: Clone event-routing falsifiers
        run: |
          cargo test --locked -p execsurface-observe --lib c3_clone_sigchld_fork_event_keeps_clone_fd_authority -- --ignored --nocapture
          cargo test --locked -p execsurface-observe --lib c3_clone_vfork_event_keeps_clone_fd_authority -- --ignored --nocapture
          cargo test --locked -p execsurface-observe --lib c1_real_ptrace_clone_modes_are_certified -- --ignored --nocapture

      - name: Full observe regression suite
        run: cargo test --locked -p execsurface-observe --all-targets

      - name: Full workspace regression suite
        run: cargo test --locked --workspace

      - name: Public-v2 and diff integrity gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff -- crates/execsurface-model/src/lib.rs | wc -l)" -eq 0
          grep -q 'apply_shared_fd_ambiguity_guard(ptrace.observation)' crates/execsurface-observe/src/lib.rs
          grep -q 'ptrace.clone_fd_certification.fully_certified()' crates/execsurface-observe/src/lib.rs
          git status --short

      - name: Commit only after all C6 gates pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AETHER X C6 Gate"
          git config user.email "aether.x.eg@gmail.com"
          git add crates/execsurface-observe/src/lib.rs
          git rm scripts/p3_v5c_c6_apply.py .github/workflows/p3-v5c-c6-guard-gate.yml
          git commit -m "P3 V5-C C6: gate shared-fd ambiguity with internal certificate"
          git push origin HEAD:development/post-alpha4-behavioral-integrity
