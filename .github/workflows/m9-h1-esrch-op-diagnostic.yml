name: M9-H1.2 residual ESRCH operation diagnostic

on:
  push:
    branches:
      - hardening/m9-ptrace-esrch-just
    paths:
      - .github/workflows/m9-h1-esrch-op-diagnostic.yml
      - scripts/m9_apply_ptrace_esrch_fix.py
      - scripts/m9_apply_ptrace_exit_lifecycle.py
      - scripts/m9_apply_ptrace_preregistration_ordering.py
      - scripts/m9_instrument_ptrace_esrch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  label-residual-esrch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_TOOLCHAIN: 1.90.0
      JUST_SHA: 5d5742cbcc50f19c99c356bc7e085acaa5f4665d
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout pinned unmodified casey/just
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: casey/just
          ref: ${{ env.JUST_SHA }}
          path: external/just
          fetch-depth: 1
          persist-credentials: false

      - name: Install frozen Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt --toolchain "$RUST_TOOLCHAIN"
          rustc "+$RUST_TOOLCHAIN" --version --verbose
          test "$(git -C external/just rev-parse HEAD)" = "$JUST_SHA"
          test -z "$(git -C external/just status --porcelain)"

      - name: Apply candidate plus exact ESRCH labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m9-h1-2-evidence
          python3 scripts/m9_apply_ptrace_esrch_fix.py
          python3 scripts/m9_apply_ptrace_exit_lifecycle.py
          python3 scripts/m9_apply_ptrace_preregistration_ordering.py
          python3 scripts/m9_instrument_ptrace_esrch.py
          cargo "+$RUST_TOOLCHAIN" fmt --all
          git diff --check
          git diff -- crates/execsurface-observe/src/linux_ptrace.rs > m9-h1-2-evidence/candidate.diff
          test -s m9-h1-2-evidence/candidate.diff

      - name: Run observer regression suite unchanged
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" test -p execsurface-observe 2>&1 | tee m9-h1-2-evidence/observer-tests.log

      - name: Build candidate ExecSurface
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" build -p execsurface 2>&1 | tee m9-h1-2-evidence/build.log

      - name: Prime pinned workload directly
        shell: bash
        run: |
          set -euo pipefail
          (cd external/just && cargo "+$RUST_TOOLCHAIN" test --all >/dev/null 2>&1)

      - name: Capture residual ESRCH operation
        shell: bash
        run: |
          set -uo pipefail
          : > m9-h1-2-evidence/summary.txt
          failed=0
          for attempt in 1 2 3; do
            set +e
            target/debug/execsurface observe -- \
              /bin/bash -lc \
              "cd external/just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1" \
              > "m9-h1-2-evidence/just-${attempt}.json" \
              2> "m9-h1-2-evidence/just-${attempt}.stderr"
            rc=$?
            set -e
            printf '%s\n' "$rc" > "m9-h1-2-evidence/just-${attempt}.rc"
            reconciled=$(grep -c 'M9_PREREGISTRATION_STOP_RECONCILED' "m9-h1-2-evidence/just-${attempt}.stderr" || true)
            printf 'attempt=%s rc=%s prereg_reconciled=%s\n' "$attempt" "$rc" "$reconciled" >> m9-h1-2-evidence/summary.txt
            if [ "$rc" -ne 0 ]; then
              grep -E 'M9_|PTRACE_|ESRCH|ECHILD|ExecSurface: ERROR|observer protocol error|observer OS error' \
                "m9-h1-2-evidence/just-${attempt}.stderr" | tail -200 \
                | tee -a m9-h1-2-evidence/summary.txt || true
              failed=1
              break
            fi
            python3 - "$attempt" <<'PY'
          import json
          import sys
          from pathlib import Path
          attempt = sys.argv[1]
          path = Path(f"m9-h1-2-evidence/just-{attempt}.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("complete") is True, (path, data.get("warnings"))
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, (path, outcome)
          assert outcome.get("signal") is None, (path, outcome)
          PY
          done
          if [ "$failed" -ne 0 ]; then
            cat m9-h1-2-evidence/summary.txt
            exit 1
          fi
          echo 'M9_H1_2_NO_RESIDUAL_ESRCH_IN_THREE_ATTEMPTS' | tee -a m9-h1-2-evidence/summary.txt

      - name: Seal evidence manifest
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'head_sha=%s\n' "$GITHUB_SHA"
            printf 'just_sha=%s\n' "$JUST_SHA"
            printf 'rust_toolchain=%s\n' "$RUST_TOOLCHAIN"
            printf 'kernel=%s\n' "$(uname -srmo)"
          } > m9-h1-2-evidence/environment.txt
          find m9-h1-2-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > m9-h1-2-evidence/SHA256SUMS

      - name: Upload M9-H1.2 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m9-h1-2-residual-esrch-${{ github.run_id }}-${{ github.run_attempt }}
          path: m9-h1-2-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Preserve diagnostic summary in GitHub
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="docs/milestones/evidence/m9-h1-2/run-${GITHUB_RUN_ID}"
          mkdir -p "$evidence_dir"
          cp m9-h1-2-evidence/environment.txt "$evidence_dir/environment.txt"
          cp m9-h1-2-evidence/SHA256SUMS "$evidence_dir/SHA256SUMS"
          [ ! -f m9-h1-2-evidence/summary.txt ] || cp m9-h1-2-evidence/summary.txt "$evidence_dir/summary.txt"
          git add "$evidence_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "M9-H1.2: preserve residual ESRCH diagnostic run ${GITHUB_RUN_ID}"
            git push origin HEAD:hardening/m9-ptrace-esrch-just
          fi
