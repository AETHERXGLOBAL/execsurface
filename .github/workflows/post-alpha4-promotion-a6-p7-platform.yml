name: Post-alpha4 promotion A6 P7 platform contracts

on:
  push:
    branches: [integration/post-alpha4-promotion-candidate]
    paths:
      - docs/development/POST_ALPHA4_PROMOTION_A6_P7_PLATFORM_PROTOCOL.md
      - docs/development/P7_*.md
      - experiments/p7-platform-ci/**
      - scripts/post_alpha4_a6_p7_falsifier.py
      - .github/workflows/post-alpha4-promotion-a6-p7-platform.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: post-alpha4-a6-p7-platform-${{ github.ref }}
  cancel-in-progress: false

env:
  A5_DECISION_FLOOR: 4d6ea72e31d4734d0d6d68a1554901bb2be08511
  ALPHA4_SOURCE: 48e0b9a0707553349e75e97a9dfa096d13f9ab5d

jobs:
  identity-and-negative-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify ancestry, frozen A6 protocol and immutable public boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git merge-base --is-ancestor "$A5_DECISION_FLOOR" HEAD
          test "$(git rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
          grep -F 'PREREGISTERED — PLATFORM/CI CONTRACT ELIGIBILITY ONLY / ARM64 NEGATIVE RETAINED' docs/development/POST_ALPHA4_PROMOTION_A6_P7_PLATFORM_PROTOCOL.md
          grep -F 'Exactly 12 frozen A6 attacks/invariants' docs/development/POST_ALPHA4_PROMOTION_A6_P7_PLATFORM_PROTOCOL.md
          test "$(grep -c '^    def test_a6_[0-9][0-9]_' scripts/post_alpha4_a6_p7_falsifier.py)" -eq 12
          grep -F 'P7_A0_ARM64_NOT_PORTABLE' docs/development/P7_CLOSEOUT_DECISION.md
          grep -F '36774237512' docs/development/P7_CLOSEOUT_DECISION.md
          if git diff --name-only "$A5_DECISION_FLOOR"..HEAD | grep -qE '^crates/(execsurface-cli|execsurface-diff|execsurface-normalize|execsurface-observe|execsurface-policy)/' ; then
            echo 'A6 must not modify public product crates' >&2
            exit 1
          fi

  frozen-a6-falsifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --force --tags origin
      - name: Execute exact frozen A6 12-test corpus
        run: |
          set -euo pipefail
          python3 scripts/post_alpha4_a6_p7_falsifier.py 2>&1 | tee a6-p7-falsifier.log
          grep -q 'Ran 12 tests' a6-p7-falsifier.log
          grep -q '^OK$' a6-p7-falsifier.log
      - name: Upload A6 falsifier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-alpha4-a6-p7-falsifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: a6-p7-falsifier.log
          if-no-files-found: warn

  p7-contract-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Replay GitLab and self-hosted P7 contract corpora
        working-directory: experiments/p7-platform-ci
        run: |
          set -euo pipefail
          python3 -m unittest -v test_gitlab_context_adapter.py 2>&1 | tee gitlab.log
          python3 -m unittest -v test_self_hosted_evidence_contract.py 2>&1 | tee self-hosted-evidence.log
          python3 -m unittest -v test_self_hosted_package.py 2>&1 | tee self-hosted-package.log
      - name: Upload P7 replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-alpha4-a6-p7-contract-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            experiments/p7-platform-ci/gitlab.log
            experiments/p7-platform-ci/self-hosted-evidence.log
            experiments/p7-platform-ci/self-hosted-package.log
          if-no-files-found: warn

  prior-semantic-reproof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Reprove repaired Semantics v3
        run: |
          set -euo pipefail
          cargo +1.90.0 test --locked -p execsurface-model --test semantics_v3_rework -- --nocapture
          cargo +1.90.0 test --locked -p execsurface-model --test semantics_v3_promotion -- --nocapture

  closeout:
    needs: [identity-and-negative-boundary, frozen-a6-falsifier, p7-contract-replay, prior-semantic-reproof]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record bounded A6 evidence
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git merge-base --is-ancestor "$A5_DECISION_FLOOR" HEAD
          test "$(git rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
          mkdir -p evidence
          {
            echo 'decision=POST_ALPHA4_PROMOTION_A6_P7_PLATFORM_CONTRACTS_ELIGIBLE_BOUNDED_CANDIDATE'
            echo "candidate_sha=${GITHUB_SHA}"
            echo "public_alpha4_sha=${ALPHA4_SOURCE}"
            echo 'arm64_support=false'
            echo 'arm64_negative_retained=true'
            echo 'gitlab_context_authority=false'
            echo 'self_hosted_context_authority=false'
            echo 'baseline_steering_from_ci=false'
            echo 'verdict_override_from_ci=false'
            echo 'public_gitlab_support=false'
            echo 'public_self_hosted_support=false'
            echo 'main_merge_authorized=false'
            echo 'p8_closure=false'
          } | tee evidence/post-alpha4-promotion-a6-p7-platform.txt
      - name: Upload A6 closeout evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-alpha4-promotion-a6-p7-platform-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/post-alpha4-promotion-a6-p7-platform.txt
          if-no-files-found: error
          retention-days: 90
