name: A8 A3 apply exact module export

on:
  push:
    branches: [release/post-alpha4-candidate-assembly]

permissions:
  contents: write

jobs:
  patch-once:
    if: github.event.head_commit.message == 'A8 A3: add exact module-export patch harness'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify source blob and apply exact two-line export
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/execsurface-normalize/src/lib.rs)" = '1f421534914a52cac606f1a2f78b3fb26642b7d7'
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/execsurface-normalize/src/lib.rs')
          text = p.read_text()
          marker = '//! No baseline, diff or policy semantics live in this crate.\n\n'
          addition = '#[cfg(feature = "gcc-ephemeral-v4")]\npub mod gcc_ephemeral_v4;\n\n'
          assert text.count(marker) == 1
          assert addition not in text
          p.write_text(text.replace(marker, marker + addition, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = 'crates/execsurface-normalize/src/lib.rs'
          git diff -- crates/execsurface-normalize/src/lib.rs | tee exact-export.diff
          grep -F '+#[cfg(feature = "gcc-ephemeral-v4")]' exact-export.diff
          grep -F '+pub mod gcc_ephemeral_v4;' exact-export.diff
          test "$(grep -c '^+' exact-export.diff)" -eq 3
      - name: Commit exact export
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AETHER X CI'
          git config user.email 'aether.x.eg@gmail.com'
          git add crates/execsurface-normalize/src/lib.rs
          git commit -m 'A8 A3: expose default-off GCC variance module'
          git push origin HEAD:release/post-alpha4-candidate-assembly
