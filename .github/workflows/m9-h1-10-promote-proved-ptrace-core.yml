# Rerun after rustfmt-only hardening probe cleanup and isolate the pinned fd proof outside the parent Cargo workspace.
name: M9-H1.10 promote proved ptrace lifecycle core

on:
  push:
    branches:
      - hardening/m9-ptrace-esrch-just
    paths:
      - .github/workflows/m9-h1-10-promote-proved-ptrace-core.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m9-h1-10-promote-proved-ptrace-core
  cancel-in-progress: false

jobs:
  prove-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUST_TOOLCHAIN: 1.90.0
      SOURCE: crates/execsurface-observe/src/linux_ptrace.rs
      CLEAN_SHA256: 3dc656358a3675a0d78135bb83046bc45c33dca2718c8bd8b68fa090e18eac8b
      JUST_SHA: 5d5742cbcc50f19c99c356bc7e085acaa5f4665d
      FD_SHA: ce97e473ebaec49697c07daa50a7bc2b32f713d2

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout pinned unmodified casey just
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: casey/just
          ref: ${{ env.JUST_SHA }}
          path: external/just
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned unmodified sharkdp fd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: sharkdp/fd
          ref: ${{ env.FD_SHA }}
          path: external/fd
          fetch-depth: 1
          persist-credentials: false

      - name: Install frozen Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
          test "$(git -C external/just rev-parse HEAD)" = "$JUST_SHA"
          test "$(git -C external/fd rev-parse HEAD)" = "$FD_SHA"
          test -z "$(git -C external/just status --porcelain)"
          test -z "$(git -C external/fd status --porcelain)"
          {
            printf 'gate_head=%s\n' "$GITHUB_SHA"
            printf 'rustc=%s\n' "$(rustc +$RUST_TOOLCHAIN --version)"
            printf 'kernel=%s\n' "$(uname -srmo)"
          } > /tmp/m9-h1-10-environment.txt

      - name: Reconstruct exact production-clean source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m9-h1-10-evidence
          cp /tmp/m9-h1-10-environment.txt m9-h1-10-evidence/environment.txt
          python3 scripts/m9_apply_ptrace_esrch_fix.py
          python3 scripts/m9_apply_ptrace_exit_lifecycle.py
          python3 scripts/m9_apply_ptrace_preregistration_ordering.py
          python3 scripts/m9_apply_get_syscall_info_exit_group_fix.py
          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 "$SOURCE"
          python3 scripts/m9_finalize_ptrace_lifecycle_core.py
          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 "$SOURCE"
          actual="$(sha256sum "$SOURCE" | awk '{print $1}')"
          printf 'expected=%s\nactual=%s\n' "$CLEAN_SHA256" "$actual" \
            | tee m9-h1-10-evidence/source-hash.txt
          test "$actual" = "$CLEAN_SHA256"
          test "$(git diff --name-only)" = "$SOURCE"
          git diff --check -- "$SOURCE"
          if grep -Eq 'M9_(PTRAC|GET_SYSCALL|H1_)|eprintln!' "$SOURCE"; then
            echo 'diagnostic-only telemetry remains in production source' >&2
            exit 1
          fi
          cp "$SOURCE" m9-h1-10-evidence/linux_ptrace.production.rs

      - name: Run unchanged full CI semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" fmt --all -- --check
          cargo "+$RUST_TOOLCHAIN" clippy --locked --workspace --all-targets -- -D warnings \
            2>&1 | tee m9-h1-10-evidence/clippy.log
          cargo "+$RUST_TOOLCHAIN" test --locked --workspace --all-targets \
            2>&1 | tee m9-h1-10-evidence/workspace-tests.log
          test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "$CLEAN_SHA256"

      - name: Build current source and bounded lifecycle fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" build --locked -p execsurface \
            2>&1 | tee m9-h1-10-evidence/build.log
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/fixtures/m9/exit_group_sched_getaffinity_bounded_race.c \
            -o /tmp/m9-h1-10-bounded-race
          sha256sum tests/fixtures/m9/exit_group_sched_getaffinity_bounded_race.c \
            /tmp/m9-h1-10-bounded-race \
            > m9-h1-10-evidence/bounded-fixture-SHA256SUMS

      - name: Re-prove bounded lifecycle race 240 times
        shell: bash
        run: |
          set -euo pipefail
          : > m9-h1-10-evidence/bounded-summary.txt
          for attempt in $(seq 1 240); do
            set +e
            timeout --signal=TERM --kill-after=2s 10s \
              target/debug/execsurface observe -- /tmp/m9-h1-10-bounded-race \
              > "m9-h1-10-evidence/bounded-${attempt}.json" \
              2> "m9-h1-10-evidence/bounded-${attempt}.stderr"
            rc=$?
            set -e
            test "$rc" -eq 0
            python3 - "$attempt" <<'PY'
          import json, sys
          from pathlib import Path
          a = sys.argv[1]
          data = json.loads(Path(f"m9-h1-10-evidence/bounded-{a}.json").read_text())
          assert data.get("complete") is True, data.get("warnings")
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, outcome
          assert outcome.get("signal") is None, outcome
          PY
            test ! -s "m9-h1-10-evidence/bounded-${attempt}.stderr"
            printf 'attempt=%s complete=true exit=0\n' "$attempt" \
              >> m9-h1-10-evidence/bounded-summary.txt
          done
          test "$(wc -l < m9-h1-10-evidence/bounded-summary.txt)" -eq 240

      - name: Re-prove pinned casey just
        shell: bash
        run: |
          set -euo pipefail
          (cd external/just && cargo "+$RUST_TOOLCHAIN" test --all >/dev/null 2>&1)
          : > m9-h1-10-evidence/just-summary.txt
          for attempt in 1 2 3 4 5; do
            set +e
            timeout --signal=TERM --kill-after=5s 120s \
              target/debug/execsurface observe -- /bin/bash -lc \
              "cd external/just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1" \
              > "m9-h1-10-evidence/just-${attempt}.json" \
              2> "m9-h1-10-evidence/just-${attempt}.stderr"
            rc=$?
            set -e
            test "$rc" -eq 0
            python3 - "$attempt" <<'PY'
          import json, sys
          from pathlib import Path
          a = sys.argv[1]
          data = json.loads(Path(f"m9-h1-10-evidence/just-{a}.json").read_text())
          assert data.get("complete") is True, data.get("warnings")
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, outcome
          assert outcome.get("signal") is None, outcome
          PY
            test ! -s "m9-h1-10-evidence/just-${attempt}.stderr"
            printf 'attempt=%s complete=true exit=0\n' "$attempt" \
              >> m9-h1-10-evidence/just-summary.txt
          done
          test "$(wc -l < m9-h1-10-evidence/just-summary.txt)" -eq 5

      - name: Re-prove M7 external fd semantics with current source
        shell: bash
        run: |
          set -euo pipefail
          fd_work="$RUNNER_TEMP/m9-h1-10-fd"
          rm -rf "$fd_work"
          cp -a external/fd "$fd_work"
          test "$(git -C "$fd_work" rev-parse HEAD)" = "$FD_SHA"
          test -z "$(git -C "$fd_work" status --porcelain)"

          (cd "$fd_work" && cargo "+$RUST_TOOLCHAIN" test --locked --all-features >/dev/null)
          (cd "$fd_work" && cargo "+$RUST_TOOLCHAIN" build --locked --release --all-features >/dev/null)
          mkdir -p "$fd_work/m9-h1-10-fixture/sub"
          printf 'alpha\n' > "$fd_work/m9-h1-10-fixture/alpha.txt"
          printf 'beta\n' > "$fd_work/m9-h1-10-fixture/sub/beta.txt"
          test -z "$(git -C "$fd_work" status --porcelain --untracked-files=no)"

          base_cmd="cd '$fd_work' && ./target/release/fd --hidden --type f . m9-h1-10-fixture >/dev/null"
          target/debug/execsurface learn \
            --output m9-h1-10-evidence/fd.lock.json \
            -- /bin/bash -lc "$base_cmd"

          for n in 1 2; do
            target/debug/execsurface check \
              --baseline m9-h1-10-evidence/fd.lock.json \
              --json-output "m9-h1-10-evidence/fd-pass-${n}.json" \
              --markdown-output "m9-h1-10-evidence/fd-pass-${n}.md" \
              -- /bin/bash -lc "$base_cmd"
          done

          python3 - <<'PY'
          import json
          for n in (1, 2):
              data = json.load(open(f"m9-h1-10-evidence/fd-pass-{n}.json"))
              assert data["verdict"] == "pass", data["verdict"]
              assert data["findings"] == [], data["findings"]
          PY

          controlled_cmd="cd '$fd_work' && ./target/release/fd --hidden --type f . m9-h1-10-fixture >/dev/null; /usr/bin/sha256sum m9-h1-10-fixture/alpha.txt >/dev/null"
          set +e
          target/debug/execsurface check \
            --baseline m9-h1-10-evidence/fd.lock.json \
            --json-output m9-h1-10-evidence/fd-controlled.json \
            --markdown-output m9-h1-10-evidence/fd-controlled.md \
            -- /bin/bash -lc "$controlled_cmd"
          status=$?
          set -e
          test "$status" -eq 10
          python3 - <<'PY'
          import json
          data = json.load(open("m9-h1-10-evidence/fd-controlled.json"))
          assert data["verdict"] == "review", data["verdict"]
          hits = []
          for finding in data["findings"]:
              if finding["change"] != "added" or finding["effect_kind"] != "process_exec":
                  continue
              effect = finding.get("evidence", {}).get("effect", {})
              executable = effect.get("executable", {})
              if executable.get("family") == "sha256sum":
                  hits.append(finding)
          assert hits, "controlled sha256sum process expansion was not detected"
          print(f"controlled_added_sha256sum_findings={len(hits)}")
          PY

      - name: Seal promotion evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'head_sha=%s\n' "$GITHUB_SHA"
            printf 'just_sha=%s\n' "$JUST_SHA"
            printf 'fd_sha=%s\n' "$FD_SHA"
            printf 'clean_source_sha256=%s\n' "$(sha256sum "$SOURCE" 2>/dev/null | awk '{print $1}')"
            printf 'rust_toolchain=%s\n' "$RUST_TOOLCHAIN"
            printf 'kernel=%s\n' "$(uname -srmo)"
          } > m9-h1-10-evidence/promotion-environment.txt
          find m9-h1-10-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > m9-h1-10-evidence/SHA256SUMS

      - name: Upload pre-promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m9-h1-10-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: m9-h1-10-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Commit exact proved core only
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "$CLEAN_SHA256"
          test "$(git diff --name-only)" = "$SOURCE"
          git fetch origin hardening/m9-ptrace-esrch-just
          remote_head="$(git rev-parse origin/hardening/m9-ptrace-esrch-just)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE"
          git commit -m "M9 hardening: promote proved ptrace lifecycle core"
          git push origin HEAD:hardening/m9-ptrace-esrch-just
