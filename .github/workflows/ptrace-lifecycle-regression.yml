name: Ptrace Lifecycle Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - crates/execsurface-observe/src/linux_ptrace.rs
      - crates/execsurface-observe/src/lib.rs
      - crates/execsurface-observe/tests/m11_shared_fd_ambiguity.rs
      - tests/fixtures/m9/exit_group_sched_getaffinity_bounded_race.c
      - .github/workflows/ptrace-lifecycle-regression.yml
  push:
    branches:
      - main
    paths:
      - crates/execsurface-observe/src/linux_ptrace.rs
      - crates/execsurface-observe/src/lib.rs
      - crates/execsurface-observe/tests/m11_shared_fd_ambiguity.rs
      - tests/fixtures/m9/exit_group_sched_getaffinity_bounded_race.c
      - .github/workflows/ptrace-lifecycle-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-exit-group-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUST_TOOLCHAIN: 1.90.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Install frozen Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustc "+$RUST_TOOLCHAIN" --version --verbose

      - name: Build ExecSurface and bounded lifecycle fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" build -p execsurface
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/fixtures/m9/exit_group_sched_getaffinity_bounded_race.c \
            -o /tmp/execsurface-ptrace-lifecycle-regression

      - name: Run bounded lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 32); do
            out="/tmp/ptrace-lifecycle-${attempt}.json"
            err="/tmp/ptrace-lifecycle-${attempt}.stderr"
            set +e
            timeout --signal=TERM --kill-after=2s 10s \
              target/debug/execsurface observe -- \
              /tmp/execsurface-ptrace-lifecycle-regression \
              >"$out" 2>"$err"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              cat "$err" || true
              exit "$rc"
            fi
            python3 - "$out" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          warnings = data.get("warnings", [])
          codes = [warning.get("code") for warning in warnings]
          assert data.get("complete") is False, warnings
          assert codes == ["shared_fd_table_ambiguity"], warnings
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, outcome
          assert outcome.get("signal") is None, outcome
          PY
            if grep -Eq 'ExecSurface: ERROR|observer protocol error|observer OS error' "$err"; then
              cat "$err"
              exit 1
            fi
          done

  pinned-m7-fd-source-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_TOOLCHAIN: 1.90.0
      FD_SHA: ce97e473ebaec49697c07daa50a7bc2b32f713d2
    steps:
      - name: Checkout ExecSurface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout pinned sharkdp fd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: sharkdp/fd
          ref: ${{ env.FD_SHA }}
          path: external/fd
          fetch-depth: 1
          persist-credentials: false

      - name: Install frozen Rust toolchain and verify upstream identity
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustc "+$RUST_TOOLCHAIN" --version --verbose
          test "$(git -C external/fd rev-parse HEAD)" = "$FD_SHA"
          test -z "$(git -C external/fd status --porcelain)"

      - name: Build current ExecSurface and isolated pinned fd
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" build -p execsurface
          rm -rf /tmp/m7-fd
          cp -a external/fd /tmp/m7-fd
          (cd /tmp/m7-fd && cargo "+$RUST_TOOLCHAIN" build --locked --release --all-features)
          /tmp/m7-fd/target/release/fd --version
          mkdir -p /tmp/m7-fd/m7-fixture/sub /tmp/execsurface-m7-source
          printf 'alpha\n' > /tmp/m7-fd/m7-fixture/alpha.txt
          printf 'beta\n' > /tmp/m7-fd/m7-fixture/sub/beta.txt

      - name: Prove default parallel fd is explicitly fail-closed
        shell: bash
        run: |
          set -euo pipefail
          target/debug/execsurface observe -- /bin/bash -lc \
            'cd /tmp/m7-fd && ./target/release/fd --hidden --type f . m7-fixture >/dev/null' \
            >/tmp/execsurface-m7-source/fd-parallel.json

          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/execsurface-m7-source/fd-parallel.json"))
          warnings = data.get("warnings", [])
          codes = [warning.get("code") for warning in warnings]
          assert data.get("complete") is False, warnings
          assert codes == ["shared_fd_table_ambiguity"], warnings
          assert data.get("outcome", {}).get("exit_code") == 0, data.get("outcome")
          PY

      - name: Learn and prove repeated single-thread no-drift compatibility
        shell: bash
        run: |
          set -euo pipefail
          target/debug/execsurface learn \
            --output /tmp/execsurface-m7-source/fd.lock.json \
            -- /bin/bash -lc \
            'cd /tmp/m7-fd && ./target/release/fd --threads 1 --hidden --type f . m7-fixture >/dev/null'

          for n in 1 2; do
            target/debug/execsurface check \
              --baseline /tmp/execsurface-m7-source/fd.lock.json \
              --json-output "/tmp/execsurface-m7-source/fd-pass-${n}.json" \
              --markdown-output "/tmp/execsurface-m7-source/fd-pass-${n}.md" \
              -- /bin/bash -lc \
              'cd /tmp/m7-fd && ./target/release/fd --threads 1 --hidden --type f . m7-fixture >/dev/null'
          done

          python3 - <<'PY'
          import json
          for n in (1, 2):
              data = json.load(open(f"/tmp/execsurface-m7-source/fd-pass-{n}.json"))
              assert data["verdict"] == "pass", data["verdict"]
              assert data["findings"] == [], data["findings"]
          PY

      - name: Prove controlled runtime expansion remains visible
        shell: bash
        run: |
          set -euo pipefail
          set +e
          target/debug/execsurface check \
            --baseline /tmp/execsurface-m7-source/fd.lock.json \
            --json-output /tmp/execsurface-m7-source/fd-controlled.json \
            --markdown-output /tmp/execsurface-m7-source/fd-controlled.md \
            -- /bin/bash -lc \
            'cd /tmp/m7-fd && ./target/release/fd --threads 1 --hidden --type f . m7-fixture >/dev/null; /usr/bin/sha256sum m7-fixture/alpha.txt >/dev/null'
          status=$?
          set -e
          test "$status" -eq 10

          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/execsurface-m7-source/fd-controlled.json"))
          assert data["verdict"] == "review", data["verdict"]
          hits = []
          for finding in data["findings"]:
              if finding["change"] != "added" or finding["effect_kind"] != "process_exec":
                  continue
              executable = finding.get("evidence", {}).get("effect", {}).get("executable", {})
              if executable.get("family") == "sha256sum":
                  hits.append(finding)
          assert hits, "controlled sha256sum execution was not surfaced as an added process_exec"
          PY

  pinned-casey-just-source-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_TOOLCHAIN: 1.90.0
      JUST_SHA: 5d5742cbcc50f19c99c356bc7e085acaa5f4665d
    steps:
      - name: Checkout ExecSurface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout pinned casey just
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: casey/just
          ref: ${{ env.JUST_SHA }}
          path: external/just
          fetch-depth: 1
          persist-credentials: false

      - name: Install frozen Rust toolchain and verify upstream identity
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustc "+$RUST_TOOLCHAIN" --version --verbose
          test "$(git -C external/just rev-parse HEAD)" = "$JUST_SHA"
          test -z "$(git -C external/just status --porcelain)"

      - name: Build current ExecSurface and prime isolated just workload
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" build -p execsurface
          rm -rf /tmp/m9-just
          cp -a external/just /tmp/m9-just
          (cd /tmp/m9-just && cargo "+$RUST_TOOLCHAIN" test --all >/dev/null 2>&1)

      - name: Prove pinned just three consecutive times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            out="/tmp/m9-just-${attempt}.json"
            err="/tmp/m9-just-${attempt}.stderr"
            set +e
            timeout --signal=TERM --kill-after=5s 120s \
              target/debug/execsurface observe -- /bin/bash -lc \
              "cd /tmp/m9-just && cargo +$RUST_TOOLCHAIN test --all >/dev/null 2>&1" \
              >"$out" 2>"$err"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              cat "$err" || true
              exit "$rc"
            fi
            python3 - "$out" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          warnings = data.get("warnings", [])
          codes = [warning.get("code") for warning in warnings]
          assert data.get("complete") is False, warnings
          assert codes == ["shared_fd_table_ambiguity"], warnings
          outcome = data.get("outcome", {})
          assert outcome.get("exit_code") == 0, outcome
          assert outcome.get("signal") is None, outcome
          PY
            if grep -Eq 'ExecSurface: ERROR|observer protocol error|observer OS error' "$err"; then
              cat "$err"
              exit 1
            fi
          done
