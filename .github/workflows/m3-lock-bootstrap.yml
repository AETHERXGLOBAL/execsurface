name: M3 Lock Bootstrap

on:
  push:
    branches:
      - "milestone/m3-baseline-lock"

permissions:
  contents: read

jobs:
  cargo-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Generate dependency lock
        run: cargo generate-lockfile
      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: m3-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
