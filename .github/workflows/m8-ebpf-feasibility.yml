name: M8 eBPF Feasibility

on:
  push:
    branches:
      - "milestone/m8-ebpf-feasibility"
    paths:
      - "experiments/m8-ebpf/**"
      - "docs/milestones/M8_EBPF_FEASIBILITY.md"
      - ".github/workflows/m8-ebpf-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-audit:
    name: Host / BTF / privilege audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Record host contract
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          id
          rustc --version --verbose
          cargo --version
          clang --version
          test -r /sys/kernel/btf/vmlinux
          stat /sys/kernel/btf/vmlinux
          sha256sum /sys/kernel/btf/vmlinux
          cat /proc/sys/kernel/unprivileged_bpf_disabled || true
          ulimit -l
          mount | grep -E 'tracefs|debugfs' || true
          test -d /sys/kernel/tracing/events || test -d /sys/kernel/debug/tracing/events

  aya:
    name: Aya / build + lifecycle probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.87.0 --profile minimal
          rustup toolchain install nightly-2026-09-14 --profile minimal --component rust-src
          rustc +1.87.0 --version --verbose
          rustc +nightly-2026-09-14 --version --verbose
      - name: Install versioned bpf-linker binary
        shell: bash
        run: |
          set -euxo pipefail
          VERSION=0.11.1
          ASSET=bpf-linker-x86_64-unknown-linux-musl.tar.zst
          curl -fL "https://github.com/aya-rs/bpf-linker/releases/download/v${VERSION}/${ASSET}" -o "$RUNNER_TEMP/$ASSET"
          sha256sum "$RUNNER_TEMP/$ASSET"
          mkdir -p "$RUNNER_TEMP/bpf-linker"
          tar --zstd -xf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP/bpf-linker"
          find "$RUNNER_TEMP/bpf-linker" -maxdepth 2 -type f -print
          echo "$RUNNER_TEMP/bpf-linker" >> "$GITHUB_PATH"
      - name: Build Aya eBPF object
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$RUNNER_TEMP/bpf-linker:$PATH"
          bpf-linker --version
          cargo +nightly-2026-09-14 build \
            --manifest-path experiments/m8-ebpf/aya-ebpf/Cargo.toml \
            --target bpfel-unknown-none \
            -Z build-std=core \
            --release
          OBJ=experiments/m8-ebpf/aya-ebpf/target/bpfel-unknown-none/release/execsurface-m8-aya-ebpf
          test -f "$OBJ"
          file "$OBJ"
          sha256sum "$OBJ"
          readelf -h "$OBJ"
      - name: Build Aya userspace loader
        shell: bash
        run: |
          set -euxo pipefail
          cargo +1.87.0 build --manifest-path experiments/m8-ebpf/aya-loader/Cargo.toml --release
          BIN=experiments/m8-ebpf/aya-loader/target/release/execsurface-m8-aya-loader
          test -x "$BIN"
          file "$BIN"
          sha256sum "$BIN"
          ldd "$BIN" || true
      - name: Prove unprivileged denial is explicit
        shell: bash
        run: |
          set -euxo pipefail
          OBJ=experiments/m8-ebpf/aya-ebpf/target/bpfel-unknown-none/release/execsurface-m8-aya-ebpf
          BIN=experiments/m8-ebpf/aya-loader/target/release/execsurface-m8-aya-loader
          set +e
          "$BIN" "$OBJ" >"$RUNNER_TEMP/aya-unprivileged.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/aya-unprivileged.log"
          test "$rc" -ne 0
          echo "M8_AYA_UNPRIVILEGED_DENIAL_PASS exit=$rc"
      - name: Prove invalid attach remains an explicit diagnostic
        shell: bash
        run: |
          set -euxo pipefail
          OBJ=experiments/m8-ebpf/aya-ebpf/target/bpfel-unknown-none/release/execsurface-m8-aya-ebpf
          BIN=experiments/m8-ebpf/aya-loader/target/release/execsurface-m8-aya-loader
          set +e
          sudo env AX_M8_INVALID_ATTACH=1 "$BIN" "$OBJ" >"$RUNNER_TEMP/aya-invalid-attach.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/aya-invalid-attach.log"
          test "$rc" -ne 0
          test -s "$RUNNER_TEMP/aya-invalid-attach.log"
          echo "M8_AYA_INVALID_ATTACH_DIAGNOSTIC_PASS exit=$rc"
      - name: Prove transport lineage loss accounting and persisted-output privacy
        shell: bash
        run: |
          set -euxo pipefail
          OBJ=experiments/m8-ebpf/aya-ebpf/target/bpfel-unknown-none/release/execsurface-m8-aya-ebpf
          BIN=experiments/m8-ebpf/aya-loader/target/release/execsurface-m8-aya-loader
          sudo "$BIN" "$OBJ" 2>&1 | tee "$RUNNER_TEMP/aya-proof.log"
          grep -q '^M8_AYA_ATTACH_PASS$' "$RUNNER_TEMP/aya-proof.log"
          grep -q '^M8_AYA_EVENT_TRANSPORT_PASS ' "$RUNNER_TEMP/aya-proof.log"
          grep -q '^M8_AYA_BTF_LINEAGE_PASS ' "$RUNNER_TEMP/aya-proof.log"
          grep -q '^M8_AYA_LOSS_ACCOUNTING_PASS ' "$RUNNER_TEMP/aya-proof.log"
          grep -q '^M8_AYA_PRIVACY_SCHEMA_PASS ' "$RUNNER_TEMP/aya-proof.log"
          ! grep -Fq 'AX_M8_ARGV_SENTINEL_DO_NOT_PERSIST' "$RUNNER_TEMP/aya-proof.log"
          ! grep -Fq 'AX_M8_ENV_SENTINEL_DO_NOT_PERSIST' "$RUNNER_TEMP/aya-proof.log"
          echo 'M8_AYA_PERSISTED_OUTPUT_PRIVACY_PASS'

  libbpf:
    name: libbpf-rs / build + lifecycle probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install declared native build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libelf-dev zlib1g-dev pkg-config
          clang --version
          pkg-config --modversion libelf
      - name: Install resolver and product-MSRV Rust toolchains
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.87.0 --profile minimal
          rustup toolchain install 1.82.0 --profile minimal
          cargo +1.87.0 --version
          rustc +1.82.0 --version --verbose
      - name: Resolve a Rust-1.82-compatible dependency lock
        shell: bash
        run: |
          set -euxo pipefail
          rm -f experiments/m8-ebpf/libbpf-probe/Cargo.lock
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback \
            cargo +1.87.0 generate-lockfile \
            --manifest-path experiments/m8-ebpf/libbpf-probe/Cargo.toml
          grep -A2 -E '^name = "(getrandom|clap_lex|libbpf-rs|libbpf-cargo)"' \
            experiments/m8-ebpf/libbpf-probe/Cargo.lock
      - name: Build libbpf-rs probe and generated skeleton on Rust 1.82
        shell: bash
        run: |
          set -euxo pipefail
          cargo +1.82.0 build \
            --manifest-path experiments/m8-ebpf/libbpf-probe/Cargo.toml \
            --release --locked
          BIN=experiments/m8-ebpf/libbpf-probe/target/release/execsurface-m8-libbpf-probe
          test -x "$BIN"
          file "$BIN"
          sha256sum "$BIN"
          ldd "$BIN" || true
      - name: Load / attach / detach probe
        shell: bash
        run: |
          set -euxo pipefail
          BIN=experiments/m8-ebpf/libbpf-probe/target/release/execsurface-m8-libbpf-probe
          sudo "$BIN"
