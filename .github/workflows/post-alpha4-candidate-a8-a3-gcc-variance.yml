name: Post-alpha4 candidate A8 A3 GCC variance regression

on:
  push:
    branches: [release/post-alpha4-candidate-assembly]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.90.0
  ALPHA4_SOURCE: 48e0b9a0707553349e75e97a9dfa096d13f9ab5d
  A8_A1_ACCEPTED_SOURCE: 1c65327e99aa62a3b42549764bebe6b5b29516e7
  A8_A2_ACCEPTED_SOURCE: 4166ff64b8110e27b47954c1f0875cce81ebf898
  A8_A3_ACCEPTED_SOURCE: 6c35861f66cc238374dc113d9431859bf0340bb9

jobs:
  provenance-and-a3-slice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify lineage and immutable public tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git merge-base --is-ancestor "$ALPHA4_SOURCE" HEAD
          git merge-base --is-ancestor "$A8_A1_ACCEPTED_SOURCE" HEAD
          git merge-base --is-ancestor "$A8_A2_ACCEPTED_SOURCE" HEAD
          git merge-base --is-ancestor "$A8_A3_ACCEPTED_SOURCE" HEAD
          test "$(git rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
      - name: Verify frozen A3 product slice is byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$A8_A3_ACCEPTED_SOURCE" HEAD -- \
            crates/execsurface-normalize/Cargo.toml \
            crates/execsurface-normalize/src/lib.rs \
            crates/execsurface-normalize/src/gcc_ephemeral_v4.rs \
            crates/execsurface-normalize/tests/gcc_ephemeral_v4_candidate.rs
      - name: Verify default-off feature and public normalization boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > metadata.json
          jq -e '.packages[] | select(.name == "execsurface-normalize") | .features.default == [] and .features["gcc-ephemeral-v4"] == []' metadata.json >/dev/null
          grep -F 'pub const NORMALIZATION_PROFILE_VERSION: u32 = 3;' crates/execsurface-model/src/canonical.rs

  default-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy
      - name: Rustfmt
        run: cargo +$RUST_TOOLCHAIN fmt --all -- --check
      - name: Clippy default workspace
        run: cargo +$RUST_TOOLCHAIN clippy --locked --workspace --all-targets -- -D warnings
      - name: Default workspace regression
        run: cargo +$RUST_TOOLCHAIN test --locked --workspace --all-targets

  a3-falsification-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy
      - name: Clippy feature-enabled normalize
        run: cargo +$RUST_TOOLCHAIN clippy --locked -p execsurface-normalize --all-targets --features gcc-ephemeral-v4 -- -D warnings
      - name: Reprove frozen A3 corpus
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-normalize --features gcc-ephemeral-v4 --test gcc_ephemeral_v4_candidate -- --nocapture 2>&1 | tee a8-a3.log
          grep -q 'test result: ok. 12 passed; 0 failed' a8-a3.log
      - name: Full feature-enabled normalize regression
        run: cargo +$RUST_TOOLCHAIN test --locked -p execsurface-normalize --features gcc-ephemeral-v4

  closeout:
    needs: [provenance-and-a3-slice, default-regression, a3-falsification-regression]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Emit A3 integration-regression evidence
        run: |
          mkdir -p evidence
          {
            echo 'decision=POST_ALPHA4_PROMOTION_A8_A3_INTEGRATION_REGRESSION_PASS'
            echo "candidate_sha=${GITHUB_SHA}"
            echo "a8_a3_accepted_source=${A8_A3_ACCEPTED_SOURCE}"
            echo 'a3_slice_unchanged=true'
            echo 'gcc_variance_corpus=12/12'
            echo 'frequency_authority=false'
            echo 'raw_evidence_mutated=false'
            echo 'default_normalization_unchanged=true'
            echo 'public_release_authorized=false'
            echo 'p8_closure=false'
          } | tee evidence/a8-a3-integration-regression.txt
      - uses: actions/upload-artifact@v4
        with:
          name: a8-a3-integration-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/a8-a3-integration-regression.txt
          retention-days: 90
