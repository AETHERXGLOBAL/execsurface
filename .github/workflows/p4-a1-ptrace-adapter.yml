name: P4 A1 ptrace proposition adapter

on:
  push:
    branches:
      - development/post-alpha4-behavioral-integrity
    paths:
      - 'experiments/p4-ptrace-proposition-adapter/**'
      - 'docs/development/P4_A1_PTRACE_ADAPTER_PROTOCOL.md'
      - '.github/workflows/p4-a1-ptrace-adapter.yml'

permissions:
  contents: read

jobs:
  a1-types:
    runs-on: ubuntu-24.04
    env:
      RUST_TOOLCHAIN: '1.90.0'
      EVIDENCE_ROOT: p4-a1-evidence
    steps:
      - name: Checkout isolated development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy

      - name: Verify A1 preregistration boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          grep -q 'PREREGISTERED — IMPLEMENTATION MAY START' docs/development/P4_A1_PTRACE_ADAPTER_PROTOCOL.md
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" | tee "$EVIDENCE_ROOT/source.txt"
          printf 'stage=A1.1\n' | tee -a "$EVIDENCE_ROOT/source.txt"

      - name: Generate isolated dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p4-ptrace-proposition-adapter/Cargo.toml

      - name: Rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN fmt --manifest-path experiments/p4-ptrace-proposition-adapter/Cargo.toml -- --check \
            2>&1 | tee "$EVIDENCE_ROOT/rustfmt.log"

      - name: Clippy deny warnings
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN clippy --locked --manifest-path experiments/p4-ptrace-proposition-adapter/Cargo.toml --all-targets -- -D warnings \
            2>&1 | tee "$EVIDENCE_ROOT/clippy.log"

      - name: Run A1.1 falsification tests
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-ptrace-proposition-adapter/Cargo.toml -- --nocapture \
            2>&1 | tee "$EVIDENCE_ROOT/tests.log"
          grep -q 'test result: ok. 10 passed; 0 failed' "$EVIDENCE_ROOT/tests.log"
          printf 'P4_A1_1_TYPES_PASS\n' | tee "$EVIDENCE_ROOT/A1_1_DECISION.txt"

      - name: Re-prove public M11 fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-observe --test m11_shared_fd_ambiguity \
            2>&1 | tee "$EVIDENCE_ROOT/public-m11.log"
          grep -q 'test result: ok. 6 passed; 0 failed' "$EVIDENCE_ROOT/public-m11.log"

      - name: Seal evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          find "$EVIDENCE_ROOT" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_ROOT/SHA256SUMS"

      - name: Upload A1.1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p4-a1-${{ github.run_id }}-${{ github.run_attempt }}
          path: p4-a1-evidence
          if-no-files-found: error
          retention-days: 30
