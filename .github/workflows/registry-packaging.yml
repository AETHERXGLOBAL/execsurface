name: Registry Packaging Gate

on:
  push:
    branches:
      - "release/crates-io-distribution"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - ".github/workflows/registry-packaging.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - ".github/workflows/registry-packaging.yml"

permissions:
  contents: read

jobs:
  registry-packaging:
    name: crates.io packaging and lockfile gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify committed lockfile matches registry-ready manifests
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Full source gates
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets

      - name: Prove registry metadata and dependency boundaries
        run: |
          set -euo pipefail

          # Before the first registry publication, only the leaf crate can be
          # fully packaged and verified against crates.io.
          cargo package -p execsurface-model --allow-dirty

          # Dependent crates will package successfully only after their exact
          # prerelease dependencies are present in the registry. Validate the
          # intended publish graph and metadata now; the publication workflow
          # proves each dependent crate after its predecessors are published.
          python - <<'PY'
          from pathlib import Path
          import tomllib

          version = "0.1.0-alpha.2"
          publishable = {
              "execsurface-model",
              "execsurface-observe",
              "execsurface-normalize",
              "execsurface-baseline",
              "execsurface-diff",
              "execsurface-policy",
              "execsurface-report",
              "execsurface",
          }

          manifests = {}
          for path in Path("crates").glob("*/Cargo.toml"):
              data = tomllib.loads(path.read_text())
              manifests[data["package"]["name"]] = (path, data)

          assert publishable.issubset(manifests)
          assert manifests["execsurface-bench"][1]["package"].get("publish") is False

          for name in publishable:
              path, data = manifests[name]
              package = data["package"]
              assert package["description"]
              assert package["license"]["workspace"] is True
              assert package["repository"]["workspace"] is True
              assert package["readme"]["workspace"] is True

              for section in ("dependencies", "dev-dependencies", "build-dependencies"):
                  for dep_name, dep in data.get(section, {}).items():
                      if (
                          dep_name.startswith("execsurface-")
                          and isinstance(dep, dict)
                          and "path" in dep
                      ):
                          assert dep.get("version") == f"={version}", (
                              f"{path}: {section}.{dep_name} must pin ={version}"
                          )

          cli = manifests["execsurface"][1]["package"]
          assert cli["keywords"]
          assert cli["categories"]
          print("Registry manifest graph verified")
          PY
