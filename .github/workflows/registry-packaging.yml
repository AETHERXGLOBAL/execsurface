name: Registry Packaging Gate

on:
  push:
    branches:
      - "release/crates-io-distribution"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - ".github/workflows/registry-packaging.yml"

permissions:
  contents: write

jobs:
  registry-packaging:
    name: crates.io packaging and lockfile gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Regenerate lockfile for package identity changes
        run: cargo generate-lockfile

      - name: Commit lockfile on the dedicated preparation branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo.lock for registry distribution"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Full source gates
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets

      - name: Prove registry metadata and package boundaries
        run: |
          set -euo pipefail
          cargo package -p execsurface-model --allow-dirty
          for crate in             execsurface-observe             execsurface-normalize             execsurface-baseline             execsurface-diff             execsurface-policy             execsurface-report             execsurface
          do
            cargo package -p "$crate" --allow-dirty --no-verify
          done
          ! cargo package -p execsurface-bench --allow-dirty --no-verify
