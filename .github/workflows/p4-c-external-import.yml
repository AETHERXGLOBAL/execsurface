name: P4 C external trace import gate

on:
  push:
    branches: [development/post-alpha4-behavioral-integrity]
    paths:
      - 'experiments/p4-external-trace-import/**'
      - 'docs/development/P4_C_EXTERNAL_TRACE_IMPORT_PROTOCOL.md'
      - '.github/workflows/p4-c-external-import.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-import:
    runs-on: ubuntu-24.04
    env:
      RUST_TOOLCHAIN: 1.90.0
      EVIDENCE_ROOT: p4-c-external-import-evidence
      P4B_ACCEPTED_SOURCE: e471075e460e86b70e4a3d191b83de4f9be02aac
      ALPHA4_SOURCE: 48e0b9a0707553349e75e97a9dfa096d13f9ab5d
      TETRAGON_SOURCE: 666efe6f91e3605ad58683ad226d759d9cf970ca
      TETRAGON_EVENTS_BLOB: d6bd56769241da983f7e0042a54d5b3a81f40817
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}

      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy

      - name: Verify frozen ExecSurface boundaries
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          git merge-base --is-ancestor "$P4B_ACCEPTED_SOURCE" HEAD
          test "$(git rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
          if git diff --name-only "$P4B_ACCEPTED_SOURCE"..HEAD | grep -q '^crates/'; then exit 1; fi
          grep -q 'PREREGISTERED — SCHEMA-LEVEL IMPORT ONLY' docs/development/P4_C_EXTERNAL_TRACE_IMPORT_PROTOCOL.md
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" | tee "$EVIDENCE_ROOT/source.txt"
          printf 'p4b_accepted_source=%s\n' "$P4B_ACCEPTED_SOURCE" | tee -a "$EVIDENCE_ROOT/source.txt"
          printf 'alpha4_source=%s\n' "$ALPHA4_SOURCE" | tee -a "$EVIDENCE_ROOT/source.txt"

      - name: Verify pinned external schema identity
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" remote add origin https://github.com/cilium/tetragon.git
          git -C "$tmp" fetch -q --depth=1 origin "$TETRAGON_SOURCE"
          test "$(git -C "$tmp" rev-parse FETCH_HEAD:api/v1/tetragon/events.proto)" = "$TETRAGON_EVENTS_BLOB"
          git -C "$tmp" cat-file -e FETCH_HEAD:api/v1/tetragon/tetragon.proto
          printf 'tetragon_source=%s\n' "$TETRAGON_SOURCE" | tee "$EVIDENCE_ROOT/external-source.txt"
          printf 'events_proto_blob=%s\n' "$TETRAGON_EVENTS_BLOB" | tee -a "$EVIDENCE_ROOT/external-source.txt"

      - name: Lock and static gates
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p4-external-trace-import/Cargo.toml
          cargo +$RUST_TOOLCHAIN fmt --manifest-path experiments/p4-external-trace-import/Cargo.toml -- --check 2>&1 | tee "$EVIDENCE_ROOT/rustfmt.log"
          cargo +$RUST_TOOLCHAIN clippy --locked --manifest-path experiments/p4-external-trace-import/Cargo.toml --all-targets -- -D warnings 2>&1 | tee "$EVIDENCE_ROOT/clippy.log"

      - name: Execute frozen 14-test import falsification corpus
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-external-trace-import/Cargo.toml --test tetragon_import -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/import.log"
          grep -q 'test result: ok. 14 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' "$EVIDENCE_ROOT/import.log"

      - name: Reprove P4-B cross proposition and backend-name anti-inflation
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p4-backend-authority/Cargo.toml
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b_cross_proposition_falsification -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/cross.log"
          grep -q 'test result: ok. 12 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' "$EVIDENCE_ROOT/cross.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --lib a0_backend_name_never_upgrades_weak_evidence -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/backend-name.log"
          grep -q 'test result: ok. 1 passed; 0 failed' "$EVIDENCE_ROOT/backend-name.log"

      - name: Reprove B1 B2 B3 live gates
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b1_ptrace_open_live -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b1-live.log"
          grep -q 'test result: ok. 10 passed; 0 failed' "$EVIDENCE_ROOT/b1-live.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b2_ptrace_rename_delete_live -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b2-live.log"
          grep -q 'test result: ok. 10 passed; 0 failed' "$EVIDENCE_ROOT/b2-live.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b3_ptrace_connect_live -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b3-live.log"
          grep -q 'test result: ok. 10 passed; 0 failed' "$EVIDENCE_ROOT/b3-live.log"

      - name: Reprove Semantics v3 and public M11
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-model --all-targets 2>&1 | tee "$EVIDENCE_ROOT/semantics-v3.log"
          grep -q 'test result: ok. 7 passed; 0 failed' "$EVIDENCE_ROOT/semantics-v3.log"
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-observe --test m11_shared_fd_ambiguity 2>&1 | tee "$EVIDENCE_ROOT/public-m11.log"
          grep -q 'test result: ok. 6 passed; 0 failed' "$EVIDENCE_ROOT/public-m11.log"

      - name: Record candidate decision only after full gate
        run: |
          set -euo pipefail
          printf 'P4_C_EXTERNAL_IMPORT_PATH_ESTABLISHED_BOUNDED_CANDIDATE\n' | tee "$EVIDENCE_ROOT/CANDIDATE.txt"

      - name: Seal evidence
        if: always()
        run: |
          set -uo pipefail
          find "$EVIDENCE_ROOT" -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_ROOT/SHA256SUMS"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p4-c-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: p4-c-external-import-evidence
          if-no-files-found: error
          retention-days: 30
