name: Release ExecSurface Alpha.5 v2

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: v0.1.0-alpha.5
  RELEASE_VERSION: 0.1.0-alpha.5
  FROZEN_PRODUCT_SHA: 5067200452c174da6bc8d9d7ecf6957ee379f0a2
  ALPHA4_SOURCE: 48e0b9a0707553349e75e97a9dfa096d13f9ab5d
  TARGET_TRIPLE: x86_64-unknown-linux-gnu
  RUST_TOOLCHAIN: 1.90.0
  SOURCE_DATE_EPOCH: '1790875860'
  ASSET_NAME: execsurface-v0.1.0-alpha.5-x86_64-unknown-linux-gnu.tar.gz

concurrency:
  group: execsurface-alpha5-public-release-v2
  cancel-in-progress: false

jobs:
  release:
    name: Qualify, attest and publish Alpha.5
    if: github.ref == 'refs/tags/v0.1.0-alpha.5'
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    outputs:
      release_sha: ${{ steps.identity.outputs.release_sha }}
      asset: ${{ env.ASSET_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify immutable release identity and governance boundary
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin main
          release_sha="$(git rev-parse HEAD)"
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          test "$release_sha" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$release_sha" = "$(git rev-parse origin/main)"
          test "$(git rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          stable_sha="$(git rev-parse 'v0.1^{commit}')"
          test "$stable_sha" = "$ALPHA4_SOURCE" || test "$stable_sha" = "$release_sha"
          version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="execsurface"))')"
          test "$version" = "$RELEASE_VERSION"
          test "$(tr -d '[:space:]' < action/release-tag.txt)" = "$RELEASE_TAG"
          grep -F 'P8_PREPUBLICATION_GATE_WAIVED_BY_OWNER=true' docs/development/ALPHA5_OWNER_AUTHORIZED_RELEASE_OVERRIDE.md
          grep -F "FROZEN_PRODUCT_SHA=$FROZEN_PRODUCT_SHA" docs/development/ALPHA5_OWNER_AUTHORIZED_RELEASE_OVERRIDE.md
          grep -F 'EXTERNAL_VALIDATION_CLAIM=false' docs/development/ALPHA5_OWNER_AUTHORIZED_RELEASE_OVERRIDE.md
          test -s "docs/releases/$RELEASE_TAG.md"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy

      - name: Full release source gates
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN fmt --all -- --check
          cargo +$RUST_TOOLCHAIN clippy --locked --workspace --all-targets -- -D warnings
          cargo +$RUST_TOOLCHAIN test --locked --workspace --all-targets
          cargo +$RUST_TOOLCHAIN test --locked --workspace --doc
          git diff --exit-code -- Cargo.lock
          test -z "$(git status --porcelain -- Cargo.lock)"

      - name: Materialize two clean source snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src-a" "$RUNNER_TEMP/src-b"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/src-a"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/src-b"
          diff -qr "$RUNNER_TEMP/src-a" "$RUNNER_TEMP/src-b"

      - name: Deterministic dual build on compatibility floor
        shell: bash
        env:
          CARGO_INCREMENTAL: '0'
          TZ: UTC
          LC_ALL: C
        run: |
          set -euo pipefail
          common='-C debuginfo=0 -C link-arg=-Wl,--build-id=none'
          RUSTFLAGS="$common --remap-path-prefix=$RUNNER_TEMP/src-a=/src --remap-path-prefix=$HOME/.cargo=/cargo" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/target-a" SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            cargo +$RUST_TOOLCHAIN build --manifest-path "$RUNNER_TEMP/src-a/Cargo.toml" --locked --release -p execsurface --bin execsurface
          RUSTFLAGS="$common --remap-path-prefix=$RUNNER_TEMP/src-b=/src --remap-path-prefix=$HOME/.cargo=/cargo" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/target-b" SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            cargo +$RUST_TOOLCHAIN build --manifest-path "$RUNNER_TEMP/src-b/Cargo.toml" --locked --release -p execsurface --bin execsurface
          a="$RUNNER_TEMP/target-a/release/execsurface"
          b="$RUNNER_TEMP/target-b/release/execsurface"
          test "$("$a" --version)" = "execsurface $RELEASE_VERSION"
          test "$("$b" --version)" = "execsurface $RELEASE_VERSION"
          cmp -s "$a" "$b"
          sha256sum "$a" "$b"

      - name: Enforce glibc compatibility ceiling
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/target-a/release/execsurface"
          strings "$bin" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu > glibc-required.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          vals=[]
          for line in Path('glibc-required.txt').read_text().splitlines():
              m=re.fullmatch(r'GLIBC_([0-9]+(?:\.[0-9]+)+)',line.strip())
              if m: vals.append(tuple(map(int,m.group(1).split('.'))))
          assert vals, 'no GLIBC requirements discovered'
          highest=max(vals)
          print('highest_glibc=', '.'.join(map(str,highest)))
          assert highest <= (2,35), highest
          PY

      - name: Assemble deterministic public release bundle twice
        shell: bash
        run: |
          set -euo pipefail
          release_sha="${{ steps.identity.outputs.release_sha }}"
          root="execsurface-${RELEASE_TAG}-${TARGET_TRIPLE}"
          for n in 1 2; do
            out="dist$n"
            bin="$RUNNER_TEMP/target-a/release/execsurface"
            test "$n" = 2 && bin="$RUNNER_TEMP/target-b/release/execsurface"
            mkdir -p "$out/$root"
            cp "$bin" "$out/$root/execsurface"
            cp LICENSE NOTICE "$out/$root/"
            {
              echo "ExecSurface $RELEASE_TAG"
              echo "product_version=$RELEASE_VERSION"
              echo "target=$TARGET_TRIPLE"
              echo "source_commit=$release_sha"
              echo "frozen_product_source=$FROZEN_PRODUCT_SHA"
              echo 'builder_baseline=ubuntu-22.04'
              echo "rust_toolchain=$RUST_TOOLCHAIN"
              echo "source_date_epoch=$SOURCE_DATE_EPOCH"
              echo 'deterministic_path_remap=true'
              echo 'publication=public-prerelease'
              echo 'p8_external_validation_closed=false'
              echo 'p8_prepublication_gate=owner-waived'
              echo 'external_validation_claim=false'
              echo "build_workflow=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > "$out/$root/BUILD_INFO.txt"
            find "$out/$root" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
            tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
              -C "$out" -cf - "$root" | gzip -n > "$out/$ASSET_NAME"
          done
          cmp -s "dist1/$ASSET_NAME" "dist2/$ASSET_NAME"
          (cd dist1 && sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256" && sha256sum -c "$ASSET_NAME.sha256")
          sha256sum "dist1/$ASSET_NAME" "dist2/$ASSET_NAME"

      - name: Archive safety and privacy sentinel
        shell: bash
        run: |
          set -euo pipefail
          ASSET="dist1/$ASSET_NAME" python3 - <<'PY'
          import os, tarfile
          from pathlib import PurePosixPath
          asset=os.environ['ASSET']; tag=os.environ['RELEASE_TAG']; target=os.environ['TARGET_TRIPLE']
          root=f'execsurface-{tag}-{target}'
          allowed={root,f'{root}/execsurface',f'{root}/LICENSE',f'{root}/NOTICE',f'{root}/BUILD_INFO.txt'}
          seen=set()
          with tarfile.open(asset,'r:gz') as tf:
              for m in tf.getmembers():
                  p=PurePosixPath(m.name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert m.name not in seen
                  seen.add(m.name)
                  assert m.name in allowed, m.name
                  assert not (m.issym() or m.islnk() or m.isdev())
          assert allowed <= seen
          PY
          text="$(tar -xOzf "dist1/$ASSET_NAME" "execsurface-${RELEASE_TAG}-${TARGET_TRIPLE}/BUILD_INFO.txt")"
          ! grep -Eiq '(token=|password=|secret=|authorization:|BEGIN .*PRIVATE KEY)' <<<"$text"

      - name: Generate GitHub provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist1/${{ env.ASSET_NAME }}

      - name: Publish or prove identical existing GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat "docs/releases/$RELEASE_TAG.md" > "$notes"
          {
            echo
            printf 'Release source commit: `%s`\n' "${{ steps.identity.outputs.release_sha }}"
            printf 'Frozen product source: `%s`\n' "$FROZEN_PRODUCT_SHA"
            echo
            echo "Build and attestation run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$notes"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir existing && cd existing
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --pattern "$ASSET_NAME.sha256"
            sha256sum -c "$ASSET_NAME.sha256"
            cmp -s "$ASSET_NAME" "../dist1/$ASSET_NAME"
            cmp -s "$ASSET_NAME.sha256" "../dist1/$ASSET_NAME.sha256"
            cd ..
            echo 'Existing public artifact is byte-identical; continuing without mutation.'
          else
            gh release create "$RELEASE_TAG" "dist1/$ASSET_NAME" "dist1/$ASSET_NAME.sha256" \
              --verify-tag --prerelease --title "ExecSurface $RELEASE_TAG" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          fi

  public-binary-consumer:
    name: Public binary consumer (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Download, attest, smoke and test verdict behavior
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --pattern "$ASSET_NAME.sha256"
          sha256sum -c "$ASSET_NAME.sha256"
          gh attestation verify "$ASSET_NAME" -R "$GITHUB_REPOSITORY"
          tar -xzf "$ASSET_NAME"
          bin="$PWD/execsurface-${RELEASE_TAG}-${TARGET_TRIPLE}/execsurface"
          test "$("$bin" --version)" = "execsurface $RELEASE_VERSION"
          "$bin" doctor
          work="$RUNNER_TEMP/public-consumer"; mkdir -p "$work"; cd "$work"
          "$bin" learn --output pass.lock.json -- /bin/bash -lc true
          "$bin" check --baseline pass.lock.json -- /bin/bash -lc true
          set +e
          output="$("$bin" check --baseline pass.lock.json -- /bin/bash -lc 'true; /bin/echo drift >/dev/null' 2>&1)"
          status=$?
          set -e
          test "$status" -eq 10
          grep -F 'ExecSurface: REVIEW' <<<"$output"

      - name: Reject public artifact tampering
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$ASSET_NAME" tampered.tar.gz
          printf 'tamper' >> tampered.tar.gz
          test "$(sha256sum tampered.tar.gz | awk '{print $1}')" != "$(awk '{print $1}' "$ASSET_NAME.sha256")"
          if gh attestation verify tampered.tar.gz -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::tampered artifact unexpectedly verified'
            exit 1
          fi

  source-artifact-equivalence:
    name: Public artifact vs immutable source
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v0.1.0-alpha.5
          fetch-depth: 0
      - name: Install pinned Rust and rebuild
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Prove source, metadata and byte equivalence
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_INCREMENTAL: '0'
          TZ: UTC
          LC_ALL: C
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.release.outputs.release_sha }}"
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          common='-C debuginfo=0 -C link-arg=-Wl,--build-id=none'
          RUSTFLAGS="$common --remap-path-prefix=$RUNNER_TEMP/source=/src --remap-path-prefix=$HOME/.cargo=/cargo" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/rebuild" SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            cargo +$RUST_TOOLCHAIN build --manifest-path "$RUNNER_TEMP/source/Cargo.toml" --locked --release -p execsurface --bin execsurface
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --pattern "$ASSET_NAME.sha256"
          sha256sum -c "$ASSET_NAME.sha256"
          tar -xzf "$ASSET_NAME"
          published="$PWD/execsurface-${RELEASE_TAG}-${TARGET_TRIPLE}/execsurface"
          cmp -s "$published" "$RUNNER_TEMP/rebuild/release/execsurface"
          info="$PWD/execsurface-${RELEASE_TAG}-${TARGET_TRIPLE}/BUILD_INFO.txt"
          grep -F "source_commit=${{ needs.release.outputs.release_sha }}" "$info"
          grep -F "frozen_product_source=$FROZEN_PRODUCT_SHA" "$info"
          grep -F 'p8_external_validation_closed=false' "$info"
          grep -F 'external_validation_claim=false' "$info"
          sha256sum "$published" "$RUNNER_TEMP/rebuild/release/execsurface"

  immutable-tag-consumers:
    name: Immutable tag source and Action consumers
    needs: [release, public-binary-consumer, source-artifact-equivalence]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Fresh cargo install from immutable Git tag
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cargo-git"
          cargo install --git https://github.com/AETHERXGLOBAL/execsurface.git --tag "$RELEASE_TAG" execsurface --locked --root "$root"
          test "$("$root/bin/execsurface" --version)" = "execsurface $RELEASE_VERSION"
      - name: Download CLI and prepare Action baselines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --pattern "$ASSET_NAME.sha256"
          sha256sum -c "$ASSET_NAME.sha256"
          tar -xzf "$ASSET_NAME"
          bin="$PWD/execsurface-${RELEASE_TAG}-${TARGET_TRIPLE}/execsurface"
          echo "PATH=$(dirname "$bin"):$PATH" >> "$GITHUB_ENV"
          "$bin" learn --output pass.lock.json -- /bin/bash -lc true
          cp pass.lock.json review.lock.json
          cp pass.lock.json block.lock.json
          cat > block-policy.json <<'JSON'
          {
            "schema_version": 2,
            "default_action": "review",
            "rules": [
              {"id": "block-added-exec", "action": "block", "match": {"change": "added", "effect": "process_exec"}}
            ]
          }
          JSON
      - name: Immutable Alpha.5 Action PASS
        id: pass
        uses: AETHERXGLOBAL/execsurface@v0.1.0-alpha.5
        with:
          command: "true"
          baseline: pass.lock.json
          upload-artifact: "false"
      - name: Immutable Alpha.5 Action REVIEW
        id: review
        uses: AETHERXGLOBAL/execsurface@v0.1.0-alpha.5
        with:
          command: "true; /bin/echo x >/dev/null"
          baseline: review.lock.json
          upload-artifact: "false"
      - name: Immutable Alpha.5 Action BLOCK
        id: block
        continue-on-error: true
        uses: AETHERXGLOBAL/execsurface@v0.1.0-alpha.5
        with:
          command: "true; /bin/echo x >/dev/null"
          baseline: block.lock.json
          policy: block-policy.json
          upload-artifact: "false"
      - name: Immutable Alpha.5 Action ERROR
        id: error
        continue-on-error: true
        uses: AETHERXGLOBAL/execsurface@v0.1.0-alpha.5
        with:
          command: "true"
          baseline: missing.lock.json
          upload-artifact: "false"
      - name: Assert immutable Action semantics
        env:
          PASS_VERDICT: ${{ steps.pass.outputs.verdict }}
          REVIEW_VERDICT: ${{ steps.review.outputs.verdict }}
          BLOCK_VERDICT: ${{ steps.block.outputs.verdict }}
          BLOCK_OUTCOME: ${{ steps.block.outcome }}
          ERROR_VERDICT: ${{ steps.error.outputs.verdict }}
          ERROR_OUTCOME: ${{ steps.error.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PASS_VERDICT" = pass
          test "$REVIEW_VERDICT" = review
          test "$BLOCK_VERDICT" = block
          test "$BLOCK_OUTCOME" = failure
          test "$ERROR_VERDICT" = error
          test "$ERROR_OUTCOME" = failure

  promote-stable:
    name: Promote stable v0.1 only after public proofs
    needs: [release, public-binary-consumer, source-artifact-equivalence, immutable-tag-consumers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v0.1.0-alpha.5
          fetch-depth: 0
      - name: Move or verify stable channel
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          release_sha="${{ needs.release.outputs.release_sha }}"
          test "$(git rev-parse HEAD)" = "$release_sha"
          test "$(git rev-parse 'v0.1.0-alpha.5^{commit}')" = "$release_sha"
          current="$(git rev-parse 'v0.1^{commit}')"
          if [ "$current" = "$release_sha" ]; then
            echo 'Stable channel already points to Alpha.5; no mutation needed.'
            exit 0
          fi
          test "$current" = "$ALPHA4_SOURCE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa v0.1 "$release_sha" -m "ExecSurface stable v0.1 channel -> $RELEASE_TAG"
          git push origin refs/tags/v0.1 --force

  stable-action-consumer:
    name: Stable v0.1 public Action proof (${{ matrix.os }})
    needs: [release, promote-stable]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Prepare baseline from public Alpha.5 binary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --pattern "$ASSET_NAME.sha256"
          sha256sum -c "$ASSET_NAME.sha256"
          tar -xzf "$ASSET_NAME"
          bin="$PWD/execsurface-${RELEASE_TAG}-${TARGET_TRIPLE}/execsurface"
          echo "PATH=$(dirname "$bin"):$PATH" >> "$GITHUB_ENV"
          "$bin" learn --output stable.lock.json -- /bin/bash -lc true
      - name: Stable Action PASS
        id: stable
        uses: AETHERXGLOBAL/execsurface@v0.1
        with:
          command: "true"
          baseline: stable.lock.json
          upload-artifact: "false"
      - name: Assert stable channel target and PASS
        env:
          VERDICT: ${{ steps.stable.outputs.verdict }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERDICT" = pass
          remote_sha="$(git ls-remote https://github.com/AETHERXGLOBAL/execsurface.git 'refs/tags/v0.1^{}' | awk '{print $1}')"
          test "$remote_sha" = "${{ needs.release.outputs.release_sha }}"

  publish-crates:
    name: Publish Alpha.5 registry chain
    needs: [release, stable-action-consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: crates-io
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v0.1.0-alpha.5
          fetch-depth: 0
      - name: Verify registry source identity and packaging
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.release.outputs.release_sha }}"
          test -n "$CARGO_REGISTRY_TOKEN"
          test "$(tr -d '[:space:]' < action/release-tag.txt)" = "$RELEASE_TAG"
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo publish -p execsurface-model --locked --dry-run
      - name: Publish dependency chain idempotently
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          published() { crate="$1"; cargo info "$crate@$version" --registry crates-io >/dev/null 2>&1; }
          publish_one() {
            crate="$1"
            if published "$crate"; then echo "$crate $version already exists; skipping"; return 0; fi
            for attempt in $(seq 1 5); do
              if cargo publish -p "$crate" --locked; then return 0; fi
              if published "$crate"; then return 0; fi
              test "$attempt" -eq 5 && return 1
              sleep 30
            done
          }
          publish_one execsurface-model
          publish_one execsurface-observe
          publish_one execsurface-normalize
          publish_one execsurface-baseline
          publish_one execsurface-diff
          publish_one execsurface-policy
          publish_one execsurface-report
          publish_one execsurface
      - name: Zero-contact registry install and smoke
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/crates-consumer"
          installed=0
          for attempt in $(seq 1 10); do
            rm -rf "$root"
            if cargo install execsurface --version "=$RELEASE_VERSION" --locked --root "$root"; then installed=1; break; fi
            sleep 10
          done
          test "$installed" = 1
          test "$("$root/bin/execsurface" --version)" = "execsurface $RELEASE_VERSION"
          "$root/bin/execsurface" doctor
          work="$RUNNER_TEMP/registry-smoke"; mkdir -p "$work"; cd "$work"
          "$root/bin/execsurface" learn -- /bin/bash -lc true
          "$root/bin/execsurface" check -- /bin/bash -lc true

  closeout:
    name: Record public release closeout
    needs: [release, public-binary-consumer, source-artifact-equivalence, immutable-tag-consumers, promote-stable, stable-action-consumer, publish-crates]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record bounded release result
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RESULT: ${{ needs.release.result }}
          BINARY_RESULT: ${{ needs.public-binary-consumer.result }}
          EQUIV_RESULT: ${{ needs.source-artifact-equivalence.result }}
          TAG_RESULT: ${{ needs.immutable-tag-consumers.result }}
          PROMOTE_RESULT: ${{ needs.promote-stable.result }}
          STABLE_RESULT: ${{ needs.stable-action-consumer.result }}
          REGISTRY_RESULT: ${{ needs.publish-crates.result }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/closeout.md"
          {
            echo '## Alpha.5 owner-authorized public release run v2'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Release source: \`${{ needs.release.outputs.release_sha }}\`"
            echo
            echo "- release/publication: $RELEASE_RESULT"
            echo "- Ubuntu 22.04/24.04 public binary tests + tamper rejection: $BINARY_RESULT"
            echo "- source/artifact byte equivalence: $EQUIV_RESULT"
            echo "- immutable tag source/Action tests: $TAG_RESULT"
            echo "- stable v0.1 promotion: $PROMOTE_RESULT"
            echo "- stable public Action tests: $STABLE_RESULT"
            echo "- crates.io chain + clean install: $REGISTRY_RESULT"
            echo
            echo 'P8 external validation remains open; this run does not claim external validation.'
          } > "$body"
          gh issue comment 117 --repo "$GITHUB_REPOSITORY" --body-file "$body"
          if [ "$RELEASE_RESULT" = success ] && [ "$BINARY_RESULT" = success ] && [ "$EQUIV_RESULT" = success ] && [ "$TAG_RESULT" = success ] && [ "$PROMOTE_RESULT" = success ] && [ "$STABLE_RESULT" = success ] && [ "$REGISTRY_RESULT" = success ]; then
            echo 'ALPHA5_PUBLIC_RELEASE_AND_POSTPUBLICATION_VERIFICATION_PASS'
          else
            echo '::error::Alpha.5 publication chain not fully closed; inspect retained job failures.'
            exit 1
          fi
