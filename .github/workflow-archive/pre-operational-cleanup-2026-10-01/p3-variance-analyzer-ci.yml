name: P3 variance analyzer CI

on:
  push:
    branches:
      - development/post-alpha4-behavioral-integrity
    paths:
      - "experiments/p3-variance-analyzer/**"
      - "crates/execsurface-baseline/**"
      - "crates/execsurface-model/**"
      - ".github/workflows/p3-variance-analyzer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variance-analyzer:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust formatting
        run: cargo fmt --manifest-path experiments/p3-variance-analyzer/Cargo.toml -- --check

      - name: Analyzer clippy
        run: cargo clippy --locked --manifest-path experiments/p3-variance-analyzer/Cargo.toml --all-targets -- -D warnings

      - name: Analyzer tests
        run: cargo test --locked --manifest-path experiments/p3-variance-analyzer/Cargo.toml --all-targets
