name: P7 A1 GitLab CI context adapter gate

on:
  push:
    branches:
      - development/post-alpha4-behavioral-integrity
    paths:
      - '.github/workflows/p7-a1-gitlab-context.yml'
      - 'docs/development/P7_A1_GITLAB_CI_ADAPTER_PROTOCOL.md'
      - 'experiments/p7-platform-ci/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  ALPHA4_SOURCE: 48e0b9a0707553349e75e97a9dfa096d13f9ab5d
  P5_CLOSEOUT_SOURCE: 1f4df8f45a115a1638c997107e069c6acd74c51b
  P6_CLOSEOUT_SOURCE: 2fd32bf61275e733ddfb11df4f382cde6deab74b
  P7_A0_DECISION_SOURCE: 5cc80b7b3188b0879bcc585362579aff644c76f6
  PROTOCOL_BLOB: 487025292f071b27a30820f428ad652ad9019e40
  ADAPTER_BLOB: 3dc22d3218e2bae4a30a880ea2175b4e614e284a
  TEST_BLOB: 51d84d2795948775e43e5b87735feba1ecccb884
  EVIDENCE_ROOT: p7-a1-gitlab-context-evidence

jobs:
  gitlab-context-adapter:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify frozen predecessors and public boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          test "$(git rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
          git merge-base --is-ancestor "$P5_CLOSEOUT_SOURCE" HEAD
          git merge-base --is-ancestor "$P6_CLOSEOUT_SOURCE" HEAD
          git merge-base --is-ancestor "$P7_A0_DECISION_SOURCE" HEAD
          if git diff --name-only "$P6_CLOSEOUT_SOURCE"..HEAD | grep -q '^crates/'; then
            echo 'P7 modified public crates/ after P6 closeout' >&2
            exit 1
          fi
          grep -q 'P7_A0_ARM64_NOT_PORTABLE' docs/development/P7_A0_ARM64_DECISION.md
          grep -q 'PREREGISTERED — NO A1 RESULT YET' docs/development/P7_A1_GITLAB_CI_ADAPTER_PROTOCOL.md
          {
            echo "head=$(git rev-parse HEAD)"
            echo "alpha4_source=$ALPHA4_SOURCE"
            echo "p5_closeout_source=$P5_CLOSEOUT_SOURCE"
            echo "p6_closeout_source=$P6_CLOSEOUT_SOURCE"
            echo "p7_a0_decision_source=$P7_A0_DECISION_SOURCE"
          } | tee "$EVIDENCE_ROOT/boundaries.txt"

      - name: Verify frozen A1 blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/development/P7_A1_GITLAB_CI_ADAPTER_PROTOCOL.md)" = "$PROTOCOL_BLOB"
          test "$(git hash-object experiments/p7-platform-ci/gitlab_context_adapter.py)" = "$ADAPTER_BLOB"
          test "$(git hash-object experiments/p7-platform-ci/test_gitlab_context_adapter.py)" = "$TEST_BLOB"
          {
            echo "protocol_blob=$PROTOCOL_BLOB"
            echo "adapter_blob=$ADAPTER_BLOB"
            echo "test_blob=$TEST_BLOB"
          } | tee "$EVIDENCE_ROOT/frozen-blobs.txt"

      - name: Static syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            experiments/p7-platform-ci/gitlab_context_adapter.py \
            experiments/p7-platform-ci/test_gitlab_context_adapter.py
          python3 --version | tee "$EVIDENCE_ROOT/python-version.txt"

      - name: Execute frozen 14-test falsification corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s experiments/p7-platform-ci \
            -p 'test_*.py' -v 2>&1 | tee "$EVIDENCE_ROOT/tests.log"
          grep -q '^Ran 14 tests' "$EVIDENCE_ROOT/tests.log"
          grep -q '^OK$' "$EVIDENCE_ROOT/tests.log"

      - name: Emit deterministic reference binding
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/p7-platform-ci python3 - <<'PY' | tee "$EVIDENCE_ROOT/reference-binding.json"
          import json
          from gitlab_context_adapter import bind_gitlab_context
          env = {
              'CI_PROJECT_PATH': 'aether-x/execsurface',
              'CI_COMMIT_SHA': 'a' * 40,
              'CI_PIPELINE_ID': '12345',
              'CI_JOB_ID': '67890',
              'CI_JOB_NAME': 'runtime verification',
              'CI_PIPELINE_SOURCE': 'push',
          }
          print(json.dumps(bind_gitlab_context(env).output(), sort_keys=True, separators=(',', ':')))
          PY
          grep -q '"authority":"context_only"' "$EVIDENCE_ROOT/reference-binding.json"
          grep -q '"may_change_verdict":false' "$EVIDENCE_ROOT/reference-binding.json"
          grep -q '"may_select_baseline":false' "$EVIDENCE_ROOT/reference-binding.json"
          grep -q '"may_upgrade_observer_authority":false' "$EVIDENCE_ROOT/reference-binding.json"

      - name: Record candidate decision
        shell: bash
        run: |
          set -euo pipefail
          echo 'P7_A1_GITLAB_CONTEXT_ADAPTER_PASS_BOUNDED_CANDIDATE' | tee "$EVIDENCE_ROOT/candidate-decision.txt"
          echo 'public_gitlab_support_promoted=false' | tee -a "$EVIDENCE_ROOT/candidate-decision.txt"
          echo 'behavioral_authority_changed=false' | tee -a "$EVIDENCE_ROOT/candidate-decision.txt"

      - name: Seal evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          find "$EVIDENCE_ROOT" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_ROOT/SHA256SUMS"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p7-a1-${{ github.run_id }}-${{ github.run_attempt }}
          path: p7-a1-gitlab-context-evidence
          if-no-files-found: error
          retention-days: 30
