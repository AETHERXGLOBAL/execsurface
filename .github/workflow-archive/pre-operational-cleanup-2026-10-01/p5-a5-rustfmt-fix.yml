name: P5 A5 one-shot harness correction

on:
  push:
    branches: [development/post-alpha4-behavioral-integrity]
    paths:
      - '.github/workflows/p5-a5-rustfmt-fix.yml'

permissions:
  contents: write

jobs:
  harness-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pinned Rust tooling
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal
          rustup component add --toolchain 1.90.0 rustfmt clippy

      - name: Remove clone-on-copy only from A5 graph fixture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('experiments/p5-cross-attestation-redteam/tests/a5_graph_redteam.rs')
          text = path.read_text()
          replacements = {
              'observer_health: input.observer_health.clone(),': 'observer_health: input.observer_health,',
              'authority: input.authority.clone(),': 'authority: input.authority,',
              'verdict: input.verdict.clone(),': 'verdict: input.verdict,',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected clippy-only pattern not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo +1.90.0 fmt --manifest-path experiments/p5-cross-attestation-redteam/Cargo.toml
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'experiments/p5-cross-attestation-redteam/tests/a5_graph_redteam.rs'

      - name: Prove both A5 static gates
        run: |
          set -euo pipefail
          cargo +1.90.0 generate-lockfile --manifest-path experiments/p5-attestation-provenance/Cargo.toml
          cargo +1.90.0 fmt --manifest-path experiments/p5-attestation-provenance/Cargo.toml -- --check
          cargo +1.90.0 clippy --locked --manifest-path experiments/p5-attestation-provenance/Cargo.toml --all-targets -- -D warnings
          cargo +1.90.0 generate-lockfile --manifest-path experiments/p5-cross-attestation-redteam/Cargo.toml
          cargo +1.90.0 fmt --manifest-path experiments/p5-cross-attestation-redteam/Cargo.toml -- --check
          cargo +1.90.0 clippy --locked --manifest-path experiments/p5-cross-attestation-redteam/Cargo.toml --all-targets -- -D warnings

      - name: Commit harness-only correction
        run: |
          set -euo pipefail
          git config user.name 'AETHER X CI'
          git config user.email 'aether.x.eg@gmail.com'
          git add experiments/p5-cross-attestation-redteam/tests/a5_graph_redteam.rs
          git diff --cached --check
          git commit -m 'P5 A5: remove clone-on-copy from frozen fixture'
          git push origin HEAD:development/post-alpha4-behavioral-integrity
