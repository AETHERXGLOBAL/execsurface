name: P5 A2 verifier identity adequacy addendum

on:
  push:
    branches: [development/post-alpha4-behavioral-integrity]
    paths:
      - 'experiments/p5-attestation-provenance/**'
      - 'docs/development/P5_A2_VERIFIER_ID_ADEQUACY_ADDENDUM.md'
      - '.github/workflows/p5-a2-verifier-identity-addendum.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-identity-addendum:
    runs-on: ubuntu-24.04
    env:
      RUST_TOOLCHAIN: 1.90.0
      EVIDENCE_ROOT: p5-a2-verifier-identity-addendum-evidence
      A2_GREEN_CANDIDATE: f8fdd2438277538d432cecbc3b5337f44f7f07cb
      ALPHA4_SOURCE: 48e0b9a0707553349e75e97a9dfa096d13f9ab5d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy

      - name: Verify frozen boundaries and addendum preregistration
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          git merge-base --is-ancestor "$A2_GREEN_CANDIDATE" HEAD
          test "$(git rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
          if git diff --name-only "$A2_GREEN_CANDIDATE"..HEAD | grep -q '^crates/'; then exit 1; fi
          grep -q 'PREREGISTERED — EXACTLY 4 ADDENDUM TESTS / ORIGINAL 14 TESTS UNCHANGED' \
            docs/development/P5_A2_VERIFIER_ID_ADEQUACY_ADDENDUM.md
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" | tee "$EVIDENCE_ROOT/source.txt"
          printf 'a2_green_candidate=%s\n' "$A2_GREEN_CANDIDATE" | tee -a "$EVIDENCE_ROOT/source.txt"
          printf 'alpha4_source=%s\n' "$ALPHA4_SOURCE" | tee -a "$EVIDENCE_ROOT/source.txt"

      - name: Lock and static gates
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p5-attestation-provenance/Cargo.toml
          cargo +$RUST_TOOLCHAIN fmt --manifest-path experiments/p5-attestation-provenance/Cargo.toml -- --check \
            2>&1 | tee "$EVIDENCE_ROOT/rustfmt.log"
          cargo +$RUST_TOOLCHAIN clippy --locked --manifest-path experiments/p5-attestation-provenance/Cargo.toml \
            --all-targets -- -D warnings 2>&1 | tee "$EVIDENCE_ROOT/clippy.log"

      - name: Execute frozen 4-test verifier identity addendum
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p5-attestation-provenance/Cargo.toml \
            --test a2_verifier_identity_addendum -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/addendum.log"
          grep -q 'test result: ok. 4 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' \
            "$EVIDENCE_ROOT/addendum.log"

      - name: Reprove original A2 A1 A0 unchanged
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p5-attestation-provenance/Cargo.toml \
            --test a2_scai_svr_binding -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/a2.log"
          grep -q 'test result: ok. 14 passed; 0 failed' "$EVIDENCE_ROOT/a2.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p5-attestation-provenance/Cargo.toml \
            --test a1_runtime_trace_mapping -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/a1.log"
          grep -q 'test result: ok. 12 passed; 0 failed' "$EVIDENCE_ROOT/a1.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p5-attestation-provenance/Cargo.toml \
            --test a0_standards_composition -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/a0.log"
          grep -q 'test result: ok. 18 passed; 0 failed' "$EVIDENCE_ROOT/a0.log"

      - name: Reprove critical P4 Semantics v3 and public M11
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p4-backend-authority/Cargo.toml
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml \
            --test b_cross_proposition_falsification -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/p4-cross.log"
          grep -q 'test result: ok. 12 passed; 0 failed' "$EVIDENCE_ROOT/p4-cross.log"
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-model --all-targets \
            2>&1 | tee "$EVIDENCE_ROOT/semantics-v3.log"
          grep -q 'test result: ok. 7 passed; 0 failed' "$EVIDENCE_ROOT/semantics-v3.log"
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-observe --test m11_shared_fd_ambiguity \
            2>&1 | tee "$EVIDENCE_ROOT/public-m11.log"
          grep -q 'test result: ok. 6 passed; 0 failed' "$EVIDENCE_ROOT/public-m11.log"

      - name: Record candidate only after full addendum gate
        run: |
          set -euo pipefail
          printf 'P5_A2_VERIFIER_ID_ADEQUACY_PASS_CANDIDATE\n' | tee "$EVIDENCE_ROOT/CANDIDATE.txt"

      - name: Seal evidence
        if: always()
        run: |
          set -uo pipefail
          find "$EVIDENCE_ROOT" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_ROOT/SHA256SUMS"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p5-a2-verifier-id-${{ github.run_id }}-${{ github.run_attempt }}
          path: p5-a2-verifier-identity-addendum-evidence
          if-no-files-found: error
          retention-days: 30
