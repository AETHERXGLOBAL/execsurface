name: P3 V5-R2 R5 independent falsification

on:
  push:
    branches:
      - development/post-alpha4-behavioral-integrity
    paths:
      - ".github/workflows/p3-v5-r5-falsification.yml"
      - "experiments/p3-v5-r5-falsifier/**"
      - "docs/development/P3_V5R2_R5_FALSIFICATION_PROTOCOL.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-falsification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_TOOLCHAIN: 1.90.0
      LEARNING_ARTIFACT_ID: "11035133723"
      LEARNING_ARTIFACT_SHA256: "a98a1f022e601f0b0653474df8c4500f33fa5670f7e25f105740b2e79bd2fd26"
      R4_ARTIFACT_ID: "11037682900"
      R4_ARTIFACT_SHA256: "99f0acef1213a94f08ea6ff5d5908da927098a80505cbc1f4fec1eb74ee4afd1"
      EVIDENCE_ROOT: p3-v5-r5-evidence

    steps:
      - name: Checkout isolated development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy

      - name: Freeze R5 boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT/learning" "$EVIDENCE_ROOT/r4"
          grep -q 'PREREGISTERED — NO FINAL P3 DECISION MAY PRECEDE THIS GATE' \
            docs/development/P3_V5R2_R5_FALSIFICATION_PROTOCOL.md
          {
            printf 'r5_source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'learning_artifact_id=%s\n' "$LEARNING_ARTIFACT_ID"
            printf 'learning_artifact_sha256=%s\n' "$LEARNING_ARTIFACT_SHA256"
            printf 'r4_artifact_id=%s\n' "$R4_ARTIFACT_ID"
            printf 'r4_artifact_sha256=%s\n' "$R4_ARTIFACT_SHA256"
          } | tee "$EVIDENCE_ROOT/r5-source.txt"

      - name: Verify immutable learning and R4 evidence plus corruption rejection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${LEARNING_ARTIFACT_ID}/zip" \
            -o "$EVIDENCE_ROOT/learning.zip"
          test "$(sha256sum "$EVIDENCE_ROOT/learning.zip" | awk '{print $1}')" = "$LEARNING_ARTIFACT_SHA256"
          unzip -q "$EVIDENCE_ROOT/learning.zip" -d "$EVIDENCE_ROOT/learning"
          grep -qx 'admitted=6/6' "$EVIDENCE_ROOT/learning/admission-summary.txt"

          curl --fail-with-body --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${R4_ARTIFACT_ID}/zip" \
            -o "$EVIDENCE_ROOT/r4.zip"
          test "$(sha256sum "$EVIDENCE_ROOT/r4.zip" | awk '{print $1}')" = "$R4_ARTIFACT_SHA256"
          unzip -q "$EVIDENCE_ROOT/r4.zip" -d "$EVIDENCE_ROOT/r4"

          cp "$EVIDENCE_ROOT/r4.zip" "$EVIDENCE_ROOT/r4-corrupted.zip"
          printf 'intentional-r5-corruption' >> "$EVIDENCE_ROOT/r4-corrupted.zip"
          test "$(sha256sum "$EVIDENCE_ROOT/r4-corrupted.zip" | awk '{print $1}')" != "$R4_ARTIFACT_SHA256"
          printf 'R5_PROVENANCE_CORRUPTION_REJECTED\n' | tee "$EVIDENCE_ROOT/provenance-result.txt"

      - name: Independently replay R4 false-PASS invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EVIDENCE_ROOT/r4" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          assert (root/'check-admission-summary.txt').read_text().strip() == 'admitted=6/6'
          summary=json.loads((root/'r4-summary.json').read_text())
          assert summary['gcc_ephemeral_eligible_findings'] == [4,4,4,4,4,4]
          assert summary['explicitly_accepted_variable_matches'] == [0,0,0,0,0,0]
          assert summary['checks_explicit_lower_than_ephemeral'] == 0
          sentinel=json.loads((root/'sentinel-report.json').read_text())
          expected='$TMP/execsurface-p3-v5-sentinel-meaningful.txt'
          matches=[]
          for e in sentinel['unseen_effects']:
              target=(e.get('target') or {}).get('value')
              actor=e.get('actor') or {}
              if target == expected and actor.get('family') == 'cat':
                  matches.append(e)
          assert matches
          assert sentinel['explicitly_accepted_variable_matches'] == []
          assert sentinel['non_target_projection_mismatches'] == []
          assert sentinel['residual_after_explicit_variance'] > 0
          print(f'R5_SENTINEL_REPLAY_UNSEEN_MATCHES={len(matches)}')
          print('R5_R4_FALSE_PASS_INVARIANTS_PASS')
          PY

      - name: Run original poisoning falsifier and current-boundary falsifier
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p3-v4-falsifier/Cargo.toml
          cargo +$RUST_TOOLCHAIN fmt --manifest-path experiments/p3-v4-falsifier/Cargo.toml -- --check
          cargo +$RUST_TOOLCHAIN clippy --locked --manifest-path experiments/p3-v4-falsifier/Cargo.toml --all-targets -- -D warnings
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p3-v4-falsifier/Cargo.toml -- --nocapture \
            2>&1 | tee "$EVIDENCE_ROOT/v4-falsifier-replay.log"

          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p3-v5-r5-falsifier/Cargo.toml
          cargo +$RUST_TOOLCHAIN fmt --manifest-path experiments/p3-v5-r5-falsifier/Cargo.toml -- --check
          cargo +$RUST_TOOLCHAIN clippy --locked --manifest-path experiments/p3-v5-r5-falsifier/Cargo.toml --all-targets -- -D warnings
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p3-v5-r5-falsifier/Cargo.toml -- --nocapture \
            2>&1 | tee "$EVIDENCE_ROOT/r5-falsifier.log"

      - name: Re-prove public path remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-observe --test m11_shared_fd_ambiguity \
            2>&1 | tee "$EVIDENCE_ROOT/public-m11-after-r5.log"
          grep -q 'test result: ok. 6 passed; 0 failed' "$EVIDENCE_ROOT/public-m11-after-r5.log"
          printf 'P3_R5_FALSIFICATION_PASS_BOUNDED\n' | tee "$EVIDENCE_ROOT/R5_DECISION.txt"

      - name: Seal evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          find "$EVIDENCE_ROOT" -maxdepth 2 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_ROOT/SHA256SUMS"

      - name: Upload R5 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p3-v5-r5-${{ github.run_id }}-${{ github.run_attempt }}
          path: p3-v5-r5-evidence
          if-no-files-found: error
          retention-days: 30
