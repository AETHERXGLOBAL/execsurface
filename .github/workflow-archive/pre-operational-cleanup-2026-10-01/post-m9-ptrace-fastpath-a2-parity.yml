name: Post-M9 ptrace fast-path A2 parity

on:
  push:
    branches:
      - main
    paths:
      - experiments/post_m9_phase_aware/apply_candidate_a2.py
      - docs/milestones/POST_M9_PTRACE_FASTPATH_A2_HARDENING.md
      - docs/milestones/POST_M9_PTRACE_FASTPATH_PARITY_COMPARATOR.md
      - docs/milestones/POST_M9_PTRACE_FASTPATH_PARITY_METHOD.md
      - .github/workflows/post-m9-ptrace-fastpath-a2-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_TOOLCHAIN: 1.90.0
      REF_BIN: /tmp/execsurface-a2-reference
      CAND_BIN: /tmp/execsurface-a2-candidate
      FIXTURE_BIN: /tmp/execsurface-a2-fixture
      HELPER_BIN: /tmp/execsurface-a2-helper
      EVIDENCE: post-m9-ptrace-a2-parity

    steps:
      - name: Checkout frozen A2 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze environment and protocol inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/post_m9_phase_aware/apply_candidate_a2.py
          test -f docs/milestones/POST_M9_PTRACE_FASTPATH_A2_HARDENING.md
          test -f docs/milestones/POST_M9_PTRACE_FASTPATH_PARITY_COMPARATOR.md
          test -f docs/milestones/POST_M9_PTRACE_FASTPATH_PARITY_METHOD.md
          mkdir -p "$EVIDENCE"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc strace
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'kernel=%s\n' "$(uname -srmo)"
            printf 'arch=%s\n' "$(uname -m)"
            printf 'cpu=%s\n' "$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
            printf 'rustc=%s\n' "$(rustc +$RUST_TOOLCHAIN --version)"
            printf 'gcc=%s\n' "$(gcc --version | head -1)"
            printf 'strace=%s\n' "$(strace -V | head -1)"
            printf 'public_runtime_modified=false\n'
            printf 'performance_value_evaluated=false\n'
          } > "$EVIDENCE/environment.txt"

      - name: Build reference binaries before A2 patch
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" build --locked --release -p execsurface --bin execsurface
          cp target/release/execsurface "$REF_BIN"
          cargo "+$RUST_TOOLCHAIN" build --locked --release -p execsurface-observe --bin execsurface-fixture
          cp target/release/execsurface-fixture "$FIXTURE_BIN"
          sha256sum "$REF_BIN" "$FIXTURE_BIN" > "$EVIDENCE/reference-binaries.sha256"

      - name: Build adversarial helper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE/a2_helper.c" <<'C'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <pthread.h>
          #include <signal.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/socket.h>
          #include <sys/syscall.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <time.h>
          #include <unistd.h>

          static void noop_handler(int sig) { (void)sig; }

          static int do_fileio(const char *path) {
              int fd = open(path, O_CREAT|O_TRUNC|O_RDWR, 0600);
              if (fd < 0) return 11;
              if (write(fd, "abc", 3) != 3) return 12;
              if (lseek(fd, 0, SEEK_SET) < 0) return 13;
              char b[4] = {0};
              if (read(fd, b, 3) != 3) return 14;
              int dupfd = dup(fd);
              if (dupfd < 0) return 15;
              if (close(dupfd) != 0) return 16;
              if (close(fd) != 0) return 17;
              return 0;
          }

          static void *thread_exec(void *arg) {
              (void)arg;
              execl("/bin/true", "true", (char*)0);
              _exit(91);
          }

          static void *thread_exit_group(void *arg) {
              (void)arg;
              syscall(SYS_exit_group, 0);
              return 0;
          }

          int main(int argc, char **argv) {
              if (argc < 2) return 64;
              const char *mode = argv[1];
              const char *path = argc > 2 ? argv[2] : "/tmp/execsurface-a2-fixed";

              if (!strcmp(mode, "getpid")) {
                  unsigned long n = argc > 2 ? strtoul(argv[2], 0, 10) : 0;
                  volatile long x = 0;
                  for (unsigned long i = 0; i < n; i++) x ^= syscall(SYS_getpid);
                  return x == -1 ? 70 : 0;
              }
              if (!strcmp(mode, "fileio")) return do_fileio(path);
              if (!strcmp(mode, "failed-open")) {
                  int fd = open("/definitely/not/execsurface-a2", O_RDONLY);
                  if (fd >= 0) { close(fd); return 21; }
                  return errno == ENOENT ? 0 : 22;
              }
              if (!strcmp(mode, "signal")) {
                  struct sigaction sa = {0};
                  sa.sa_handler = noop_handler;
                  sigemptyset(&sa.sa_mask);
                  if (sigaction(SIGALRM, &sa, 0) != 0) return 31;
                  ualarm(1000, 0);
                  struct timespec ts = {.tv_sec=0, .tv_nsec=100000000}, rem = {0};
                  (void)syscall(SYS_nanosleep, &ts, &rem);
                  int fd = open("/dev/null", O_RDONLY);
                  if (fd < 0) return 32;
                  char b = 0; (void)read(fd, &b, 1); close(fd);
                  return 0;
              }
              if (!strcmp(mode, "restart")) {
                  int p[2];
                  if (pipe(p) != 0) return 33;
                  struct sigaction sa = {0};
                  sa.sa_handler = noop_handler;
                  sa.sa_flags = SA_RESTART;
                  sigemptyset(&sa.sa_mask);
                  if (sigaction(SIGUSR1, &sa, 0) != 0) return 34;
                  pid_t parent = getpid();
                  pid_t c = fork();
                  if (c < 0) return 35;
                  if (c == 0) {
                      close(p[0]);
                      usleep(10000);
                      kill(parent, SIGUSR1);
                      usleep(10000);
                      char x = 'x';
                      (void)write(p[1], &x, 1);
                      _exit(0);
                  }
                  close(p[1]);
                  char x = 0;
                  ssize_t got = read(p[0], &x, 1);
                  close(p[0]);
                  int st = 0;
                  if (waitpid(c, &st, 0) != c) return 36;
                  if (got != 1 || x != 'x') return 37;
                  return WIFEXITED(st) && WEXITSTATUS(st) == 0 ? 0 : 38;
              }
              if (!strcmp(mode, "fork")) {
                  int fd = open(path, O_RDONLY); if (fd < 0) return 41;
                  pid_t c = fork(); if (c < 0) return 42;
                  if (c == 0) { char b = 0; (void)read(fd, &b, 1); _exit(0); }
                  int st = 0; if (waitpid(c, &st, 0) != c) return 43; close(fd);
                  return WIFEXITED(st) && WEXITSTATUS(st) == 0 ? 0 : 44;
              }
              if (!strcmp(mode, "vfork")) {
                  pid_t c = vfork(); if (c < 0) return 51;
                  if (c == 0) _exit(0);
                  int st = 0; if (waitpid(c, &st, 0) != c) return 52;
                  return WIFEXITED(st) && WEXITSTATUS(st) == 0 ? 0 : 53;
              }
              if (!strcmp(mode, "exec")) {
                  execl("/bin/true", "true", (char*)0);
                  return 61;
              }
              if (!strcmp(mode, "failed-exec")) {
                  execl("/definitely/not/execsurface-a2", "missing", (char*)0);
                  if (errno != ENOENT) return 62;
                  int fd = open("/dev/null", O_RDONLY); if (fd < 0) return 63;
                  close(fd); return 0;
              }
              if (!strcmp(mode, "thread-exec")) {
                  pthread_t t; if (pthread_create(&t, 0, thread_exec, 0) != 0) return 71;
                  void *r = 0; if (pthread_join(t, &r) != 0) return 72;
                  return 73;
              }
              if (!strcmp(mode, "exit-group")) {
                  pthread_t t; if (pthread_create(&t, 0, thread_exit_group, 0) != 0) return 81;
                  for (;;) pause();
              }
              return 65;
          }
          C
          gcc -O2 -Wall -Wextra -Werror -pthread "$EVIDENCE/a2_helper.c" -o "$HELPER_BIN"
          sha256sum "$HELPER_BIN" > "$EVIDENCE/helper.sha256"

      - name: Apply Candidate A2 only inside job
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/post_m9_phase_aware/apply_candidate_a2.py
          cargo "+$RUST_TOOLCHAIN" fmt --all
          git diff --check
          git diff -- crates/execsurface-observe/src/linux_ptrace.rs > "$EVIDENCE/a2.patch"
          test -s "$EVIDENCE/a2.patch"

      - name: Candidate compile and regression gates
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" clippy --locked -p execsurface-observe --all-targets -- -D warnings
          cargo "+$RUST_TOOLCHAIN" test --locked -p execsurface-observe --all-targets
          cargo "+$RUST_TOOLCHAIN" test --locked --workspace
          cargo "+$RUST_TOOLCHAIN" build --locked --release -p execsurface --bin execsurface
          cp target/release/execsurface "$CAND_BIN"
          sha256sum "$CAND_BIN" > "$EVIDENCE/candidate-binary.sha256"

      - name: Reference determinism and raw differential parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$REF_BIN" "$CAND_BIN" "$HELPER_BIN" "$FIXTURE_BIN" "$EVIDENCE" <<'PY'
          import copy, json, os, subprocess, sys
          from pathlib import Path

          ref, cand, helper, fixture, evidence = sys.argv[1:]
          out = Path(evidence) / "raw-parity"
          out.mkdir(parents=True, exist_ok=True)
          fixed = "/tmp/execsurface-a2-fixed"

          cases = [
              ("irrelevant", [helper, "getpid", "5000"], None),
              ("fileio", [helper, "fileio", fixed], b"fixture"),
              ("failed-open", [helper, "failed-open"], None),
              ("signal", [helper, "signal"], None),
              ("restart", [helper, "restart"], None),
              ("fork", [helper, "fork", fixed], b"fixture"),
              ("vfork", [helper, "vfork"], None),
              ("exec", [helper, "exec"], None),
              ("failed-exec", [helper, "failed-exec"], None),
              ("thread-exec", [helper, "thread-exec"], None),
              ("exit-group", [helper, "exit-group"], None),
              ("fixture-thread-read", [fixture, "thread-read", fixed, "8"], b"fixture"),
              ("fixture-spawn", [fixture, "spawn", "phase-aware-a2"], None),
          ]

          def reset_file(content):
              try: os.unlink(fixed)
              except FileNotFoundError: pass
              if content is not None:
                  Path(fixed).write_bytes(content)

          def run(binary, args, path):
              with path.open("w") as f:
                  p = subprocess.run(
                      [binary, "observe", "--", *args],
                      stdout=f,
                      stderr=subprocess.PIPE,
                      text=True,
                      timeout=30,
                  )
              Path(str(path) + ".stderr").write_text(p.stderr)
              if p.returncode != 0:
                  raise RuntimeError(f"{binary} {args} rc={p.returncode}: {p.stderr}")
              return json.loads(path.read_text())

          def projection(doc):
              d = copy.deepcopy(doc)
              mapping = {}
              next_id = 1

              def token(value):
                  nonlocal next_id
                  if value is None:
                      return None
                  key = int(value)
                  if key not in mapping:
                      mapping[key] = f"T{next_id}"
                      next_id += 1
                  return mapping[key]

              for event in d.get("events", []):
                  event["tid"] = token(event.get("tid"))
                  kind = event.get("kind")
                  if isinstance(kind, dict) and "ProcessSpawn" in kind:
                      payload = kind["ProcessSpawn"]
                      if isinstance(payload, dict) and "child_tid" in payload:
                          payload["child_tid"] = token(payload.get("child_tid"))
              for warning in d.get("warnings", []):
                  if warning.get("tid") is not None:
                      warning["tid"] = token(warning.get("tid"))
              return d

          summary = []
          for name, args, content in cases:
              reset_file(content)
              r1 = run(ref, args, out / f"{name}.reference1.json")
              reset_file(content)
              r2 = run(ref, args, out / f"{name}.reference2.json")
              pr1, pr2 = projection(r1), projection(r2)
              deterministic = pr1 == pr2
              if not deterministic:
                  summary.append({"case": name, "reference_deterministic": False, "candidate_equal": None})
                  (out / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
                  print(json.dumps({"case": name, "error": "reference nondeterminism under frozen raw comparator"}, indent=2))
                  raise SystemExit(1)

              reset_file(content)
              c = run(cand, args, out / f"{name}.candidate.json")
              pc = projection(c)
              equal = pr1 == pc
              summary.append({
                  "case": name,
                  "reference_deterministic": True,
                  "candidate_equal": equal,
                  "events": len(r1.get("events", [])),
                  "complete": r1.get("complete"),
                  "warnings": len(r1.get("warnings", [])),
              })
              (out / f"{name}.reference.projection.json").write_text(json.dumps(pr1, indent=2, sort_keys=True) + "\n")
              (out / f"{name}.candidate.projection.json").write_text(json.dumps(pc, indent=2, sort_keys=True) + "\n")
              if not equal:
                  (out / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
                  print(json.dumps({"case": name, "error": "reference/A2 raw parity mismatch"}, indent=2))
                  raise SystemExit(1)

          (out / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Fast-path activation diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/activation"
          for mode in reference candidate; do
            if [ "$mode" = reference ]; then exe="$REF_BIN"; else exe="$CAND_BIN"; fi
            for n in 0 5000; do
              strace -qq -s 128 \
                -o "$EVIDENCE/activation/${mode}-${n}.strace" \
                -e trace=ptrace,wait4,waitid,readlink,readlinkat \
                "$exe" observe -- "$HELPER_BIN" getpid "$n" \
                > "$EVIDENCE/activation/${mode}-${n}.json" \
                2> "$EVIDENCE/activation/${mode}-${n}.stderr"
            done
          done
          python3 - "$EVIDENCE/activation" <<'PY'
          import json, re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          def count(mode, n):
              text = (root / f"{mode}-{n}.strace").read_text(errors="replace")
              return len(re.findall(r"\bptrace\(PTRACE_GET_SYSCALL_INFO,", text))
          counts = {m: {n: count(m, n) for n in (0, 5000)} for m in ("reference", "candidate")}
          rd = counts["reference"][5000] - counts["reference"][0]
          cd = counts["candidate"][5000] - counts["candidate"][0]
          result = {
              "counts": counts,
              "reference_delta": rd,
              "candidate_delta": cd,
              "expected_reference_delta": 10000,
              "expected_candidate_delta": 5000,
              "classification": "DIAGNOSTIC_ONLY_NOT_PERFORMANCE",
          }
          (root / "activation.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          if rd != 10000 or cd != 5000:
              raise SystemExit(1)
          PY

      - name: Production baseline-diff parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/baseline-parity"
          fixed=/tmp/execsurface-a2-baseline-fixed
          printf 'fixture' > "$fixed"
          rm -f "$EVIDENCE/baseline-parity/reference.lock.json"
          "$REF_BIN" learn \
            --output "$EVIDENCE/baseline-parity/reference.lock.json" \
            -- "$HELPER_BIN" fileio "$fixed" \
            > "$EVIDENCE/baseline-parity/reference-learn.txt"
          printf 'fixture' > "$fixed"
          "$CAND_BIN" check \
            --baseline "$EVIDENCE/baseline-parity/reference.lock.json" \
            --diff-only --json \
            -- "$HELPER_BIN" fileio "$fixed" \
            > "$EVIDENCE/baseline-parity/reference-to-candidate.json"
          python3 - "$EVIDENCE/baseline-parity/reference-to-candidate.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          if d.get('added') or d.get('removed') or d.get('changed'):
              raise SystemExit('candidate drifted from reference baseline')
          PY

          rm -f "$EVIDENCE/baseline-parity/candidate.lock.json"
          printf 'fixture' > "$fixed"
          "$CAND_BIN" learn \
            --output "$EVIDENCE/baseline-parity/candidate.lock.json" \
            -- "$HELPER_BIN" fileio "$fixed" \
            > "$EVIDENCE/baseline-parity/candidate-learn.txt"
          printf 'fixture' > "$fixed"
          "$REF_BIN" check \
            --baseline "$EVIDENCE/baseline-parity/candidate.lock.json" \
            --diff-only --json \
            -- "$HELPER_BIN" fileio "$fixed" \
            > "$EVIDENCE/baseline-parity/candidate-to-reference.json"
          python3 - "$EVIDENCE/baseline-parity/candidate-to-reference.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          if d.get('added') or d.get('removed') or d.get('changed'):
              raise SystemExit('reference drifted from candidate baseline')
          PY

      - name: Record A2 evidence identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short > "$EVIDENCE/working-tree-status.txt" || true
          sha256sum "$EVIDENCE/a2.patch" > "$EVIDENCE/a2.patch.sha256" || true

      - name: Upload A2 parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-m9-ptrace-a2-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: post-m9-ptrace-a2-parity
          if-no-files-found: error
          retention-days: 30
