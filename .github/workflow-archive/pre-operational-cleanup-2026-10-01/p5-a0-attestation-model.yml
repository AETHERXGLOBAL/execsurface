name: P5 A0 attestation composition gate

on:
  push:
    branches: [development/post-alpha4-behavioral-integrity]
    paths:
      - 'experiments/p5-attestation-provenance/**'
      - 'docs/development/P5_ATTESTATION_PROVENANCE_PROTOCOL.md'
      - '.github/workflows/p5-a0-attestation-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standards-composition:
    runs-on: ubuntu-24.04
    env:
      RUST_TOOLCHAIN: 1.90.0
      EVIDENCE_ROOT: p5-a0-attestation-evidence
      P4C_ACCEPTED_SOURCE: 7db008ad64aad0782b7438ea8f225739ab942fc5
      P4_CLOSEOUT_SOURCE: 320c865d3e81071a8214ad726dca7a587b0fc479
      ALPHA4_SOURCE: 48e0b9a0707553349e75e97a9dfa096d13f9ab5d
      IN_TOTO_ATTESTATION_SOURCE: fd2609c16bcb0ac53443e2b4612977f997e8f9a5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}

      - name: Install pinned Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy

      - name: Verify frozen ExecSurface boundaries
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          git merge-base --is-ancestor "$P4_CLOSEOUT_SOURCE" HEAD
          git merge-base --is-ancestor "$P4C_ACCEPTED_SOURCE" HEAD
          test "$(git rev-parse 'v0.1.0-alpha.4^{commit}')" = "$ALPHA4_SOURCE"
          test "$(git rev-parse 'v0.1^{commit}')" = "$ALPHA4_SOURCE"
          if git diff --name-only "$P4C_ACCEPTED_SOURCE"..HEAD | grep -q '^crates/'; then exit 1; fi
          grep -q 'PREREGISTERED — STANDARDS-FIRST / NO-NEW-PREDICATE' docs/development/P5_ATTESTATION_PROVENANCE_PROTOCOL.md
          grep -q 'Exactly \*\*18 tests\*\*' docs/development/P5_ATTESTATION_PROVENANCE_PROTOCOL.md
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" | tee "$EVIDENCE_ROOT/source.txt"
          printf 'p4_closeout_source=%s\n' "$P4_CLOSEOUT_SOURCE" | tee -a "$EVIDENCE_ROOT/source.txt"
          printf 'p4c_accepted_source=%s\n' "$P4C_ACCEPTED_SOURCE" | tee -a "$EVIDENCE_ROOT/source.txt"
          printf 'alpha4_source=%s\n' "$ALPHA4_SOURCE" | tee -a "$EVIDENCE_ROOT/source.txt"

      - name: Verify pinned in-toto standards snapshot
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" remote add origin https://github.com/in-toto/attestation.git
          git -C "$tmp" fetch -q --depth=1 origin "$IN_TOTO_ATTESTATION_SOURCE"
          git -C "$tmp" show FETCH_HEAD:spec/predicates/runtime-trace.md | grep -q 'https://in-toto.io/attestation/runtime-trace/v0.1'
          git -C "$tmp" show FETCH_HEAD:spec/predicates/scai.md | grep -q 'https://in-toto.io/attestation/scai/v0.3'
          git -C "$tmp" show FETCH_HEAD:spec/predicates/svr.md | grep -q 'https://in-toto.io/attestation/svr/v0.2'
          printf 'in_toto_attestation_source=%s\n' "$IN_TOTO_ATTESTATION_SOURCE" | tee "$EVIDENCE_ROOT/external-standards.txt"

      - name: Lock and static gates
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p5-attestation-provenance/Cargo.toml
          cargo +$RUST_TOOLCHAIN fmt --manifest-path experiments/p5-attestation-provenance/Cargo.toml -- --check 2>&1 | tee "$EVIDENCE_ROOT/rustfmt.log"
          cargo +$RUST_TOOLCHAIN clippy --locked --manifest-path experiments/p5-attestation-provenance/Cargo.toml --all-targets -- -D warnings 2>&1 | tee "$EVIDENCE_ROOT/clippy.log"

      - name: Execute frozen 18-test P5 A0 corpus
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p5-attestation-provenance/Cargo.toml --test a0_standards_composition -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/a0.log"
          grep -q 'test result: ok. 18 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' "$EVIDENCE_ROOT/a0.log"

      - name: Reprove P4 C and cross-proposition integrity
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p4-external-trace-import/Cargo.toml
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-external-trace-import/Cargo.toml --test tetragon_import -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/p4c.log"
          grep -q 'test result: ok. 14 passed; 0 failed' "$EVIDENCE_ROOT/p4c.log"
          cargo +$RUST_TOOLCHAIN generate-lockfile --manifest-path experiments/p4-backend-authority/Cargo.toml
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b_cross_proposition_falsification -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/p4-cross.log"
          grep -q 'test result: ok. 12 passed; 0 failed' "$EVIDENCE_ROOT/p4-cross.log"

      - name: Reprove B1 B2 B3 live authority
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b1_ptrace_open_live -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b1-live.log"
          grep -q 'test result: ok. 10 passed; 0 failed' "$EVIDENCE_ROOT/b1-live.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b2_ptrace_rename_delete_live -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b2-live.log"
          grep -q 'test result: ok. 10 passed; 0 failed' "$EVIDENCE_ROOT/b2-live.log"
          cargo +$RUST_TOOLCHAIN test --locked --manifest-path experiments/p4-backend-authority/Cargo.toml --test b3_ptrace_connect_live -- --nocapture 2>&1 | tee "$EVIDENCE_ROOT/b3-live.log"
          grep -q 'test result: ok. 10 passed; 0 failed' "$EVIDENCE_ROOT/b3-live.log"

      - name: Reprove Semantics v3 and public M11
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-model --all-targets 2>&1 | tee "$EVIDENCE_ROOT/semantics-v3.log"
          grep -q 'test result: ok. 7 passed; 0 failed' "$EVIDENCE_ROOT/semantics-v3.log"
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-observe --test m11_shared_fd_ambiguity 2>&1 | tee "$EVIDENCE_ROOT/public-m11.log"
          grep -q 'test result: ok. 6 passed; 0 failed' "$EVIDENCE_ROOT/public-m11.log"

      - name: Record candidate decision only after full gate
        run: |
          set -euo pipefail
          printf 'P5_EXISTING_STANDARDS_COMPOSITION_SUFFICIENT_BOUNDED_CANDIDATE\n' | tee "$EVIDENCE_ROOT/CANDIDATE.txt"

      - name: Seal evidence
        if: always()
        run: |
          set -uo pipefail
          find "$EVIDENCE_ROOT" -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_ROOT/SHA256SUMS"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p5-a0-${{ github.run_id }}-${{ github.run_attempt }}
          path: p5-a0-attestation-evidence
          if-no-files-found: error
          retention-days: 30
