name: P3 V5-R2C fresh normalization-corrected learning gate

on:
  push:
    branches:
      - development/post-alpha4-behavioral-integrity
    paths:
      - "docs/development/P3_V5R2_R3C_NORMALIZATION_CORRECTION_PROTOCOL.md"
      - "experiments/p3-v5-r2c-baseline/**"
      - ".github/workflows/p3-v5-r2c-learning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-corrected-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUST_TOOLCHAIN: 1.90.0
      FZF_SHA: b1be3a8be1b833ce5b92fbbac11637643d60a046
      WORK_ROOT: /tmp/execsurface-p3-v5-r2c-fzf
      EVIDENCE_ROOT: p3-v5-r2c-learning-evidence
    steps:
      - name: Checkout isolated development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy

      - name: Freeze corrected source and research boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          {
            printf 'execsurface_source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'fzf_sha=%s\n' "$FZF_SHA"
            printf 'work_root=%s\n' "$WORK_ROOT"
            printf 'home=%s\n' "${HOME:-}"
            printf 'tmpdir=%s\n' "${TMPDIR:-}"
            printf 'go=%s\n' "$(go version)"
            printf 'gcc=%s\n' "$(gcc --version | head -1)"
            printf 'rustc=%s\n' "$(rustc +$RUST_TOOLCHAIN --version)"
            printf 'kernel=%s\n' "$(uname -srmo)"
            printf 'architecture=%s\n' "$(uname -m)"
          } | tee "$EVIDENCE_ROOT/environment.txt"

          grep -q 'PREREGISTERED — NO CORRECTED MEASUREMENT BEFORE THIS FREEZE' \
            docs/development/P3_V5R2_R3C_NORMALIZATION_CORRECTION_PROTOCOL.md
          grep -q 'PtraceSharedFdGuardPolicy::LegacyConservative' crates/execsurface-observe/src/lib.rs
          grep -q '#\[cfg(test)\]' crates/execsurface-observe/src/lib.rs
          grep -q 'CertificateAwareResearch' crates/execsurface-observe/src/lib.rs
          grep -q 'C6R_ISOLATED_RESEARCH_GUARD_PASS_BOUNDED' \
            docs/development/P3_V5C_C6R_RESULT.md

      - name: Inject deterministic test-only certificate-aware collector
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/execsurface-observe/src/lib.rs')
          text = p.read_text()
          anchor = '''    #[test]\n    fn shared_fd_ambiguity_is_never_pass_eligible() {\n'''
          assert text.count(anchor) == 1
          test = r'''    #[test]
              #[ignore = "V5-R2C research-only observation collector; dedicated workflow"]
              fn v5r2c_write_certificate_aware_observation() {
                  let root = std::env::var_os("EXECSURFACE_V5R2C_FZF_ROOT")
                      .expect("EXECSURFACE_V5R2C_FZF_ROOT must be set");
                  let output = std::env::var_os("EXECSURFACE_V5R2C_OBS_PATH")
                      .expect("EXECSURFACE_V5R2C_OBS_PATH must be set");
                  let spec = CommandSpec::new("/bin/bash")
                      .args([
                          "-lc",
                          "cd -- \"$1\" && go test ./... >/dev/null 2>&1",
                          "bash",
                      ])
                      .arg(root);
                  let ptrace = linux_ptrace::observe(&spec, ObserveOptions::default())
                      .expect("V5-R2C ptrace observation");
                  let certified = ptrace.clone_fd_certification.fully_certified();
                  let observation = finalize_ptrace_observation(
                      ptrace.observation,
                      certified,
                      PtraceSharedFdGuardPolicy::CertificateAwareResearch,
                  );
                  eprintln!(
                      "V5R2C_OBSERVATION complete={} warnings={} events={} certified={} exit={:?} signal={:?}",
                      observation.complete,
                      observation.warnings.len(),
                      observation.events.len(),
                      certified,
                      observation.outcome.exit_code,
                      observation.outcome.signal,
                  );
                  for warning in &observation.warnings {
                      eprintln!(
                          "V5R2C_WARNING code={} tid={:?} message={}",
                          warning.code, warning.tid, warning.message
                      );
                  }
                  assert_eq!(observation.outcome.exit_code, Some(0));
                  assert!(observation.outcome.signal.is_none());
                  assert!(certified, "clone/fd relation must be positively certified");
                  assert!(observation.complete, "research observation must be complete");
                  assert!(observation.warnings.is_empty(), "research observation must be warning-free");
                  let mut bytes = serde_json::to_vec_pretty(&observation)
                      .expect("serialize V5-R2C observation");
                  bytes.push(b'\n');
                  std::fs::write(&output, bytes).expect("write V5-R2C observation");
                  eprintln!("V5R2C_OBSERVATION_PASS");
              }

          '''
          p.write_text(text.replace(anchor, test + anchor, 1))
          PY

          cargo +$RUST_TOOLCHAIN fmt --all
          git diff -- crates/execsurface-observe/src/lib.rs > "$EVIDENCE_ROOT/test-only-harness.diff"
          sha256sum "$EVIDENCE_ROOT/test-only-harness.diff" > "$EVIDENCE_ROOT/test-only-harness.sha256"
          test -s "$EVIDENCE_ROOT/test-only-harness.diff"

      - name: Static public-contract and observer red-team gates
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN fmt --all -- --check
          cargo +$RUST_TOOLCHAIN clippy --locked -p execsurface-observe --all-targets -- -D warnings
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-observe
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-observe --test m11_shared_fd_ambiguity \
            2>&1 | tee "$EVIDENCE_ROOT/public-m11-before-learning.log"
          cargo +$RUST_TOOLCHAIN test --locked --workspace

      - name: Build and falsify corrected baseline helper
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN generate-lockfile \
            --manifest-path experiments/p3-v5-r2c-baseline/Cargo.toml
          cargo +$RUST_TOOLCHAIN fmt \
            --manifest-path experiments/p3-v5-r2c-baseline/Cargo.toml -- --check
          cargo +$RUST_TOOLCHAIN clippy --locked \
            --manifest-path experiments/p3-v5-r2c-baseline/Cargo.toml \
            --all-targets -- -D warnings
          cargo +$RUST_TOOLCHAIN test --locked \
            --manifest-path experiments/p3-v5-r2c-baseline/Cargo.toml \
            2>&1 | tee "$EVIDENCE_ROOT/r2c-baseline-tests.log"
          cargo +$RUST_TOOLCHAIN build --locked \
            --manifest-path experiments/p3-v5-r2c-baseline/Cargo.toml

          cargo +$RUST_TOOLCHAIN generate-lockfile \
            --manifest-path experiments/p3-gcc-temp-grammar/Cargo.toml
          cargo +$RUST_TOOLCHAIN test --locked \
            --manifest-path experiments/p3-gcc-temp-grammar/Cargo.toml \
            2>&1 | tee "$EVIDENCE_ROOT/v2-gcc-grammar-tests.log"

          grep -q 'corrected_default_marks_gcc_tmp_identity_as_temp.*ok' "$EVIDENCE_ROOT/r2c-baseline-tests.log"
          grep -q 'no_tmp_root_control_stays_outside_declared_roots.*ok' "$EVIDENCE_ROOT/r2c-baseline-tests.log"

      - name: Checkout pinned unmodified FZF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          repository: junegunn/fzf
          ref: ${{ env.FZF_SHA }}
          path: external/fzf-v5r2c
          fetch-depth: 1
          persist-credentials: false

      - name: Freeze workload and execute exactly three direct priming runs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_ROOT"
          cp -a external/fzf-v5r2c "$WORK_ROOT"
          test "$(git -C "$WORK_ROOT" rev-parse HEAD)" = "$FZF_SHA"
          test -z "$(git -C "$WORK_ROOT" status --porcelain)"

          : > "$EVIDENCE_ROOT/priming.status"
          prime_fail=0
          for n in 1 2 3; do
            set +e
            (cd "$WORK_ROOT" && go test ./...) \
              > "$GITHUB_WORKSPACE/$EVIDENCE_ROOT/direct-prime-${n}.stdout" \
              2> "$GITHUB_WORKSPACE/$EVIDENCE_ROOT/direct-prime-${n}.stderr"
            rc=$?
            set -e
            printf 'prime_%s_rc=%s\n' "$n" "$rc" | tee -a "$EVIDENCE_ROOT/priming.status"
            if [ "$rc" -ne 0 ]; then prime_fail=1; fi
          done
          test "$prime_fail" -eq 0
          test -z "$(git -C "$WORK_ROOT" status --porcelain --untracked-files=no)"

      - name: Execute exactly six fresh corrected learning attempts without replacement
        shell: bash
        run: |
          set -u
          : > "$EVIDENCE_ROOT/learning.status"
          admitted=0

          for n in 1 2 3 4 5 6; do
            obs="$GITHUB_WORKSPACE/$EVIDENCE_ROOT/observation-${n}.json"
            lock="$GITHUB_WORKSPACE/$EVIDENCE_ROOT/fzf-learn-${n}.lock.json"
            log="$GITHUB_WORKSPACE/$EVIDENCE_ROOT/observe-${n}.log"
            rm -f "$obs" "$lock"

            set +e
            EXECSURFACE_V5R2C_FZF_ROOT="$WORK_ROOT" \
            EXECSURFACE_V5R2C_OBS_PATH="$obs" \
              cargo +$RUST_TOOLCHAIN test --locked -p execsurface-observe --lib \
                v5r2c_write_certificate_aware_observation \
                -- --ignored --nocapture > "$log" 2>&1
            observe_rc=$?
            set -e

            baseline_rc=99
            if [ "$observe_rc" -eq 0 ] && [ -s "$obs" ] && grep -q 'V5R2C_OBSERVATION_PASS' "$log"; then
              set +e
              experiments/p3-v5-r2c-baseline/target/debug/p3-v5-r2c-baseline \
                "$obs" "$lock" 4 "$WORK_ROOT" \
                > "$EVIDENCE_ROOT/baseline-${n}.stdout" \
                2> "$EVIDENCE_ROOT/baseline-${n}.stderr"
              baseline_rc=$?
              set -e
            fi

            admitted_this=0
            if [ "$observe_rc" -eq 0 ] && [ "$baseline_rc" -eq 0 ] && [ -s "$lock" ]; then
              admitted_this=1
              admitted=$((admitted + 1))
              sha256sum "$obs" >> "$EVIDENCE_ROOT/observation-sha256.txt"
              sha256sum "$lock" >> "$EVIDENCE_ROOT/lockfile-sha256.txt"
              grep '^V5R2C_OBSERVATION ' "$log" | tail -1 >> "$EVIDENCE_ROOT/observation-metrics.txt"
              grep '^baseline_digest=' "$EVIDENCE_ROOT/baseline-${n}.stdout" >> "$EVIDENCE_ROOT/baseline-digests.txt"
              grep '^canonical_effects=' "$EVIDENCE_ROOT/baseline-${n}.stdout" >> "$EVIDENCE_ROOT/canonical-effect-counts.txt"
              grep '^semantic_roots=' "$EVIDENCE_ROOT/baseline-${n}.stdout" >> "$EVIDENCE_ROOT/semantic-roots.txt"
            fi

            printf 'learning_%s_observe_rc=%s baseline_rc=%s admitted=%s\n' \
              "$n" "$observe_rc" "$baseline_rc" "$admitted_this" \
              | tee -a "$EVIDENCE_ROOT/learning.status"
          done

          printf 'admitted=%s/6\n' "$admitted" | tee "$EVIDENCE_ROOT/admission-summary.txt"
          test "$admitted" -eq 6
          test -z "$(git -C "$WORK_ROOT" status --porcelain --untracked-files=no)"

      - name: Verify corrected semantic roots and six learning artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < "$EVIDENCE_ROOT/lockfile-sha256.txt")" -eq 6
          test "$(wc -l < "$EVIDENCE_ROOT/observation-sha256.txt")" -eq 6

          python3 - "$EVIDENCE_ROOT" <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          gcc_seen = 0
          for n in range(1, 7):
              obs = json.loads((root / f'observation-{n}.json').read_text())
              assert obs['complete'] is True, (n, obs.get('warnings'))
              assert obs['warnings'] == [], (n, obs['warnings'])
              assert obs['outcome']['exit_code'] == 0, (n, obs['outcome'])
              assert obs['outcome']['signal'] is None, (n, obs['outcome'])

              lock = json.loads((root / f'fzf-learn-{n}.lock.json').read_text())
              assert lock['schema_version'] == 2, (n, lock['schema_version'])
              assert lock['baseline_digest'].startswith('sha256:'), n
              norm = lock['payload']['canonical_surface']['normalization']
              assert 'tmp' in set(norm['semantic_roots']), (n, norm)
              effects = lock['payload']['canonical_surface']['effects']
              for effect in effects:
                  target = (effect.get('target') or {})
                  actor = (effect.get('actor') or {})
                  value = target.get('value', '')
                  if actor.get('family') == 'gcc' and re.fullmatch(r'\$TMP/cc[A-Za-z0-9]{6}\.s', value):
                      assert target.get('class') == 'temp', (n, target)
                      gcc_seen += 1
          print(f'R2C_GCC_TMP_EFFECTS_SEEN={gcc_seen}')
          print('R2C_SIX_LEARNING_ARTIFACTS_VERIFIED')
          PY

      - name: Re-prove default public contract after corrected learning
        shell: bash
        run: |
          set -euo pipefail
          cargo +$RUST_TOOLCHAIN test --locked -p execsurface-observe --test m11_shared_fd_ambiguity \
            2>&1 | tee "$EVIDENCE_ROOT/public-m11-after-learning.log"

      - name: Seal evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          find "$EVIDENCE_ROOT" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_ROOT/SHA256SUMS"

      - name: Upload fresh V5-R2C learning evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p3-v5-r2c-learning-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30
