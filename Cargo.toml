[workspace]
members = [
    "crates/execsurface-model",
    "crates/execsurface-observe",
    "crates/execsurface-normalize",
    "crates/execsurface-baseline",
    "crates/execsurface-bench",
    "crates/execsurface-diff",
    "crates/execsurface-policy",
    "crates/execsurface-report",
    "crates/execsurface-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AETHERXGLOBAL/execsurface"
readme = "README.md"
rust-version = "1.82"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
